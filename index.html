<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>증강 오목</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-controls">
    <button class="settings-btn" id="settings-btn" type="button" aria-expanded="false" aria-controls="settings-panel" data-i18n-aria="settings" aria-label="설정">⚙️</button>
    <button class="lang-toggle" id="lang-toggle" type="button" data-i18n="lang.toggle" data-i18n-aria="lang.aria" aria-label="언어 바꾸기">English</button>
    <div class="settings-panel" id="settings-panel" hidden>
      <div class="settings-title" data-i18n="settings">설정</div>
      <label class="settings-row">
        <input type="checkbox" id="reduce-motion">
        <span data-i18n="settings.reduceMotion">움직임 줄이기</span>
      </label>
      <p class="settings-desc" data-i18n="settings.reduceMotion.desc">카드 발동 연출을 움직임 없는 페이드로 바꾸고, 파티클과 판 흔들림을 끕니다.</p>
    </div>
  </div>
  <h1 data-i18n="title">증강 오목</h1>
  <p class="sub" id="sub-text" data-i18n="sub">3수마다 카드 1장 · 턴마다 카드 1장 사용</p>

  <div id="menu-screen" class="menu-screen">
    <button class="mode-btn" id="mode-tut-btn">
      <div class="mode-icon">📖</div>
      <div class="mode-name" data-i18n="mode.tut">튜토리얼</div>
      <div class="mode-desc" data-i18n="mode.tut.desc">1분 만에 규칙 익히기</div>
    </button>
    <button class="mode-btn" id="mode-local-btn">
      <div class="mode-icon">👥</div>
      <div class="mode-name" data-i18n="mode.local">로컬 모드</div>
      <div class="mode-desc" data-i18n="mode.local.desc">한 기기에서 둘이</div>
    </button>
    <button class="mode-btn" id="mode-bot-btn">
      <div class="mode-icon">🤖</div>
      <div class="mode-name" data-i18n="mode.bot">봇전</div>
      <div class="mode-desc" id="bot-mode-desc">AI와 대결 (5)</div>
    </button>
    <div class="bot-level" role="radiogroup" aria-label="봇 난이도" data-i18n-aria="bot.level">
      <span class="bot-level-label" data-i18n="bot.level">봇 난이도</span>
      <div class="bot-level-options" id="bot-level-options"></div>
      <div class="bot-level-hint" id="bot-level-hint"></div>
    </div>
    <button class="mode-btn" id="mode-mp-btn">
      <div class="mode-icon">🌐</div>
      <div class="mode-name" data-i18n="mode.mp">멀티플레이</div>
      <div class="mode-desc" data-i18n="mode.mp.desc">온라인 대결</div>
    </button>
    <p class="menu-note" id="menu-note"></p>
  </div>

  <div id="lobby-screen" class="lobby-screen" style="display:none;">
    <button class="plain" id="lobby-back-btn" data-i18n="back">← 메뉴로</button>
    <div class="lobby-body" id="lobby-body">
      <div class="first-pick" role="radiogroup" aria-label="선공" data-i18n-aria="first">
        <span class="first-pick-label" data-i18n="first">선공</span>
        <div class="first-pick-options" id="first-pick-options">
          <button type="button" role="radio" data-first="random" aria-checked="true" data-i18n="first.random">🎲 랜덤</button>
          <button type="button" role="radio" data-first="me" aria-checked="false" data-i18n="first.me">내가 먼저</button>
          <button type="button" role="radio" data-first="opp" aria-checked="false" data-i18n="first.opp">상대 먼저</button>
        </div>
      </div>
      <button class="plain" id="create-room-btn" data-i18n="room.create">새 방 만들기</button>
      <div class="lobby-or" data-i18n="or">또는</div>
      <input class="code-input" id="join-code-input" placeholder="방 코드 입력" data-i18n-ph="room.code" lang="en" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="plain" id="join-room-btn" data-i18n="room.join">코드로 참가하기</button>
    </div>
    <div class="room-code-box" id="room-code-box" hidden>
      <span class="room-code-label" data-i18n="room.codeLabel">방 코드</span>
      <span class="room-code-value" id="room-code-value"></span>
    </div>
    <div class="lobby-status" id="lobby-status"></div>
  </div>

  <div id="game-screen" class="game-screen" style="display:none;">
    <button class="plain" id="game-back-btn" data-i18n="back">← 메뉴로</button>
    <div class="game-layout">
    <div class="game-main">
    <div class="status-row">
      <span class="turn-dot black" id="turn-dot"></span>
      <span id="status-text">흑 차례</span>
      <span id="win-length-badge">6목 규칙</span>
      <button class="cancel-btn" id="cancel-btn" data-i18n="cancel">취소</button>
    </div>
    <div class="tut-box" id="tut-box" hidden>
      <span id="tut-text"></span>
      <button class="plain tut-btn" id="tut-btn" hidden></button>
    </div>
    <div class="progress-wrap">
      <span data-i18n="next.card">다음 카드까지</span>
      <span class="pip-row" id="pip-row"></span>
    </div>

    <div class="card-detail" id="card-detail" hidden>
      <div class="cd-panel" role="dialog" aria-modal="true" aria-labelledby="cd-name">
        <div class="cd-icon" id="cd-icon"></div>
        <div class="cd-name" id="cd-name"></div>
        <div class="cd-short" id="cd-short"></div>
        <div class="cd-desc" id="cd-desc"></div>
        <div class="cd-note" id="cd-note"></div>
        <div class="cd-actions">
          <button class="plain cd-use" type="button" id="cd-use"></button>
          <button class="plain" type="button" id="cd-close"></button>
        </div>
      </div>
    </div>
    <div class="confirm-bar" id="confirm-bar">
      <span id="confirm-text"></span>
      <button class="plain confirm-yes" id="confirm-yes-btn" data-i18n="ok">확인</button>
      <button class="plain confirm-no" id="confirm-no-btn" data-i18n="cancel">취소</button>
    </div>

    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="banner"></div>
      <div id="side-overlay">
        <div class="draft-title" data-i18n="side.title">선공/후공 선택</div>
        <div class="draft-sub" data-i18n="side.sub">흑이 먼저 둡니다</div>
        <div class="side-options" id="side-options">
          <button class="side-btn" type="button" data-side="first"><span class="side-stone black"></span><span data-i18n="side.first">선공 (흑)</span></button>
          <button class="side-btn" type="button" data-side="second"><span class="side-stone white"></span><span data-i18n="side.second">후공 (백)</span></button>
          <button class="side-btn" type="button" data-side="random"><span class="side-stone rand">🎲</span><span data-i18n="side.random">랜덤</span></button>
        </div>
      </div>
      <div id="draft-overlay">
        <div class="draft-title" id="draft-title">카드 획득</div>
        <div class="draft-sub">한 장을 골라 패에 넣으세요</div>
        <div class="draft-cards" id="draft-cards"></div>
      </div>
    </div>

    <div class="controls">
      <button class="plain" id="undo-btn" data-i18n="undo">한 수 무르기</button>
      <button class="plain" id="reset-btn" data-i18n="reset">새 게임</button>
    </div>
    <div class="rematch-bar" id="rematch-bar" hidden>
      <span class="rematch-text" id="rematch-text"></span>
      <div class="rematch-options" id="rematch-options">
        <button class="plain" type="button" data-rematch="first" data-i18n="rematch.first">선공(흑)으로</button>
        <button class="plain" type="button" data-rematch="second" data-i18n="rematch.second">후공(백)으로</button>
        <button class="plain" type="button" data-rematch="random" data-i18n="rematch.random">🎲 랜덤</button>
      </div>
    </div>
    </div>

    <aside class="side-panel side-left">
    <div class="hands">
      <div class="hand-row" id="hand-row-1">
        <span class="hand-label" data-i18n="hand.black">흑 패</span>
        <div class="hand-cards-grid" id="hand-cards-1"></div>
        <div class="legend-slot" id="legend-slot-1"></div>
      </div>
      <div class="hand-row" id="hand-row-2">
        <span class="hand-label" data-i18n="hand.white">백 패</span>
        <div class="hand-cards-grid" id="hand-cards-2"></div>
        <div class="legend-slot" id="legend-slot-2"></div>
      </div>
    </div>
    </aside>

    <aside class="side-panel side-right">
      <section class="log-side">
        <div class="side-title" data-i18n="log.title">기록</div>
        <ol class="log-list" id="log-panel"></ol>
      </section>
      <section class="chat-side" id="chat-panel" hidden>
        <div class="side-title" data-i18n="chat.title">채팅</div>
        <ol class="chat-list" id="chat-list"></ol>
        <form class="chat-form" id="chat-form" autocomplete="off">
          <input class="chat-input" id="chat-input" maxlength="200" placeholder="메시지 입력" aria-label="채팅 메시지" data-i18n-ph="chat.ph" data-i18n-aria="chat.aria">
          <button class="plain chat-send" type="submit" data-i18n="chat.send">전송</button>
        </form>
      </section>
    </aside>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue, push, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB-eP5kD_xudBE6-MXt1KLkKxZEKmD6-Sg",
    authDomain: "gomoku-3f050.firebaseapp.com",
    databaseURL: "https://gomoku-3f050-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "gomoku-3f050",
    storageBucket: "gomoku-3f050.firebasestorage.app",
    messagingSenderId: "591915118208",
    appId: "1:591915118208:web:d53298e42473674dc30065",
  };

  try {
    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    window.__fb = {
      ready: true,
      setPath: (path, data) => set(ref(rtdb, path), data),
      getPath: async (path) => {
        const snap = await get(ref(rtdb, path));
        const ex = snap.exists();
        return { exists: ex, data: () => (ex ? snap.val() : undefined) };
      },
      updatePath: (path, data) => update(ref(rtdb, path), data),
      onPath: (path, cb, errCb) => onValue(ref(rtdb, path), (snap) => {
        const ex = snap.exists();
        cb({ exists: ex, data: () => (ex ? snap.val() : undefined) });
      }, errCb),
      pushPath: (path, data) => push(ref(rtdb, path), data),
      // path 아래 자식들 중 최근 n개를 배열로 전달
      onPathLast: (path, n, cb, errCb) => onValue(query(ref(rtdb, path), limitToLast(n)), (snap) => {
        const items = [];
        snap.forEach((child) => { items.push(child.val()); });
        cb(items);
      }, errCb),
    };
  } catch (e) {
    window.__fb = { ready: false };
  }
  window.dispatchEvent(new Event('fb-ready'));
</script>

<script src="js/assets.js"></script>
<script src="js/cards.js"></script>
<script src="js/game.js"></script>
<script src="js/legend.js"></script>
<script src="js/alkkagi.js"></script>
<script src="js/multiplayer.js"></script>
<script src="js/bot.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
