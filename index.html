  }

  // ================= 봇 AI (난이도 1 / 3 / 5 / 7 / 10) =================
  // radius: 돌 주변 몇 칸까지 후보로 보는지 (인지 영역)
  // depth: 몇 수 앞까지 읽는지 (0 = 현재 수만 평가), width: 탐색 시 각 단계에서 검토하는 후보 수
  // topN: 상위 몇 개 후보 중 무작위로 고르는지, defense: 수비 가중치
  // missChance: 상대 위협을 못 보고 넘어갈 확률, patterns: 띈 3·4·쌍삼 등 패턴 인식 여부
  // smartCards: 카드를 상황에 맞게 쓰는지 (아니면 무작위), vcf: 연속 4로 끝내는 수순 탐색 여부
  const BOT_LEVELS = {
    1:  { radius: 1, depth: 0, width: 0,  topN: 6, defense: 0.5,  missChance: 0.4, patterns: false, smartCards: false, vcf: false },
    3:  { radius: 2, depth: 0, width: 0,  topN: 3, defense: 0.85, missChance: 0.1, patterns: false, smartCards: false, vcf: false },
    5:  { radius: 2, depth: 0, width: 0,  topN: 1, defense: 0.9,  missChance: 0,   patterns: true,  smartCards: true,  vcf: false },
    7:  { radius: 2, depth: 2, width: 12, topN: 1, defense: 1,    missChance: 0,   patterns: true,  smartCards: true,  vcf: false },
    10: { radius: 3, depth: 4, width: 10, topN: 1, defense: 1,    missChance: 0,   patterns: true,  smartCards: true,  vcf: true  },
  };
  const BOT_LEVEL_LIST = [1, 3, 5, 7, 10];
  let botLevel = 5;
  try { const saved = parseInt(localStorage.getItem('omok_bot_level'), 10); if (BOT_LEVELS[saved]) botLevel = saved; } catch (e) {}
  function botCfg() { return BOT_LEVELS[botLevel] || BOT_LEVELS[5]; }

  let botTimer = null;
  function scheduleMaybeBotTurn() {
    if (botTimer) return;
    botTimer = setTimeout(() => { botTimer = null; maybeBotTurn(); }, 650);
  }

  function maybeBotTurn() {
    if (mode !== 'bot' || gameOver || draftOpen || pendingTarget || alk) return;
    const botColor = other(myColor);
    if (current !== botColor) return;
    if (!usedCardThisTurn[botColor] && hand[botColor].length > 0) {
      if (botCfg().smartCards) botUseCardSmart(botColor);
      else if (Math.random() < 0.5) botUseCard(botColor);
    }
    if (!gameOver && current === botColor && !draftOpen && !pendingTarget && !alk) {
      botPlaceStone(botColor);
    }
  }

  // ---- 저난이도: 무작위 카드 사용 ----
  function botUseCard(botColor) {
    const opp = other(botColor);
    const usable = hand[botColor].map((c, i) => ({ c, i })).filter(({ c }) => {
      if (c.type === 'remove_enemy') return hasStoneOf(opp);
      if (c.type === 'self_remove' || c.type === 'windmill' || c.type === 'teleport') return hasStoneOf(botColor);
      if (c.type === 'trade') return hasStoneOf(BLACK) && hasStoneOf(WHITE);
      if (c.type === 'trap') return hasEmptyCell();
      if (c.type === 'six_sense') return winLength !== 6;
      return true;
    });
    if (usable.length === 0) return;
    const chosen = usable[Math.floor(Math.random() * usable.length)];
    useCard(botColor, chosen.i);
    if (pendingTarget && pendingTarget.forPlayer === botColor) resolveBotPendingTarget();
  }

  function resolveBotPendingTarget() {
    const t = pendingTarget;
    if (!t) return;
    let candidates = [];
    if (t.type === 'remove') {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === t.opponent) candidates.push({ r, c });
    } else if (t.type === 'self_remove' || t.type === 'windmill' || t.type === 'teleport') {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === t.forPlayer) candidates.push({ r, c });
    } else if (t.type === 'trap') {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === EMPTY) candidates.push({ r, c });
    } else if (t.type === 'trade') {
      if (t.stage === 'first') {
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (isStone(board[r][c])) candidates.push({ r, c });
      } else {
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (isStone(board[r][c]) && board[r][c] !== t.firstPos.color) candidates.push({ r, c });
      }
    }
    if (candidates.length === 0) { cancelTarget(); return; }
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    handleTargetClick(pick);
    if (pendingTarget && pendingTarget.type === 'trade' && pendingTarget.stage === 'second') {
      resolveBotPendingTarget();
    }
  }

  // ---- 공통 보조 함수 ----
  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  function inBoard(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

  // player가 둘 수 없는 칸 (상대 풍차 주변) 표시
  function buildBlockedGrid(player) {
    const g = new Uint8Array(SIZE * SIZE);
    for (const w of windmillList) {
      if (!isStone(board[w.r][w.c]) || board[w.r][w.c] === player) continue;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const r = w.r + dr, c = w.c + dc;
        if (inBoard(r, c)) g[r * SIZE + c] = 1;
      }
    }
    return g;
  }
  function makeBlocked() { return { [BLACK]: buildBlockedGrid(BLACK), [WHITE]: buildBlockedGrid(WHITE) }; }

  function collectCandidates(player, radius, blocked, respectChain) {
    radius = radius || 2;
    let any = false;
    for (let r = 0; r < SIZE && !any; r++) for (let c = 0; c < SIZE; c++) if (isStone(board[r][c])) { any = true; break; }
    const chainActive = respectChain !== false && turnPlacementsDone > 0 && turnPlacedPositions.length > 0;
    const isBlocked = (r, c) => blocked ? blocked[player][r * SIZE + c] : isBlockedForPlayer(r, c, player);
    function farEnough(r, c) {
      if (!chainActive) return true;
      return !turnPlacedPositions.some(p => Math.max(Math.abs(r - p.r), Math.abs(c - p.c)) <= 2);
    }
    if (!any) return [{ r: 7, c: 7 }];
    const cands = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== EMPTY || isBlocked(r, c)) continue;
      if (!farEnough(r, c)) continue;
      let near = false;
      for (let dr = -radius; dr <= radius && !near; dr++) for (let dc = -radius; dc <= radius && !near; dc++) {
        const nr = r + dr, nc = c + dc;
        if (inBoard(nr, nc) && isStone(board[nr][nc])) near = true;
      }
      if (near) cands.push({ r, c });
    }
    if (cands.length) return cands;
    const fallback = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === EMPTY && !isBlocked(r, c) && farEnough(r, c)) fallback.push({ r, c });
    }
    return fallback;
  }

  // ---- 저난이도용 단순 평가: 연속으로 붙은 돌만 셈 ----
  function lineScore(r, c, dr, dc, player) {
    let count = 1, openEnds = 0;
    let rr = r + dr, cc = c + dc;
    while (inBoard(rr, cc) && board[rr][cc] === player) { count++; rr += dr; cc += dc; }
    if (inBoard(rr, cc) && board[rr][cc] === EMPTY) openEnds++;
    rr = r - dr; cc = c - dc;
    while (inBoard(rr, cc) && board[rr][cc] === player) { count++; rr -= dr; cc -= dc; }
    if (inBoard(rr, cc) && board[rr][cc] === EMPTY) openEnds++;

    if (count >= winLength) return 10000000;
    const gap = winLength - count;
    if (gap === 1) return openEnds === 2 ? 500000 : openEnds === 1 ? 50000 : 0;
    if (gap === 2) return openEnds === 2 ? 5000 : openEnds === 1 ? 500 : 0;
    if (gap === 3) return openEnds === 2 ? 200 : openEnds === 1 ? 50 : 0;
    return count * 2 + openEnds;
  }

  function simpleCellScore(r, c, player, defense) {
    const opp = other(player);
    board[r][c] = player;
    let offense = 0;
    for (const [dr, dc] of DIRS) offense = Math.max(offense, lineScore(r, c, dr, dc, player));
    board[r][c] = opp;
    let def = 0;
    for (const [dr, dc] of DIRS) def = Math.max(def, lineScore(r, c, dr, dc, opp));
    board[r][c] = EMPTY;
    return offense + def * defense;
  }

  // ---- 패턴 인식: 한 방향으로 winLength 칸짜리 창(window)을 밀면서 모양을 판단 ----
  // board[r][c]에 player 돌이 놓였다고 가정하고 호출
  function lineShape(r, c, dr, dc, player, blk) {
    const L = winLength;
    let best = 0, winCell = -1, winCells = 0, near = 0;
    for (let s = -(L - 1); s <= 0; s++) {
      let n = 0, ok = true, empty = -1;
      for (let k = 0; k < L; k++) {
        const rr = r + (s + k) * dr, cc = c + (s + k) * dc;
        if (!inBoard(rr, cc)) { ok = false; break; }
        const v = board[rr][cc];
        if (v === player) n++;
        else if (v === EMPTY && !blk[rr * SIZE + cc]) empty = rr * SIZE + cc;
        else { ok = false; break; }
      }
      if (!ok) continue;
      if (n > best) best = n;
      if (n === L - 1 && empty !== winCell) { if (winCell === -1 || winCells < 2) winCells++; winCell = empty; }
      if (n === L - 2) near++;
    }
    return { best, winCells, near };
  }

  const P_FIVE = 10000000, P_OPEN4 = 1000000, P_FOUR = 100000, P_OPEN3 = 10000, P_THREE = 1000, P_OPEN2 = 300, P_TWO = 50;

  // player가 (r,c)에 두었을 때의 공격 가치
  function attackValue(r, c, player, blk) {
    const L = winLength;
    board[r][c] = player;
    let score = 0, fours = 0, open3 = 0, five = false;
    for (const [dr, dc] of DIRS) {
      const s = lineShape(r, c, dr, dc, player, blk);
      if (s.best >= L) { five = true; break; }
      if (s.winCells >= 2) { score += P_OPEN4; fours += 2; }
      else if (s.winCells === 1) { score += P_FOUR; fours++; }
      else if (s.best === L - 2) { if (s.near >= 2) { score += P_OPEN3; open3++; } else score += P_THREE; }
      else if (s.best === L - 3) score += s.near >= 1 ? P_OPEN2 : P_TWO;
      else score += s.best;
    }
    board[r][c] = EMPTY;
    if (five) return { score: P_FIVE, five: true, fours: 0 };
    if (fours >= 2 || (fours >= 1 && open3 >= 1)) score += P_OPEN4 / 2; // 4-4, 4-3: 사실상 필승
    else if (open3 >= 2) score += P_OPEN3 * 5;                           // 3-3
    return { score, five: false, fours };
  }

  function patternCellScore(r, c, player, blocked, defense) {
    const opp = other(player);
    const a = attackValue(r, c, player, blocked[player]);
    const d = blocked[opp][r * SIZE + c] ? { score: 0, five: false } : attackValue(r, c, opp, blocked[opp]);
    return { score: a.score + d.score * defense, win: a.five, mustBlock: d.five, fours: a.fours };
  }

  // ---- 판 전체 평가 (탐색의 말단에서 사용) ----
  function windowWeight(n) {
    const g = winLength - n;
    return g <= 0 ? 10000000 : g === 1 ? 800 : g === 2 ? 70 : g === 3 ? 8 : g === 4 ? 1 : 0;
  }
  function evalBoard(me, blocked) {
    const opp = other(me), L = winLength;
    let sMe = 0, sOpp = 0;
    for (const [dr, dc] of DIRS) {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
        const er = r + (L - 1) * dr, ec = c + (L - 1) * dc;
        if (!inBoard(er, ec)) continue;
        let nMe = 0, nOpp = 0, bMe = false, bOpp = false;
        for (let k = 0; k < L; k++) {
          const rr = r + k * dr, cc = c + k * dc, v = board[rr][cc];
          if (v === me) nMe++;
          else if (v === opp) nOpp++;
          else { const i = rr * SIZE + cc; if (blocked[me][i]) bMe = true; if (blocked[opp][i]) bOpp = true; }
        }
        if (nOpp === 0 && nMe > 0 && !bMe) sMe += windowWeight(nMe);
        if (nMe === 0 && nOpp > 0 && !bOpp) sOpp += windowWeight(nOpp);
      }
    }
    return sMe - sOpp * 1.1;
  }

  // ---- 수 읽기 (알파-베타 탐색) ----
  const WIN_SCORE = 1e9;
  let searchDeadline = 0;

  function orderedMoves(player, blocked, cfg, width, isRoot) {
    const cands = collectCandidates(player, cfg.radius, blocked, isRoot);
    const scored = [];
    let blocks = [];
    for (const p of cands) {
      const s = patternCellScore(p.r, p.c, player, blocked, cfg.defense);
      if (s.win) return { win: p, list: [p] };
      if (s.mustBlock) blocks.push({ r: p.r, c: p.c, score: s.score });
      scored.push({ r: p.r, c: p.c, score: s.score });
    }
    // 상대가 다음 수에 이기는 자리가 있으면 그 자리를 막는 수만 검토
    const list = blocks.length ? blocks : scored;
    list.sort((a, b) => b.score - a.score);
    return { win: null, list: width ? list.slice(0, width) : list, forced: blocks.length > 0 };
  }

  function negamax(player, depth, alpha, beta, blocked, cfg) {
    const moves = orderedMoves(player, blocked, cfg, cfg.width, false);
    if (moves.win) return WIN_SCORE + depth;
    if (!moves.list.length) return 0;
    if (depth <= 0 || Date.now() > searchDeadline) return evalBoard(player, blocked);
    const opp = other(player);
    let best = -Infinity;
    for (const m of moves.list) {
      board[m.r][m.c] = player;
      const v = -negamax(opp, depth - 1, -beta, -alpha, blocked, cfg);
      board[m.r][m.c] = EMPTY;
      if (v > best) best = v;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  // ---- 연속 4(VCF) 탐색: 계속 4를 만들어 상대가 막을 수밖에 없게 몰아 이기는 수순 ----
  function findWinCells(player, blk) {
    const cells = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== EMPTY || blk[r * SIZE + c]) continue;
      board[r][c] = player;
      const w = checkWin(r, c, player);
      board[r][c] = EMPTY;
      if (w) cells.push({ r, c });
    }
    return cells;
  }

  function vcf(player, depth, blocked, isRoot) {
    if (depth <= 0 || Date.now() > searchDeadline) return null;
    const opp = other(player);
    if (findWinCells(opp, blocked[opp]).length) return null; // 상대가 먼저 이길 수 있으면 불가
    const cands = collectCandidates(player, 2, blocked, !!isRoot);
    for (const p of cands) {
      const a = attackValue(p.r, p.c, player, blocked[player]);
      if (a.five) return p;
      if (a.fours < 1) continue;
      board[p.r][p.c] = player;
      const wins = findWinCells(player, blocked[player]);
      let ok = false;
      if (wins.length >= 2) ok = true;
      else if (wins.length === 1) {
        const w = wins[0];
        if (!blocked[opp][w.r * SIZE + w.c]) {
          board[w.r][w.c] = opp;
          ok = !checkWin(w.r, w.c, opp) && vcf(player, depth - 1, blocked) !== null;
          board[w.r][w.c] = EMPTY;
        } else ok = true; // 상대가 막을 수 없는 자리
      }
      board[p.r][p.c] = EMPTY;
      if (ok) return p;
    }
    return null;
  }

  function botChooseMove(botColor) {
    const cfg = botCfg();
    const blocked = makeBlocked();
    const opp = other(botColor);

    if (!cfg.patterns) {
      const cands = collectCandidates(botColor, cfg.radius, blocked, true);
      if (!cands.length) return null;
      const defense = Math.random() < cfg.missChance ? 0.1 : cfg.defense;
      const scored = cands.map(p => ({ r: p.r, c: p.c, score: simpleCellScore(p.r, p.c, botColor, defense) }));
      scored.sort((a, b) => b.score - a.score);
      const pool = scored.slice(0, Math.min(cfg.topN, scored.length));
      return pool[Math.floor(Math.random() * pool.length)];
    }

    searchDeadline = Date.now() + 1500;
    const root = orderedMoves(botColor, blocked, cfg, 0, true);
    if (root.win) return root.win;
    if (!root.list.length) return null;
    if (root.forced && root.list.length === 1) return root.list[0];

    if (cfg.vcf && !root.forced) {
      const v = vcf(botColor, 8, blocked, true);
      if (v) return v;
    }

    if (cfg.depth <= 0) return root.list[0];

    const moves = root.list.slice(0, cfg.width);
    let best = moves[0], bestVal = -Infinity, alpha = -Infinity;
    for (const m of moves) {
      board[m.r][m.c] = botColor;
      const v = -negamax(opp, cfg.depth - 1, -Infinity, -alpha, blocked, cfg) + m.score * 1e-6; // 동점이면 패턴 점수가 높은 수
      board[m.r][m.c] = EMPTY;
      if (v > bestVal) { bestVal = v; best = m; }
      if (v > alpha) alpha = v;
      if (Date.now() > searchDeadline) break;
    }
    return best;
  }

  function botPlaceStone(botColor) {
    const pick = botChooseMove(botColor);
    if (pick) handlePlace({ r: pick.r, c: pick.c });
    // 규칙상 거부된 경우(연속 착수 거리 제한 등) 둘 수 있는 자리 중 하나로 대신 둔다
    if (pick && board[pick.r][pick.c] === EMPTY && current === botColor && !gameOver) {
      const legal = collectCandidates(botColor, 2, null, true);
      if (legal.length) {
        const alt = legal.map(p => ({ p, s: simpleCellScore(p.r, p.c, botColor, 1) })).sort((a, b) => b.s - a.s)[0].p;
        handlePlace(alt);
      }
    }
  }

  // ---- 고난이도: 상황을 보고 카드 사용 ----
  function listStones(color) {
    const out = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === color) out.push({ r, c });
    return out;
  }

  function botUseCardSmart(botColor) {
    const opp = other(botColor);
    const blocked = makeBlocked();
    const myWins = findWinCells(botColor, blocked[botColor]);
    if (myWins.length) return; // 바로 이길 수 있으면 카드 없이 둔다
    const oppWins = findWinCells(opp, blocked[opp]);
    const base = evalBoard(botColor, blocked);
    const oppHasCards = hand[opp].length > 0;
    let best = null;
    const consider = (idx, value, targets) => { if (value > 0 && (!best || value > best.value)) best = { idx, value, targets }; };

    hand[botColor].forEach((card, idx) => {
      switch (card.type) {
        case 'chain_move':
          consider(idx, 3000 + (oppWins.length >= 2 ? 50000 : 0));
          break;
        case 'remove_enemy': {
          // 다음 턴을 쉬는 대가가 크므로, 상대의 막을 수 없는 위협을 끊을 때만 사용
          if (oppWins.length < 2) break;
          let bestT = null, bestGain = -Infinity;
          for (const s of listStones(opp)) {
            board[s.r][s.c] = EMPTY;
            const remain = findWinCells(opp, blocked[opp]).length;
            const gain = evalBoard(botColor, blocked) - base - remain * 1e6;
            board[s.r][s.c] = opp;
            if (gain > bestGain) { bestGain = gain; bestT = s; }
          }
          if (bestT) consider(idx, 40000, [bestT]);
          break;
        }
        case 'windmill': {
          // 상대가 둬야 할 자리를 풍차로 막는다
          let bestT = null, bestGain = 0;
          for (const s of listStones(botColor)) {
            if (windmillList.some(w => w.r === s.r && w.c === s.c)) continue;
            let gain = 0;
            for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
              const r = s.r + dr, c = s.c + dc;
              if ((!dr && !dc) || !inBoard(r, c) || board[r][c] !== EMPTY || blocked[opp][r * SIZE + c]) continue;
              gain += Math.min(attackValue(r, c, opp, blocked[opp]).score, P_OPEN4);
            }
            if (gain > bestGain) { bestGain = gain; bestT = s; }
          }
          if (bestT && bestGain >= P_THREE) consider(idx, Math.min(bestGain, 60000), [bestT]);
          break;
        }
        case 'trade': {
          let bestPair = null, bestGain = 0;
          const mine = listStones(botColor), theirs = listStones(opp);
          for (const a of theirs) for (const b of mine) {
            board[a.r][a.c] = botColor; board[b.r][b.c] = opp;
            const makesWin = checkWin(a.r, a.c, botColor) || checkWin(b.r, b.c, opp);
            const gain = makesWin ? -Infinity : evalBoard(botColor, blocked) - base;
            board[a.r][a.c] = opp; board[b.r][b.c] = botColor;
            if (gain > bestGain) { bestGain = gain; bestPair = [a, b]; }
          }
          if (bestPair && bestGain > 400) consider(idx, bestGain, bestPair);
          break;
        }
        case 'six_sense': {
          if (winLength === 6) break;
          winLength = 6;
          const gain = evalBoard(botColor, blocked) - base * 0.2; // 규칙이 바뀌면 점수 규모가 달라지므로 보정
          const oppWins6 = findWinCells(opp, blocked[opp]).length;
          winLength = 5;
          if (oppWins.length && !oppWins6) consider(idx, 45000);
          else if (gain > 800) consider(idx, gain);
          break;
        }
        case 'reversal': {
          const flipped = -evalBoard(botColor, blocked); // 색이 바뀌면 상대 관점 평가가 내 평가가 됨
          if (flipped - base > 3000) consider(idx, flipped - base);
          break;
        }
        case 'trap': {
          // 상대가 가장 두고 싶어하는 자리 (내가 둘 자리와는 겹치지 않게)
          const cands = collectCandidates(opp, 2, blocked, false)
            .filter(p => !trapList.some(t => t.r === p.r && t.c === p.c))
            .map(p => ({ p, s: attackValue(p.r, p.c, opp, blocked[opp]).score - attackValue(p.r, p.c, botColor, blocked[botColor]).score }))
            .sort((a, b) => b.s - a.s);
          if (cands.length) consider(idx, 1500, [cands[0].p]);
          break;
        }
        case 'blockade':
          if (oppHasCards) consider(idx, 1200);
          break;
        case 'infection': {
          if (oppWins.length) break; // 턴이 끝나므로 막아야 할 때는 쓰지 않음
          const targets = getOrthogonalEnemyNeighbors(botColor);
          if (targets.length < 2) break;
          let sum = 0;
          for (const t of targets) {
            board[t.r][t.c] = botColor;
            sum += evalBoard(botColor, blocked) - base;
            board[t.r][t.c] = opp;
          }
          const expected = (sum / targets.length) * Math.min(2, targets.length);
          if (expected > 2500) consider(idx, expected);
          break;
        }
        case 'earthquake':
        case 'alkkagi':
          // 무작위성이 큰 카드는 크게 불리할 때만
          if (oppWins.length >= 2 || base < -4000) consider(idx, 800);
          break;
        case 'teleport':
          break;
      }
    });

    if (!best) return;
    useCard(botColor, best.idx);
    const t = pendingTarget;
    if (!t || t.forPlayer !== botColor) return;
    if (best.targets && best.targets.length) {
      for (const pos of best.targets) {
        if (!pendingTarget) break;
        handleTargetClick(pos);
      }
      if (pendingTarget) cancelTarget();
    } else {
      resolveBotPendingTarget();
    }
  }

  // 봇의 카드 드래프트: 고난이도는 강한 카드를 우선
  const BOT_CARD_PRIORITY = ['chain', 'windmill', 'bomb', 'trap', 'sixsense', 'trade', 'blockade', 'infection', 'reversal', 'teleport', 'earthquake', 'alkkagi'];
  function botPickDraft(picks) {
    if (!botCfg().smartCards) return picks[Math.floor(Math.random() * picks.length)];
    return picks.slice().sort((a, b) => BOT_CARD_PRIORITY.indexOf(a.id) - BOT_CARD_PRIORITY.indexOf(b.id))[0];
  }

  // ---- 봇의 알까기 발사 판단 ----
  function checkBotAlkTurn() {
    if (mode !== 'bot' || !alk || !alk.awaitingLaunch || alk.simulating) return;
    const botColor = other(myColor);
    const flicker = alk.turnOrder[alk.turnIndex];
    if (flicker !== botColor) return;
    setTimeout(botDoAlkFlick, 700);
  }

  function botDoAlkFlick() {
    if (mode !== 'bot' || !alk || !alk.awaitingLaunch || alk.simulating) return;
    const botColor = other(myColor);
    if (alk.turnOrder[alk.turnIndex] !== botColor) return;
    const ns = alk.physStones[alk.newIndex];
    const oppColor = other(botColor);

    // 상대 돌들의 무게중심을 대충 겨냥 (없으면 보드 중앙), 약간의 무작위 편차 추가
    let sx = 0, sy = 0, n = 0;
    alk.physStones.forEach(s => {
      if (s !== ns && s.color === oppColor) { sx += s.x; sy += s.y; n++; }
    });
    let targetX = n > 0 ? sx / n : GRID_OFFSET_X + GRID_SPAN / 2;
    let targetY = n > 0 ? sy / n : PAD + GRID_SPAN / 2;
    targetX += (Math.random() - 0.5) * CELL * 4;
    targetY += (Math.random() - 0.5) * CELL * 4;

    let dx = targetX - ns.x, dy = targetY - ns.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = CELL * (0.6 + Math.random() * 0.8);
    ns.vx = (dx / dist) * speed;
    ns.vy = (dy / dist) * speed;

    alk.awaitingLaunch = false;
    alk.simulating = true;
    alk.frameCount = 0;
    updateStatus();
    requestAnimationFrame(simulateAlkTick);
  }

  // ================= 메뉴 / 로비 UI =================
  modeLocalBtn.addEventListener('click', () => { mode = 'local'; myColor = BLACK; init(); showScreen('game'); });
  modeBotBtn.addEventListener('click', () => {
    mode = 'bot'; myColor = BLACK; init(); showScreen('game');
    addLog(`🤖 봇 난이도 ${botLevel}`);
  });

  const BOT_LEVEL_HINTS = {
    1: '입문 — 바로 옆만 보고, 위협을 자주 놓침',
    3: '초급 — 붙은 돌만 세고 가끔 실수함',
    5: '중급 — 띈 3·4, 쌍삼을 알아보고 카드를 상황에 맞게 씀',
    7: '고급 — 2수 앞까지 읽음',
    10: '최상급 — 4수 앞 + 연속 4로 끝내는 수순까지 탐색',
  };
  const botLevelOptions = document.getElementById('bot-level-options');
  const botLevelHint = document.getElementById('bot-level-hint');
  const botModeDesc = document.getElementById('bot-mode-desc');
  function renderBotLevel() {
    botLevelOptions.innerHTML = '';
    for (const lv of BOT_LEVEL_LIST) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(lv === botLevel));
      b.textContent = lv;
      b.addEventListener('click', () => {
        botLevel = lv;
        try { localStorage.setItem('omok_bot_level', String(lv)); } catch (e) {}
        renderBotLevel();
      });
      botLevelOptions.appendChild(b);
    }
    botLevelHint.textContent = BOT_LEVEL_HINTS[botLevel];
    botModeDesc.textContent = `AI를 상대로 대전 (난이도 ${botLevel})`;
  }
  renderBotLevel();
  modeMpBtn.addEventListener('click', () => {
    lobbyStatus.textContent = '';
    joinCodeInput.value = '';
    showScreen('lobby');
  });
  lobbyBackBtn.addEventListener('click', () => {
    if (unsubPublic) { unsubPublic(); unsubPublic = null; }
    unsubscribeChat();
    showScreen('menu');
  });
  gameBackBtn.addEventListener('click', () => {
    if (mode === 'multiplayer' && roomCode && dbApi && !gameOver) {
      gameOver = true;
      showBanner((myColor === BLACK ? '흑' : '백') + '이(가) 게임을 나갔습니다');
    }
    if (unsubPublic) { unsubPublic(); unsubPublic = null; }
    unsubscribeChat();
    mode = 'local';
    showScreen('menu');
  });
  createRoomBtn.addEventListener('click', createRoom);
  joinRoomBtn.addEventListener('click', () => joinRoom(joinCodeInput.value));

  canvas.addEventListener('click', function (e) {
    if (!alk) handleCanvasClick(e);
  });

  canvas.addEventListener('mousedown', function (e) { if (alk) tryStartDrag(rawPosFromEvent(e)); });
  canvas.addEventListener('mousemove', function (e) { if (alk && alk.dragging) updateDrag(rawPosFromEvent(e)); });
  window.addEventListener('mouseup', function (e) { if (alk && alk.dragging) releaseDrag(rawPosFromEvent(e)); });

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (alk) tryStartDrag(rawPosFromEvent(e));
    else handleCanvasClick(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (alk && alk.dragging) updateDrag(rawPosFromEvent(e));
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (alk && alk.dragging) releaseDrag(rawPosFromEvent(e));
  }, { passive: false });

  undoBtn.addEventListener('click', () => { if (mode !== 'multiplayer') undo(); });
  resetBtn.addEventListener('click', () => {
    if (mode === 'multiplayer') {
      if (gameOver) startRematch();
    } else {
      init();
    }
  });
  cancelBtn.addEventListener('click', cancelTarget);

  confirmYesBtn.addEventListener('click', () => {
    if (pendingPlacement) {
      const pos = pendingPlacement;
      pendingPlacement = null;
      hideConfirmBar();
      handlePlace(pos);
      if (mode === 'multiplayer') { syncPublicState(); savePrivateState(); }
    } else if (pendingCardUse) {
      const { player, idx } = pendingCardUse;
      pendingCardUse = null;
      hideConfirmBar();
      useCard(player, idx);
      if (mode === 'multiplayer') { syncPublicState(); savePrivateState(); }
    } else if (pendingTargetCell) {
      const pos = pendingTargetCell;
      pendingTargetCell = null;
      hideConfirmBar();
      handleTargetClick(pos);
      if (mode === 'multiplayer') { syncPublicState(); savePrivateState(); }
    }
  });

  confirmNoBtn.addEventListener('click', () => {
    clearAllPending();
    draw();
  });

  showScreen('menu');
})();
</script>
</body>
</html>
