      turnPlacementsDone, turnPlacementsNeeded,
      usedCardThisTurn, cardLockNextTurn, skipNextTurn, placedCount,
      gameOver, winLine, lastMovePos,
      players: mpPlayers,
      notice: mpNotice, noticeSeq: mpNoticeSeq,
      bannerText: mpBannerText,
      shakeSeq: mpShakeSeq,
      restartSeq: mpRestartSeq,
      alkActive: !!(alk || alkHandoff),
      alkTurnOrder: alkOrderNow,
      alkTurnIndex: alkIndexNow,
      alkLaunch: mpAlkLaunch,
      cardFx: mpCardFx,
    };
  }

  let publicSyncBusy = false, publicSyncQueued = false;
  async function syncPublicState() {
    if (mode !== 'multiplayer' || !dbApi || !roomCode) return;
    if (publicSyncBusy) { publicSyncQueued = true; return; }
    publicSyncBusy = true;
    try { await dbApi.setPath('games/' + roomCode, buildPublicState()); } catch (e) {}
    publicSyncBusy = false;
    if (publicSyncQueued) { publicSyncQueued = false; syncPublicState(); }
  }

  let privateSyncBusy = false, privateSyncQueued = false;
  async function savePrivateState() {
    if (mode !== 'multiplayer' || !dbApi || !roomCode) return;
    if (privateSyncBusy) { privateSyncQueued = true; return; }
    privateSyncBusy = true;
    try { await dbApi.setPath('private/' + myUserId + '/games_' + roomCode, { hand: hand[myColor], traps: trapList }); } catch (e) {}
    privateSyncBusy = false;
    if (privateSyncQueued) { privateSyncQueued = false; savePrivateState(); }
  }

  async function loadPrivateState() {
    if (mode !== 'multiplayer' || !dbApi || !roomCode) return;
    try {
      const snap = await dbApi.getPath('private/' + myUserId + '/games_' + roomCode);
      if (snap.exists) {
        const data = snap.data() || {};
        hand[myColor] = data.hand || hand[myColor] || [];
        trapList = data.traps || trapList || [];
      }
    } catch (e) {}
  }

  function setNotice(text) { mpNotice = text; mpNoticeSeq++; lastSeenNoticeSeq = mpNoticeSeq; }

  // ---- 카드 발동 연출 ----
  const FX_COLORS = {
    chain: ['#ffe066', '#ffd23f', '#fff3b0'], windmill: ['#5ee6d0', '#3cc9b5', '#bff7ee'], sixsense: ['#b784ff', '#d9b8ff', '#8d5cf6'],
    trade: ['#7fc8ff', '#ffffff', '#3f8cff'], bomb: ['#ff5a36', '#ffae42', '#ffd166'], reversal: ['#ffffff', '#222222', '#bbbbbb'],
    alkkagi: ['#ff6b6b', '#ffd166', '#4ecdc4'], teleport: ['#fff7a8', '#c9a7ff', '#ffffff'], earthquake: ['#c0894f', '#8a5a2b', '#e8c39e'],
    blockade: ['#ff4d6d', '#ffffff', '#c9184a'], trap: ['#c8a165', '#7f5539', '#ffd6a5'], infection: ['#7cfc00', '#2ecc71', '#b5ff6b'],
    shield: ['#5aa0ff', '#cfe3ff', '#ffffff'], steal: ['#ffd166', '#9b5de5', '#ffffff'], timestop: ['#a0e9ff', '#ffffff', '#5aa0ff'],
    wall: ['#8d7b68', '#c4b29c', '#5c4b3a'], rewind: ['#c77dff', '#ffffff', '#7b2cbf'], reroll: ['#ff9f1c', '#ffffff', '#2ec4b6'], magnet: ['#ef233c', '#8d99ae', '#edf2f4'],
  };
  const FX_DEFAULT = ['#7cfc00', '#ffd700', '#adff2f']; // 토템 기본색 (초록·노랑)

  function playCardAnim(cardId, player, done) {
    const card = CARD_POOL.find(c => c.id === cardId);
    if (cardAnimInstant || !card || !boardWrapEl) { done && done(); return; }
    cardAnimBusy = true;
    updateHandUI();
    const layer = document.createElement('div');
    layer.className = 'totem-layer' + (reduceMotion ? ' reduced' : '');
    const cardEl = document.createElement('div');
    cardEl.className = 'totem-card';
    const who = document.createElement('div'); who.className = 'totem-who'; who.textContent = t('fx.who', { color: player });
    const icon = document.createElement('div'); icon.className = 'totem-icon'; icon.textContent = card.icon;
    const name = document.createElement('div'); name.className = 'totem-name'; name.textContent = cardName(card);
    cardEl.append(who, icon, name);
    layer.appendChild(cardEl);
    if (!reduceMotion) {
      const colors = FX_COLORS[card.id] || FX_DEFAULT;
      for (let i = 0; i < 34; i++) {
        const pt = document.createElement('span');
        pt.className = 'totem-particle';
        const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 190;
        pt.style.setProperty('--dx', Math.round(Math.cos(ang) * dist) + 'px');
        pt.style.setProperty('--dy', Math.round(Math.sin(ang) * dist - 30) + 'px');
        pt.style.setProperty('--rot', Math.round(Math.random() * 540 - 270) + 'deg');
        pt.style.setProperty('--d', Math.round(200 + Math.random() * 160) + 'ms'); // 튀어나오는 순간 한 번 터짐
        pt.style.setProperty('--pc', colors[i % colors.length]);
        layer.appendChild(pt);
      }
    }
    boardWrapEl.appendChild(layer);
    setTimeout(() => {
      layer.remove();
      cardAnimBusy = false;
      cardAnimRemote = false;
      done && done();
      updateHandUI();
    }, reduceMotion ? 1200 : 2200);
  }

  // 카드 발동: 연출(상대 화면에도) → 끝난 뒤 실제 효과 적용
  function activateCard(player, idx, after) {
    const card = hand[player] && hand[player][idx];
    if (!card || cardAnimBusy) return false;
    if (mode === 'multiplayer') {
      mpCardFx = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), card: card.id, color: player };
      seenCardFxIds.add(mpCardFx.id);
      syncPublicState(); // 효과 적용 전 상태로 먼저 알려 상대도 연출부터 보게 함
    }
    playCardAnim(card.id, player, () => {
      useCard(player, idx);
      if (mode === 'multiplayer') { syncPublicState(); savePrivateState(); }
      if (after) after();
    });
    return true;
  }

  function triggerBoardShake() {
    if (!boardWrapEl || reduceMotion) return;
    boardWrapEl.classList.remove('shake');
    void boardWrapEl.offsetWidth; // 강제 리플로우로 애니메이션 재시작 가능하게
    boardWrapEl.classList.add('shake');
  }

  function checkMyTrapsAgainstBoard() {
    if (mode !== 'multiplayer' || !trapList || trapList.length === 0) return;
    const opp = other(myColor);
    const remaining = [];
    let triggered = false;
    for (const tr of trapList) {
      if (board[tr.r][tr.c] === opp) {
        board[tr.r][tr.c] = EMPTY;
        addLog(L('log.trapHitOpp'));
        grantRandomCard(myColor);
        triggered = true;
      } else if (board[tr.r][tr.c] === EMPTY) {
        remaining.push(tr);
      }
      // 내 돌이 그 칸을 덮은 경우는 자연 소멸 (remaining에서 제외)
    }
    trapList = remaining;
    if (triggered) {
      // 함정이 걸린 돌이 오목/육목을 완성해서 상대 쪽이 이미 승리를 선언했더라도, 그 돌이 사라졌으면 승리 판정을 취소하고 게임을 이어감
      if (gameOver && winLine && !scanBoardForWin()) {
        gameOver = false; winLine = null; mpBannerText = null;
        banner.classList.remove('show');
        addLog(L('log.trapStopWin'));
        if (current === opp) passTurn();
      }
      setNotice(L('notice.trapFired'));
      syncPublicState();
      savePrivateState();
    }
  }

  // 강탈 동기화: 내가 빼앗길 쪽이면 패에서 1장을 내주고 응답, 빼앗는 쪽이면 응답으로 온 카드를 받음
  function handleStealSync(data) {
    mpStealReq = data.stealReq || null;
    mpStealRes = data.stealRes || null;
    const rq = data.stealReq;
    if (rq && rq.id !== lastSeenStealReqId) {
      lastSeenStealReqId = rq.id;
      if (rq.by !== myColor && !(data.stealRes && data.stealRes.id === rq.id)) {
        const mine = hand[myColor] || [];
        const card = mine.length ? mine.splice(Math.floor(Math.random() * mine.length), 1)[0] : null;
        if (card) addLog(L('log.stealLost', { card: card.id }));
        mpStealRes = { id: rq.id, to: rq.by, card: card ? card.id : null };
        savePrivateState();
        dbApi.updatePath('games/' + roomCode, { stealRes: mpStealRes }).catch(() => {});
      }
    }
    const rs = data.stealRes;
    if (rs && rs.id !== lastSeenStealResId && rs.to === myColor) {
      lastSeenStealResId = rs.id;
      const card = rs.card && CARD_POOL.find(c => c.id === rs.card);
      if (card) {
        hand[myColor].push(card);
        if (hand[myColor].length > HAND_LIMIT) { const dropped = hand[myColor].shift(); addLog(L('log.handOverflow', { color: myColor, card: dropped.id })); }
        addLog(L('log.stealGot', { color: myColor, card: card.id }));
      } else addLog(L('log.stealEmpty', { color: myColor }));
      savePrivateState();
    }
  }

  function applyPublicSnapshot(data) {
    if (!data) return;
    // 상대 카드 발동: 연출을 먼저 보여주고, 연출 중 들어온 변화(효과)는 끝난 뒤 적용
    const fx = data.cardFx;
    // 공유 상태의 '마지막 카드 발동'을 내 쪽에도 맞춰 둠 — 예전 내 발동을 다시 써 보내면 상대 화면에서 같은 연출·기록이 반복됨
    if (fx) mpCardFx = fx;
    if (fx && fx.id !== lastSeenCardFxId && !seenCardFxIds.has(fx.id)) {
      lastSeenCardFxId = fx.id; seenCardFxIds.add(fx.id);
      if (fx.color !== myColor) {
        // 상대가 쓴 카드도 내 기록창에 남김
        const fc = CARD_POOL.find(c => c.id === fx.card);
        if (fc) addLog(L('log.oppCard', { color: fx.color, icon: fc.icon, card: fc.id }));
      }
      if (fx.color !== myColor && !cardAnimBusy) {
        cardAnimRemote = true;
        playCardAnim(fx.card, fx.color, () => {
          const d = deferredSnapshot; deferredSnapshot = null;
          if (d) applyPublicSnapshot(d);
        });
      }
    } else if (cardAnimBusy && cardAnimRemote) {
      deferredSnapshot = data;
      return;
    }
    if (data.board) board = unflattenBoard(data.board);
    if (data.current) current = data.current;
    if (data.winLength) winLength = data.winLength;
    windmillList = data.windmillList || [];
    craterList = data.craterList || [];
    shieldList = data.shieldList || [];
    lastPlaced = data.lastPlaced || { [BLACK]: null, [WHITE]: null };
    turnPlacementsDone = data.turnPlacementsDone || 0;
    turnPlacementsNeeded = data.turnPlacementsNeeded || 1;
    usedCardThisTurn = data.usedCardThisTurn || { [BLACK]: false, [WHITE]: false };
    cardLockNextTurn = data.cardLockNextTurn || { [BLACK]: false, [WHITE]: false };
    skipNextTurn = data.skipNextTurn || { [BLACK]: false, [WHITE]: false };
    placedCount = data.placedCount || { [BLACK]: 0, [WHITE]: 0 };
    gameOver = !!data.gameOver;
    if (gameOver) clearAllPending();
    mpBannerText = data.bannerText || null;
    winLine = data.winLine || null;
    lastMovePos = data.lastMovePos || null;
    mpPlayers = data.players || mpPlayers;

    let restarted = false, restartedColor = null;
    if (typeof data.restartSeq === 'number' && data.restartSeq > lastSeenRestartSeq) {
      lastSeenRestartSeq = data.restartSeq;
      restarted = true;
      // 진 쪽이 선후공을 바꿨을 수 있으므로 players에서 내 색을 다시 확인
      if (mpPlayers[BLACK] === myUserId) myColor = BLACK;
      else if (mpPlayers[WHITE] === myUserId) myColor = WHITE;
      restartedColor = myColor;
      hand = { [BLACK]: [], [WHITE]: [] };
      trapList = [];
      logLines = []; updateLog();
      lastSeenNoticeSeq = 0; lastSeenShakeSeq = 0; lastBannerMsg = null;
      pendingTarget = null; draftOpen = false; draftPlayer = null;
      pendingPlacement = null; pendingCardUse = null; pendingTargetCell = null;
    }

    if (data.noticeSeq && data.noticeSeq > lastSeenNoticeSeq) {
      lastSeenNoticeSeq = data.noticeSeq;
      if (data.notice) addLog(data.notice);
    }
    if (typeof data.shakeSeq === 'number' && data.shakeSeq > lastSeenShakeSeq) {
      lastSeenShakeSeq = data.shakeSeq;
      triggerBoardShake();
    }

    if (restarted) {
      addLog(L('log.youAre', { color: restartedColor }));
      startupQueue = [myColor];
      runStartupDraft();
    }

    handleStealSync(data);
    lastPublicData = data;
    updateAlkSpectate(data); // 상대 발사가 새로 왔으면 먼저 재생을 시작
    syncAlkFromPublic(data);
    checkMyTrapsAgainstBoard();

    if (gameOver && data.bannerText) {
      if (!banner.classList.contains('show')) renderBannerOnly(data.bannerText);
    } else {
      banner.classList.remove('show');
    }

    updateStatus(); updatePips(); updateHandUI(); draw();
  }

  function syncAlkFromPublic(data) {
    if (alkView && alkView.playing) return; // 상대 발사 재생이 끝난 뒤에 다음 차례로 넘어감
    if (!data.alkActive) {
      if (alk || alkHandoff) { alk = null; alkHandoff = null; }
      return;
    }
    const turnOrder = data.alkTurnOrder;
    const turnIndex = data.alkTurnIndex;
    if (!turnOrder || typeof turnIndex !== 'number') return;
    const flicker = turnOrder[turnIndex];
    if (flicker === myColor) {
      if (!alk || alk.turnIndex !== turnIndex) {
        beginMyAlkTurn(turnOrder, turnIndex);
      }
    } else {
      alk = null;
      alkHandoff = { turnOrder: turnOrder, turnIndex: turnIndex };
    }
  }

  // ---- 채팅 (멀티플레이 전용) ----
  const CHAT_MAX_LEN = 200;
  const CHAT_HISTORY = 50;
  let unsubChat = null;
  let chatError = false, lastChatMessages = [];

  function subscribeChat() {
    unsubscribeChat();
    chatPanel.hidden = false;
    chatError = false;
    renderChat([]);
    unsubChat = dbApi.onPathLast('chats/' + roomCode, CHAT_HISTORY, renderChat, function () {
      chatError = true; renderChat([]);
    });
  }

  function unsubscribeChat() {
    if (unsubChat) { unsubChat(); unsubChat = null; }
    chatPanel.hidden = true;
    chatInput.value = '';
  }

  function renderChat(messages) {
    lastChatMessages = messages;
    chatList.innerHTML = '';
    if (!messages.length) {
      const li = document.createElement('li');
      li.className = 'chat-empty';
      li.textContent = chatError ? t('chat.error') : t('chat.empty');
      chatList.appendChild(li);
      return;
    }
    for (const m of messages) {
      if (!m || typeof m.text !== 'string') continue;
      const li = document.createElement('li');
      li.className = 'chat-msg' + (m.uid === myUserId ? ' mine' : '');
      const who = document.createElement('div');
      who.className = 'chat-who';
      who.textContent = m.uid === myUserId ? t('chat.me') : (m.color === BLACK || m.color === WHITE ? colorName(m.color) : t('chat.opp'));
      const text = document.createElement('div');
      text.textContent = m.text.slice(0, CHAT_MAX_LEN);
      li.appendChild(who); li.appendChild(text);
      chatList.appendChild(li);
    }
    chatList.scrollTop = chatList.scrollHeight;
  }

  async function sendChat() {
    const text = chatInput.value.trim().slice(0, CHAT_MAX_LEN);
    if (!text || mode !== 'multiplayer' || !dbApi || !roomCode) return;
    chatInput.value = '';
    try {
      await dbApi.pushPath('chats/' + roomCode, { uid: myUserId, color: myColor, text, ts: Date.now() });
    } catch (e) {
      chatInput.value = text;
      addLog(L('chat.sendFail'));
    }
  }

  chatForm.addEventListener('submit', function (e) { e.preventDefault(); sendChat(); });

  function subscribePublic() {
    subscribeChat();
    if (unsubPublic) { unsubPublic(); unsubPublic = null; }
    unsubPublic = dbApi.onPath('games/' + roomCode, function (snap) {
      if (!snap.exists) return;
      const data = snap.data();
      if (!data) return;
      if (currentScreen !== 'game' && data.players && data.players[BLACK] && data.players[WHITE]) {
        showScreen('game');
      }
      applyPublicSnapshot(data);
    }, function () {
      setLobbyStatus(L('lobby.connErr'));
    });
  }

  function randomRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  async function createRoom() {
    if (!dbApi || !myUserId) { setLobbyStatus(L('lobby.connecting')); return; }
    mode = 'multiplayer';
    // 선공(흑) 결정: 랜덤 / 방장 / 참가자
    const iGoFirst = firstPickMode === 'me' ? true : firstPickMode === 'opp' ? false : Math.random() < 0.5;
    myColor = iGoFirst ? BLACK : WHITE;
    roomCode = randomRoomCode();
    mpPlayers = { [BLACK]: null, [WHITE]: null };
    mpPlayers[myColor] = myUserId;
    setLobbyStatus(L('lobby.creating'));
    init();
    subscribePublic();
    await syncPublicState();
    showRoomCode(roomCode);
    setLobbyStatus(L(myColor === BLACK ? 'lobby.waitingFirst' : 'lobby.waitingSecond', { code: roomCode }));
  }

  let firstPickMode = 'random';
  try { const v = localStorage.getItem('omok_first_pick'); if (v === 'random' || v === 'me' || v === 'opp') firstPickMode = v; } catch (e) {}
  const firstPickOptions = document.getElementById('first-pick-options');
  function renderFirstPick() {
    firstPickOptions.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.first === firstPickMode)));
  }
  firstPickOptions.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-first]');
    if (!b) return;
    firstPickMode = b.dataset.first;
    try { localStorage.setItem('omok_first_pick', firstPickMode); } catch (e2) {}
    renderFirstPick();
  });
  renderFirstPick();

  function startRematch(newColor, viaRandom) {
    // 진 사람이 고른 색으로 자리 바꾸기 (players 매핑을 통째로 교환)
    const swap = newColor && newColor !== myColor;
    if (swap) {
      mpPlayers = { [BLACK]: mpPlayers[WHITE] || null, [WHITE]: mpPlayers[BLACK] || null };
      myColor = newColor;
    }
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
    current = BLACK;
    moveHistory = [];
    gameOver = false;
    winLine = null;
    winLength = 5;
    lastMovePos = null;
    windmillList = [];
    placedCount = { [BLACK]: 0, [WHITE]: 0 };
    turnPlacementsDone = 0;
    turnPlacementsNeeded = 1;
    turnPlacedPositions = [];
    usedCardThisTurn = { [BLACK]: false, [WHITE]: false };
    cardLockNextTurn = { [BLACK]: false, [WHITE]: false };
    skipNextTurn = { [BLACK]: false, [WHITE]: false };
    pendingTarget = null; draftOpen = false; draftPlayer = null;
    pendingPlacement = null; pendingCardUse = null; pendingTargetCell = null;
    alk = null; alkHandoff = null;
    trapList = [];
    craterList = [];
    shieldList = []; mpStealReq = null; mpStealRes = null; lastPlaced = { [BLACK]: null, [WHITE]: null };
    alkView = null; mpAlkLaunch = null;
    hand = { [BLACK]: [], [WHITE]: [] }; // 상대 손패는 상대 쪽에서 restartSeq를 보고 알아서 초기화함
    logLines = [];
    mpNotice = null; mpNoticeSeq = 0; lastSeenNoticeSeq = 0; mpBannerText = null; lastBannerMsg = null;
    mpShakeSeq = 0; lastSeenShakeSeq = 0;
    if (newColor) {
      const note = viaRandom ? L('notice.rematchRandom') : L(newColor === BLACK ? 'notice.rematchFirst' : 'notice.rematchSecond');
      setNotice(note);
      addLog(note);
      addLog(L('log.youAre', { color: myColor }));
    }
    mpRestartSeq++; lastSeenRestartSeq = mpRestartSeq; // 내 화면은 스스로 에코 처리하지 않도록
    banner.classList.remove('show'); draftOverlay.classList.remove('show'); updateLog();
    syncPublicState();
    startupQueue = [myColor];
    runStartupDraft();
  }

  async function joinRoom(codeRaw) {
    if (!dbApi || !myUserId) { setLobbyStatus(L('lobby.connecting')); return; }
    const code = (codeRaw || '').trim().toUpperCase();
    if (!code) { setLobbyStatus(L('lobby.enterCode')); return; }
    setLobbyStatus(L('lobby.joining'));
    try {
      const snap = await dbApi.getPath('games/' + code);
      if (!snap.exists) { setLobbyStatus(L('lobby.notFound')); return; }
      const data = snap.data() || {};
      const players = data.players || {};
      let assignedColor = null;
      let isReconnect = false;
      if (players[BLACK] === myUserId) { assignedColor = BLACK; isReconnect = true; }
      else if (players[WHITE] === myUserId) { assignedColor = WHITE; isReconnect = true; }
      else if (!players[WHITE]) { assignedColor = WHITE; }
      else if (!players[BLACK]) { assignedColor = BLACK; }
      else { setLobbyStatus(L('lobby.full')); return; }

      mode = 'multiplayer';
      myColor = assignedColor;
      roomCode = code;
      mpPlayers = Object.assign({ [BLACK]: null, [WHITE]: null }, players);
      mpPlayers[assignedColor] = myUserId;
      hand = { [BLACK]: [], [WHITE]: [] };
      trapList = []; pendingTarget = null; draftOpen = false; draftPlayer = null; alk = null; alkHandoff = null;
      pendingPlacement = null; pendingCardUse = null; pendingTargetCell = null;
      moveHistory = [];
      logLines = []; mpNotice = null; mpNoticeSeq = 0; lastSeenNoticeSeq = 0; mpBannerText = null;
      mpShakeSeq = 0; lastSeenShakeSeq = 0;
      mpRestartSeq = data.restartSeq || 0; lastSeenRestartSeq = mpRestartSeq;
      lastSeenCardFxId = data.cardFx ? data.cardFx.id : null; // 들어오기 전에 쓴 카드 연출은 다시 보여주지 않음
      board = unflattenBoard(data.board || flattenBoard());
      current = data.current || BLACK;
      winLength = data.winLength || 5;
      windmillList = data.windmillList || [];
      craterList = data.craterList || [];
      turnPlacementsDone = data.turnPlacementsDone || 0;
      turnPlacementsNeeded = data.turnPlacementsNeeded || 1;
      turnPlacedPositions = [];
      usedCardThisTurn = data.usedCardThisTurn || { [BLACK]: false, [WHITE]: false };
      cardLockNextTurn = data.cardLockNextTurn || { [BLACK]: false, [WHITE]: false };
      skipNextTurn = data.skipNextTurn || { [BLACK]: false, [WHITE]: false };
      placedCount = data.placedCount || { [BLACK]: 0, [WHITE]: 0 };
      gameOver = !!data.gameOver;
      winLine = data.winLine || null;
      lastMovePos = data.lastMovePos || null;
      banner.classList.remove('show'); draftOverlay.classList.remove('show'); updateLog();
      if (!isReconnect) {
        await dbApi.updatePath('games/' + code + '/players', { [assignedColor]: myUserId });
      }
      subscribePublic();
      await loadPrivateState();
      if (isReconnect) {
        updateStatus(); updatePips(); updateHandUI(); draw();
        setLobbyStatus(L('lobby.reconnected'));
      } else {
        startupQueue = [myColor];
        runStartupDraft();
      }
      showScreen('game');
    } catch (e) {
      setLobbyStatus(L('lobby.joinFail'));
    }
  }

  // ================= 봇 AI (난이도 1 / 3 / 5 / 7 / 10) =================
  // radius: 돌 주변 몇 칸까지 후보로 보는지 (인지 영역)
  // depth: 몇 수 앞까지 읽는지 (0 = 현재 수만 평가), width: 탐색 시 각 단계에서 검토하는 후보 수
  // topN: 상위 몇 개 후보 중 무작위로 고르는지, defense: 수비 가중치
  // missChance: 상대 위협을 못 보고 넘어갈 확률, patterns: 띈 3·4·쌍삼 등 패턴 인식 여부
  // smartCards: 카드를 상황에 맞게 쓰는지 (아니면 무작위), vcf: 연속 4로 끝내는 수순 탐색 여부
  const BOT_LEVELS = {
    1:  { radius: 1, depth: 0, width: 0,  topN: 6, defense: 0.5,  missChance: 0.4, patterns: false, smartCards: false, vcf: false },
    3:  { radius: 2, depth: 0, width: 0,  topN: 3, defense: 0.85, missChance: 0.1, patterns: false, smartCards: false, vcf: false },
    5:  { radius: 2, depth: 0, width: 0,  topN: 1, defense: 0.9,  missChance: 0,   patterns: true,  smartCards: true,  vcf: false },
    7:  { radius: 2, depth: 2, width: 12, topN: 1, defense: 1,    missChance: 0,   patterns: true,  smartCards: true,  vcf: false },
    10: { radius: 3, depth: 4, width: 10, topN: 1, defense: 1,    missChance: 0,   patterns: true,  smartCards: true,  vcf: true  },
    // 얼티밋: 시간 제한 안에서 최대한 깊이 읽음 (반복 심화 + 치환표 + 위협 가지치기 + 상대 VCF 차단)
    20: { radius: 2, depth: 12, width: 14, topN: 1, defense: 1,   missChance: 0,   patterns: true,  smartCards: true,  vcf: true, ultimate: true, timeMs: 2500 },
    // 슈퍼 울트라 짱짱맨: 얼티밋 + 수당 약 5초 + 상대의 연속 위협(VCT) 차단 + 상대 패 읽기
    // (VCT 공격은 봇끼리 대국에서 오히려 불리해 꺼 둠: 막는 수를 일부 놓쳐 이기지 못하는 공격을 걸게 됨)
    50: { radius: 2, depth: 14, width: 14, topN: 1, defense: 1,   missChance: 0,   patterns: true,  smartCards: true,  vcf: true, ultimate: true, vct: true, vctAttack: false,
          readCards: true,
          worker: true, timeMs: 8000, chainTimeMs: 3000, planMs: 6000, // A. 백그라운드 계산 + 긴 생각 시간
          book: true,   // B. 정석
          style: true,  // D. 흑=공격형, 백=수비형 (C. 카드+착수 계획은 worker 경로에서 사용)
          engine2: true, vct2: true, oppCardReplies: true, tradeRisk: true,
          chainPlan: true, chainRisk: true, tradeAttack: true, cardPlan2: true, draft2: true, cardPlan3: true, cardPlan4: true },  // v2 엔진: 증분 평가·PVS/LMR, 빠짐없는 VCT, 상대 카드 대응 수 읽기
  };
  const BOT_LEVEL_LIST = [1, 3, 5, 7, 10, 20, 50];
  let botLevel = 5;
  try { const saved = parseInt(localStorage.getItem('omok_bot_level'), 10); if (BOT_LEVELS[saved]) botLevel = saved; } catch (e) {}
  function botCfg() { return BOT_LEVELS[botLevel] || BOT_LEVELS[5]; }
  function botLevelName(lv) { return lv === 20 ? t('bot.ultimate') : lv === 50 ? t('bot.super') : String(lv); }

  let botTimer = null;
  function scheduleMaybeBotTurn() {
    if (botTimer) return;
    botTimer = setTimeout(() => { botTimer = null; maybeBotTurn(); }, 650);
  }

  let botThinkingShown = false;
  function maybeBotTurn() {
    if (mode !== 'bot' || gameOver || draftOpen || pendingTarget || alk || awaitingSide) return;
    const botColor = other(myColor);
    if (current !== botColor) return;
    // 얼티밋은 계산이 길어서, 먼저 '생각 중' 표시를 그린 뒤 계산
    if (botCfg().ultimate && !botThinkingShown) {
      statusText.textContent = t('bot.thinking');
      botThinkingShown = true;
      setTimeout(() => { maybeBotTurn(); botThinkingShown = false; }, 30);
      return;
    }
    if (cardAnimBusy) return;
    if (botCfg().worker) { botTurnWithEngine(botColor); return; }
    const proceed = () => {
      if (!gameOver && current === botColor && !draftOpen && !pendingTarget && !alk) botPlaceStone(botColor);
    };
    if (!usedCardThisTurn[botColor] && hand[botColor].length > 0) {
      // 카드를 쓰면 발동 연출이 끝난 뒤 효과 적용 → 이어서 착수
      const started = botCfg().smartCards ? botUseCardSmart(botColor, proceed) : (Math.random() < 0.5 && botUseCard(botColor, proceed));
      if (started) return;
    }
    proceed();
  }

  // ---- 저난이도: 무작위 카드 사용 ----
  function botUseCard(botColor, after) {
    const opp = other(botColor);
    const usable = hand[botColor].map((c, i) => ({ c, i })).filter(({ c }) => {
      if (c.type === 'remove_enemy') return hasStoneOf(opp);
      if (c.type === 'self_remove' || c.type === 'windmill' || c.type === 'teleport') return hasStoneOf(botColor);
      if (c.type === 'trade') return hasTradablePair();
      if (c.type === 'trap') return hasEmptyCell();
      if (c.type === 'six_sense') return winLength !== 6;
      if (c.type === 'shield') return hasStoneOf(botColor);
      if (c.type === 'wall' || c.type === 'magnet') return hasEmptyCell();
      if (c.type === 'rewind') return !!lastOppStone(botColor);
      return true;
    });
    if (usable.length === 0) return false;
    const chosen = usable[Math.floor(Math.random() * usable.length)];
    return activateCard(botColor, chosen.i, () => {
      if (pendingTarget && pendingTarget.forPlayer === botColor) resolveBotPendingTarget();
      if (after) after();
    });
  }

  function resolveBotPendingTarget() {
    const t = pendingTarget;
    if (!t) return;
    let candidates = [];
    if (t.type === 'remove') {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === t.opponent && !isProtected(r, c)) candidates.push({ r, c });
    } else if (t.type === 'self_remove' || t.type === 'windmill' || t.type === 'teleport' || t.type === 'shield') {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === t.forPlayer) candidates.push({ r, c });
    } else if (t.type === 'trap' || t.type === 'wall' || t.type === 'magnet') {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === EMPTY) candidates.push({ r, c });
    } else if (t.type === 'trade') {
      if (t.stage === 'first') {
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (hasOppositeNeighbor(r, c) && !(board[r][c] !== t.forPlayer && isProtected(r, c))) candidates.push({ r, c });
      } else {
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (isValidTradeSecond(t.firstPos, r, c) && !(board[r][c] !== t.forPlayer && isProtected(r, c)) && !swapMakesLine(t.firstPos.r, t.firstPos.c, r, c)) candidates.push({ r, c });
      }
    }
    if (candidates.length === 0) { cancelTarget(); return; }
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    handleTargetClick(pick);
    if (pendingTarget && pendingTarget.type === 'trade' && pendingTarget.stage === 'second') {
      resolveBotPendingTarget();
    }
  }

  // ---- 공통 보조 함수 ----
  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  function inBoard(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

  // player가 둘 수 없는 칸 (상대 풍차 주변) 표시
  function buildBlockedGrid(player) {
    const g = new Uint8Array(SIZE * SIZE);
    for (const cr of craterList) g[cr.r * SIZE + cr.c] = 1;
    for (let i = 0; i < SIZE * SIZE; i++) if (board[(i / SIZE) | 0][i % SIZE] === WALL) g[i] = 1; // 장벽은 아무도 못 씀
    for (const w of windmillList) {
      if (!isStone(board[w.r][w.c]) || board[w.r][w.c] === player) continue;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const r = w.r + dr, c = w.c + dc;
        if (inBoard(r, c)) g[r * SIZE + c] = 1;
      }
    }
    return g;
  }
  function makeBlocked() { return { [BLACK]: buildBlockedGrid(BLACK), [WHITE]: buildBlockedGrid(WHITE) }; }

  function collectCandidates(player, radius, blocked, respectChain) {
    radius = radius || 2;
    let any = false;
    for (let r = 0; r < SIZE && !any; r++) for (let c = 0; c < SIZE; c++) if (isStone(board[r][c])) { any = true; break; }
    const chainActive = respectChain !== false && turnPlacementsDone > 0 && turnPlacedPositions.length > 0;
    const isBlocked = (r, c) => blocked ? blocked[player][r * SIZE + c] : isBlockedForPlayer(r, c, player);
    function farEnough(r, c) {
      if (!chainActive) return true;
      return !turnPlacedPositions.some(p => Math.max(Math.abs(r - p.r), Math.abs(c - p.c)) <= 2);
    }
    if (!any) return [{ r: 7, c: 7 }];
    const cands = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== EMPTY || isBlocked(r, c)) continue;
      if (!farEnough(r, c)) continue;
      let near = false;
      for (let dr = -radius; dr <= radius && !near; dr++) for (let dc = -radius; dc <= radius && !near; dc++) {
        const nr = r + dr, nc = c + dc;
        if (inBoard(nr, nc) && isStone(board[nr][nc])) near = true;
      }
      if (near) cands.push({ r, c });
    }
    if (cands.length) return cands;
    const fallback = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === EMPTY && !isBlocked(r, c) && farEnough(r, c)) fallback.push({ r, c });
    }
    return fallback;
  }

  // ---- 저난이도용 단순 평가: 연속으로 붙은 돌만 셈 ----
  function lineScore(r, c, dr, dc, player) {
    let count = 1, openEnds = 0;
    let rr = r + dr, cc = c + dc;
    while (inBoard(rr, cc) && board[rr][cc] === player) { count++; rr += dr; cc += dc; }
    if (inBoard(rr, cc) && board[rr][cc] === EMPTY) openEnds++;
    rr = r - dr; cc = c - dc;
    while (inBoard(rr, cc) && board[rr][cc] === player) { count++; rr -= dr; cc -= dc; }
    if (inBoard(rr, cc) && board[rr][cc] === EMPTY) openEnds++;

    if (count >= winLength) return 10000000;
    const gap = winLength - count;
    if (gap === 1) return openEnds === 2 ? 500000 : openEnds === 1 ? 50000 : 0;
    if (gap === 2) return openEnds === 2 ? 5000 : openEnds === 1 ? 500 : 0;
    if (gap === 3) return openEnds === 2 ? 200 : openEnds === 1 ? 50 : 0;
    return count * 2 + openEnds;
  }

  function simpleCellScore(r, c, player, defense) {
    const opp = other(player);
    board[r][c] = player;
    let offense = 0;
    for (const [dr, dc] of DIRS) offense = Math.max(offense, lineScore(r, c, dr, dc, player));
    board[r][c] = opp;
    let def = 0;
    for (const [dr, dc] of DIRS) def = Math.max(def, lineScore(r, c, dr, dc, opp));
    board[r][c] = EMPTY;
    return offense + def * defense;
  }

  // ---- 패턴 인식: 한 방향으로 winLength 칸짜리 창(window)을 밀면서 모양을 판단 ----
  // board[r][c]에 player 돌이 놓였다고 가정하고 호출
  function lineShape(r, c, dr, dc, player, blk) {
    const L = winLength;
    let best = 0, winCell = -1, winCells = 0, near = 0;
    for (let s = -(L - 1); s <= 0; s++) {
      let n = 0, ok = true, empty = -1;
      for (let k = 0; k < L; k++) {
        const rr = r + (s + k) * dr, cc = c + (s + k) * dc;
        if (!inBoard(rr, cc)) { ok = false; break; }
        const v = board[rr][cc];
        if (v === player) n++;
        else if (v === EMPTY && !blk[rr * SIZE + cc]) empty = rr * SIZE + cc;
        else { ok = false; break; }
      }
      if (!ok) continue;
      if (n > best) best = n;
      if (n === L - 1 && empty !== winCell) { if (winCell === -1 || winCells < 2) winCells++; winCell = empty; }
      if (n === L - 2) near++;
    }
    return { best, winCells, near };
  }

  const P_FIVE = 10000000, P_OPEN4 = 1000000, P_FOUR = 100000, P_OPEN3 = 10000, P_THREE = 1000, P_OPEN2 = 300, P_TWO = 50;

  // player가 (r,c)에 두었을 때의 공격 가치
  function attackValue(r, c, player, blk) {
    const L = winLength;
    board[r][c] = player;
    let score = 0, fours = 0, open3 = 0, five = false;
    for (const [dr, dc] of DIRS) {
      const s = lineShape(r, c, dr, dc, player, blk);
      if (s.best >= L) { five = true; break; }
      if (s.winCells >= 2) { score += P_OPEN4; fours += 2; }
      else if (s.winCells === 1) { score += P_FOUR; fours++; }
      else if (s.best === L - 2) { if (s.near >= 2) { score += P_OPEN3; open3++; } else score += P_THREE; }
      else if (s.best === L - 3) score += s.near >= 1 ? P_OPEN2 : P_TWO;
      else score += s.best;
    }
    board[r][c] = EMPTY;
    if (five) return { score: P_FIVE, five: true, fours: 0 };
    if (fours >= 2 || (fours >= 1 && open3 >= 1)) score += P_OPEN4 / 2; // 4-4, 4-3: 사실상 필승
    else if (open3 >= 2) score += P_OPEN3 * 5;                           // 3-3
    return { score, five: false, fours };
  }

  function patternCellScore(r, c, player, blocked, defense) {
    const opp = other(player);
    const a = attackValue(r, c, player, blocked[player]);
    const d = blocked[opp][r * SIZE + c] ? { score: 0, five: false } : attackValue(r, c, opp, blocked[opp]);
    return { score: a.score + d.score * defense, win: a.five, mustBlock: d.five, fours: a.fours };
  }

  // ---- 판 전체 평가 (탐색의 말단에서 사용) ----
  function windowWeight(n) {
    const g = winLength - n;
    return g <= 0 ? 10000000 : g === 1 ? 800 : g === 2 ? 70 : g === 3 ? 8 : g === 4 ? 1 : 0;
  }
  function evalBoard(me, blocked) {
    const opp = other(me), L = winLength;
    let sMe = 0, sOpp = 0;
    for (const [dr, dc] of DIRS) {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
        const er = r + (L - 1) * dr, ec = c + (L - 1) * dc;
        if (!inBoard(er, ec)) continue;
        let nMe = 0, nOpp = 0, bMe = false, bOpp = false;
        for (let k = 0; k < L; k++) {
          const rr = r + k * dr, cc = c + k * dc, v = board[rr][cc];
          if (v === me) nMe++;
          else if (v === opp) nOpp++;
          else { const i = rr * SIZE + cc; if (blocked[me][i]) bMe = true; if (blocked[opp][i]) bOpp = true; }
        }
        if (nOpp === 0 && nMe > 0 && !bMe) sMe += windowWeight(nMe);
        if (nMe === 0 && nOpp > 0 && !bOpp) sOpp += windowWeight(nOpp);
      }
    }
    if (uStyle && uBot) {
      // 짱짱맨 스타일: 봇 형세·상대 형세 가중치를 따로 (흑=공격형, 백=수비형)
      const sBot = me === uBot ? sMe : sOpp, sHum = me === uBot ? sOpp : sMe;
      const v = uStyle.a * sBot - uStyle.b * sHum;
      return me === uBot ? v : -v;
    }
    return sMe - sOpp * 1.1;
  }

  // ---- 수 읽기 (알파-베타 탐색) ----
  const WIN_SCORE = 1e9;
  let searchDeadline = 0;

  function orderedMoves(player, blocked, cfg, width, isRoot) {
    const cands = collectCandidates(player, cfg.radius, blocked, isRoot);
    const scored = [];
    let blocks = [];
    for (const p of cands) {
      const s = patternCellScore(p.r, p.c, player, blocked, cfg.defense);
      if (s.win) return { win: p, list: [p] };
      if (s.mustBlock) blocks.push({ r: p.r, c: p.c, score: s.score });
      scored.push({ r: p.r, c: p.c, score: s.score });
    }
    // 상대가 다음 수에 이기는 자리가 있으면 그 자리를 막는 수만 검토
    const list = blocks.length ? blocks : scored;
    list.sort((a, b) => b.score - a.score);
    return { win: null, list: width ? list.slice(0, width) : list, forced: blocks.length > 0 };
  }

  function negamax(player, depth, alpha, beta, blocked, cfg) {
    const moves = orderedMoves(player, blocked, cfg, cfg.width, false);
    if (moves.win) return WIN_SCORE + depth;
    if (!moves.list.length) return 0;
    if (depth <= 0 || Date.now() > searchDeadline) return evalBoard(player, blocked);
    const opp = other(player);
    let best = -Infinity;
    for (const m of moves.list) {
      board[m.r][m.c] = player;
      const v = -negamax(opp, depth - 1, -beta, -alpha, blocked, cfg);
      board[m.r][m.c] = EMPTY;
      if (v > best) best = v;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  // ---- 연속 4(VCF) 탐색: 계속 4를 만들어 상대가 막을 수밖에 없게 몰아 이기는 수순 ----
  function findWinCells(player, blk) {
    const cells = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== EMPTY || blk[r * SIZE + c]) continue;
      board[r][c] = player;
      const w = checkWin(r, c, player);
      board[r][c] = EMPTY;
      if (w) cells.push({ r, c });
    }
    return cells;
  }

  function vcf(player, depth, blocked, isRoot) {
    if (depth <= 0 || Date.now() > searchDeadline) return null;
    const opp = other(player);
    if (findWinCells(opp, blocked[opp]).length) return null; // 상대가 먼저 이길 수 있으면 불가
    const cands = collectCandidates(player, 2, blocked, !!isRoot);
    for (const p of cands) {
      const a = attackValue(p.r, p.c, player, blocked[player]);
      if (a.five) return p;
      if (a.fours < 1) continue;
      board[p.r][p.c] = player;
      const wins = findWinCells(player, blocked[player]);
      let ok = false;
      if (wins.length >= 2) ok = true;
      else if (wins.length === 1) {
        const w = wins[0];
        if (!blocked[opp][w.r * SIZE + w.c]) {
          board[w.r][w.c] = opp;
          ok = !checkWin(w.r, w.c, opp) && vcf(player, depth - 1, blocked) !== null;
          board[w.r][w.c] = EMPTY;
        } else ok = true; // 상대가 막을 수 없는 자리
      }
      board[p.r][p.c] = EMPTY;
      if (ok) return p;
    }
    return null;
  }


  // ---- 얼티밋: 반복 심화 + 치환표 + 위협 가지치기 + 양쪽 VCF 확인 ----
  const ZOB = (() => {
    const r32 = () => (Math.random() * 4294967296) >>> 0;
    const z = { [BLACK]: [], [WHITE]: [] };
    for (let i = 0; i < SIZE * SIZE; i++) { z[BLACK].push([r32(), r32() & 0x7FFFF]); z[WHITE].push([r32(), r32() & 0x7FFFF]); }
    return z;
  })();
  const U_WIDTHS = [14, 10, 8, 7, 6, 5, 5, 4, 4, 4, 4, 4];
  let uWidths = U_WIDTHS;
  // 상대 패 읽기 (짱짱맨): 탐색에 반영할 보정값
  let uDefense = 0.95, uBot = null, uFlipRisk = false, uStyle = null, uLastDepth = 0; // uLastDepth: 마지막으로 끝까지 읽은 깊이 (측정용)

  // 상대가 다음 턴에 쓸 수 있는 카드 (봉쇄에 걸려 있으면 다음 카드는 무효이므로 없는 것으로 봄)
  function readOppCards(botColor) {
    const opp = other(botColor);
    const has = {};
    const locked = cardLockNextTurn && cardLockNextTurn[opp];
    if (!locked) for (const c of (hand && hand[opp]) || []) has[c.id] = true;
    return has;
  }
  let uTT = new Map(), uAborted = false, uNodes = 0;

  function uHashBoard() {
    let h1 = 0, h2 = 0;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const v = board[r][c];
      if (isStone(v)) { const z = ZOB[v][r * SIZE + c]; h1 ^= z[0]; h2 ^= z[1]; }
    }
    return [h1 >>> 0, h2];
  }
  function uKey(h, player) { return ((h[0] * 524288 + h[1]) * 2) + (player === BLACK ? 0 : 1); }
  function uPlace(h, r, c, player) { const z = ZOB[player][r * SIZE + c]; return [(h[0] ^ z[0]) >>> 0, h[1] ^ z[1]]; }

  // 후보 정렬 + 위협 가지치기: 상대가 이기는 자리 → 그 자리만, 상대가 열린 4를 만들 자리 → 막는 수·내 4만
  function uOrdered(player, blocked, width, isRoot) {
    const opp = other(player);
    const cands = collectCandidates(player, 2, blocked, isRoot);
    const all = [], blocks = [], critical = [];
    for (const p of cands) {
      const i = p.r * SIZE + p.c;
      const a = attackValue(p.r, p.c, player, blocked[player]);
      if (a.five) return { win: p, list: [p] };
      const d = blocked[opp][i] ? { score: 0, five: false } : attackValue(p.r, p.c, opp, blocked[opp]);
      const m = { r: p.r, c: p.c, score: a.score + d.score * uDefense };
      all.push(m);
      if (d.five) blocks.push(m);
      else if (d.score >= P_OPEN4 || a.fours >= 1) critical.push(m);
    }
    let list = all, forced = false;
    if (blocks.length) { list = blocks; forced = true; }
    else if (critical.length && critical.some(m => m.score >= P_OPEN4 * 0.9)) list = critical;
    list.sort((a, b) => b.score - a.score);
    return { win: null, list: width ? list.slice(0, width) : list, forced };
  }

  function uSearch(player, depth, alpha, beta, blocked, h, ply) {
    if ((++uNodes & 255) === 0 && Date.now() > searchDeadline) uAborted = true;
    if (uAborted) return 0;
    const key = uKey(h, player);
    const e = uTT.get(key);
    const alpha0 = alpha;
    if (e && e.depth >= depth) {
      if (e.flag === 0) return e.value;
      if (e.flag === 1 && e.value > alpha) alpha = e.value;
      else if (e.flag === 2 && e.value < beta) beta = e.value;
      if (alpha >= beta) return e.value;
    }
    const moves = uOrdered(player, blocked, uWidths[Math.min(ply, uWidths.length - 1)], false);
    if (moves.win) return WIN_SCORE - ply;
    if (!moves.list.length) return 0;
    if (depth <= 0) {
      let v = evalBoard(player, blocked);
      // 상대가 전세 역전을 쥐고 있으면, 봇 쪽 우세는 뒤집힐 수 있으므로 할인
      if (uFlipRisk) { const vb = player === uBot ? v : -v; const adj = vb > 0 ? vb * 0.35 : vb; v = player === uBot ? adj : -adj; }
      return v;
    }
    if (e && e.best !== undefined) {
      const bi = moves.list.findIndex(m => m.r * SIZE + m.c === e.best);
      if (bi > 0) moves.list.unshift(moves.list.splice(bi, 1)[0]);
    }
    const opp = other(player);
    let best = -Infinity, bestIdx;
    for (const m of moves.list) {
      board[m.r][m.c] = player;
      const v = -uSearch(opp, depth - 1, -beta, -alpha, blocked, uPlace(h, m.r, m.c, player), ply + 1);
      board[m.r][m.c] = EMPTY;
      if (uAborted) return 0;
      if (v > best) { best = v; bestIdx = m.r * SIZE + m.c; }
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    uTT.set(key, { depth, value: best, flag: best <= alpha0 ? 2 : best >= beta ? 1 : 0, best: bestIdx });
    return best;
  }


  // ---- 연속 위협(VCT) 탐색: 4 또는 열린 3을 계속 만들어, 상대가 어떻게 막아도 이기는 수순 ----
  // 상대가 막는 도중 자기 4를 만들면(반격) 실패로 보는 보수적 탐색
  function vct(att, depth, blocked, isRoot, deadline) {
    if (depth <= 0 || Date.now() > deadline) return null;
    const def = other(att);
    if (findWinCells(def, blocked[def]).length) return null;
    const threats = [];
    for (const p of collectCandidates(att, 2, blocked, isRoot)) {
      const a = attackValue(p.r, p.c, att, blocked[att]);
      if (a.five) return p;
      if (a.fours >= 1 || a.score >= P_OPEN3) threats.push({ p, s: a.score });
    }
    threats.sort((x, y) => y.s - x.s);
    for (const t of threats.slice(0, 10)) {
      board[t.p.r][t.p.c] = att;
      const ok = vctDefend(att, depth, blocked, deadline);
      board[t.p.r][t.p.c] = EMPTY;
      if (ok) return t.p;
      if (Date.now() > deadline) return null;
    }
    return null;
  }

  function vctDefend(att, depth, blocked, deadline) {
    const def = other(att);
    const attWins = findWinCells(att, blocked[att]);
    if (findWinCells(def, blocked[def]).length) return false;
    if (attWins.length >= 2) return true;
    let defenses;
    if (attWins.length === 1) {
      const w = attWins[0];
      if (blocked[def][w.r * SIZE + w.c]) return true; // 막을 수 없는 자리
      defenses = [w];
    } else {
      // 열린 3: 공격자가 열린 4를 만들 자리 + 수비자가 4로 반격할 자리
      defenses = [];
      for (const p of collectCandidates(def, 2, blocked, false)) {
        const a = attackValue(p.r, p.c, att, blocked[att]);
        const d = attackValue(p.r, p.c, def, blocked[def]);
        if (a.score >= P_OPEN4 || d.fours >= 1) defenses.push({ r: p.r, c: p.c, s: a.score + d.score });
      }
      if (!defenses.length) return false; // 실질적인 위협이 아님
      defenses.sort((x, y) => y.s - x.s);
      defenses = defenses.slice(0, 8);
    }
    for (const d of defenses) {
      board[d.r][d.c] = def;
      const lost = checkWin(d.r, d.c, def);
      const cont = !lost && vct(att, depth - 1, blocked, false, deadline) !== null;
      board[d.r][d.c] = EMPTY;
      if (!cont) return false;
    }
    return true;
  }

  function ultimateChooseMove(botColor, blocked, budgetMs, cfg) {
    const opp = other(botColor);
    // 연속 착수가 있으면 상대 위협을 더 무겁게, 전세 역전이 있으면 우세를 과신하지 않음, 폭파가 있으면 몰아치기를 믿지 않음
    const { trustForcing } = uSetupFor(botColor, cfg);
    if (cfg && cfg.readCards) {
      // 상대가 설치한 함정 칸에는 두지 않음
      for (const tr of trapList || []) if (tr.owner === opp && board[tr.r][tr.c] === EMPTY) blocked[botColor][tr.r * SIZE + tr.c] = 1;
    }
    if (cfg && cfg.book && turnPlacementsDone === 0) {
      const bm = openingBookMove(botColor, blocked);
      if (bm) return bm;
    }
    searchDeadline = Date.now() + budgetMs;
    const root = uOrdered(botColor, blocked, 0, true);
    if (root.win) return root.win;
    if (!root.list.length) return null;
    if (root.forced && root.list.length === 1) return root.list[0];

    if (!root.forced && trustForcing) {
      const v = vcf(botColor, 14, blocked, true);
      if (v) return v;
    }
    // 짱짱맨: 열린 3까지 섞은 연속 공격으로 이기는 수순
    if (cfg && cfg.vct && cfg.vctAttack !== false && !root.forced && trustForcing) {
      const v = vct(botColor, 6, blocked, true, Date.now() + budgetMs * 0.2);
      if (v) return v;
    }

    let moves = root.list.slice(0, (cfg && cfg.rootWidth) || 16);
    // 상대에게 연속 4로 이기는 수순이 있으면, 그걸 끊는 수만 남긴다
    if (!root.forced && vcf(opp, 12, blocked, false)) {
      const safe = moves.filter(m => {
        board[m.r][m.c] = botColor;
        const threat = vcf(opp, 12, blocked, false);
        board[m.r][m.c] = EMPTY;
        return !threat;
      });
      if (safe.length) moves = safe;
    }
    // 짱짱맨: 상대의 연속 위협(VCT) 수순도 미리 끊는다
    if (cfg && cfg.vct && cfg.vctDefend !== false && !root.forced && moves.length > 1) {
      const dl = Date.now() + budgetMs * 0.2;
      if (vct(opp, 5, blocked, false, dl)) {
        const safe = moves.filter(m => {
          if (Date.now() > dl) return true;
          board[m.r][m.c] = botColor;
          const threat = vct(opp, 5, blocked, false, dl);
          board[m.r][m.c] = EMPTY;
          return !threat;
        });
        if (safe.length) moves = safe;
      }
    }
    if (moves.length === 1) return moves[0];

    uTT = new Map(); uAborted = false; uNodes = 0;
    const h0 = uHashBoard();
    let bestMove = moves[0];
    for (let depth = 2; depth <= 12; depth++) {
      let iterBest = null, iterVal = -Infinity, alpha = -Infinity;
      // 직전 반복의 최선 수를 먼저 탐색
      const ordered = [bestMove].concat(moves.filter(m => m !== bestMove));
      for (const m of ordered) {
        board[m.r][m.c] = botColor;
        const v = -uSearch(opp, depth - 1, -Infinity, -alpha, blocked, uPlace(h0, m.r, m.c, botColor), 1) + m.score * 1e-7;
        board[m.r][m.c] = EMPTY;
        if (uAborted) break;
        if (v > iterVal) { iterVal = v; iterBest = m; }
        if (v > alpha) alpha = v;
      }
      if (uAborted) { if (iterBest && iterVal > -WIN_SCORE / 2 && iterBest === ordered[0]) bestMove = iterBest; break; }
      bestMove = iterBest || bestMove;
      uLastDepth = depth;
      if (iterVal >= WIN_SCORE / 2) break; // 이기는 수순을 찾음
      if (Date.now() > searchDeadline - budgetMs * 0.45) break; // 다음 깊이를 끝낼 시간이 부족
    }
    return bestMove;
  }


  // ================= 슈퍼 울트라 짱짱맨 전용 =================
  // 공통 탐색 설정: 상대 패 읽기·흑백 스타일을 전역 탐색 변수에 반영
  function uSetupFor(botColor, cfg) {
    uWidths = (cfg && cfg.widths) || U_WIDTHS;
    const oppCards = cfg && cfg.readCards ? readOppCards(botColor) : {};
    uBot = botColor;
    uDefense = oppCards.chain ? 1.35 : 0.95;
    uFlipRisk = !!oppCards.reversal;
    // D. 흑이면 공격적으로(내 형세 가중), 백이면 수비적으로(상대 형세 가중)
    uStyle = cfg && cfg.style ? (botColor === BLACK ? { a: 1.2, b: 1.0 } : { a: 1.0, b: 1.25 }) : null;
    return { oppCards, trustForcing: !oppCards.bomb };
  }

  // B. 정석: 첫 몇 수는 알려진 강한 오프닝으로 (화월/포월 계열)
  function openingBookMove(bot, blocked) {
    const stones = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (isStone(board[r][c])) stones.push({ r, c, v: board[r][c] });
    const C = (SIZE - 1) / 2;
    const ok = (p) => p && inBoard(p.r, p.c) && board[p.r][p.c] === EMPTY && !blocked[bot][p.r * SIZE + p.c];
    if (stones.length === 0) { const p = { r: C, c: C }; return ok(p) ? p : null; }
    if (stones.length === 1 && bot === WHITE && stones[0].v === BLACK) {
      // 백 첫 수: 흑 돌에 대각선으로 붙이는 간접 응수 (중앙 쪽 우선)
      const s = stones[0];
      const opts = [[-1, -1], [-1, 1], [1, -1], [1, 1]].map(([dr, dc]) => ({ r: s.r + dr, c: s.c + dc }))
        .filter(ok).sort((a, b) => (Math.abs(a.r - C) + Math.abs(a.c - C)) - (Math.abs(b.r - C) + Math.abs(b.c - C)));
      return opts[0] || null;
    }
    if (stones.length === 2 && bot === BLACK) {
      const b = stones.find(s => s.v === BLACK), w = stones.find(s => s.v === WHITE);
      if (!b || !w) return null;
      const dr = w.r - b.r, dc = w.c - b.c;
      if (Math.max(Math.abs(dr), Math.abs(dc)) !== 1) return null;
      let opts;
      if (dr === 0 || dc === 0) {
        // 직접 응수 → 화월: 흑의 대각선이면서 백과 붙은 자리
        opts = dr === 0 ? [{ r: b.r - 1, c: b.c + dc }, { r: b.r + 1, c: b.c + dc }] : [{ r: b.r + dr, c: b.c - 1 }, { r: b.r + dr, c: b.c + 1 }];
      } else {
        // 간접 응수 → 포월: 흑과 붙고 백과도 붙은 자리
        opts = [{ r: b.r + dr, c: b.c }, { r: b.r, c: b.c + dc }];
      }
      opts = opts.filter(ok).sort((p, q) => (Math.abs(p.r - C) + Math.abs(p.c - C)) - (Math.abs(q.r - C) + Math.abs(q.c - C)));
      return opts[0] || null;
    }
    return null;
  }

  function scanFiveWinner() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const v = board[r][c];
      if (isStone(v) && checkWin(r, c, v)) return v;
    }
    return 0;
  }

  // player 차례인 국면의 가치 (player 관점, 반복 심화)
  function uBestValue(player, blocked, budgetMs) {
    searchDeadline = Date.now() + budgetMs;
    uTT = new Map(); uAborted = false; uNodes = 0;
    const opp = other(player);
    const root = uOrdered(player, blocked, 0, false);
    if (root.win) return WIN_SCORE;
    if (!root.list.length) return 0;
    const moves = root.list.slice(0, 12);
    const h0 = uHashBoard();
    let best = evalBoard(player, blocked);
    for (let depth = 2; depth <= 10; depth++) {
      let iterVal = -Infinity, alpha = -Infinity;
      for (const m of moves) {
        board[m.r][m.c] = player;
        const v = -uSearch(opp, depth - 1, -Infinity, -alpha, blocked, uPlace(h0, m.r, m.c, player), 1);
        board[m.r][m.c] = EMPTY;
        if (uAborted) break;
        if (v > iterVal) iterVal = v;
        if (v > alpha) alpha = v;
      }
      if (uAborted) break;
      best = iterVal;
      if (Math.abs(iterVal) >= WIN_SCORE / 2) break;
      if (Date.now() > searchDeadline - budgetMs * 0.45) break;
    }
    return best;
  }

  // C. 카드 + 착수 동시 계획: "이 카드를 이 대상에 쓰고 두는 것"과 "그냥 두는 것"을 수 읽기로 비교
  function planCardsSearch(bot, cfg, budgetMs) {
    const t0 = Date.now();
    uSetupFor(bot, cfg);
    const opp = other(bot);
    const snap = { board: board.map(r => r.slice()), windmillList: windmillList.slice(), craterList: craterList.map(c => Object.assign({}, c)), winLength, trapList: (trapList || []).slice() };
    const restore = () => {
      board = snap.board.map(r => r.slice());
      windmillList = snap.windmillList.slice();
      craterList = snap.craterList.map(c => Object.assign({}, c));
      winLength = snap.winLength;
      trapList = snap.trapList.slice();
    };
    const blocked0 = makeBlocked();
    const v2 = !!(cfg && cfg.cardPlan2);
    // 판 가치 계산: v2는 짱짱맨 v2 엔진(증분 평가·PVS), 아니면 기존 얼티밋 엔진
    if (v2) { e2Killers = []; e2Hist = { [BLACK]: new Int32Array(SIZE * SIZE), [WHITE]: new Int32Array(SIZE * SIZE) }; }
    const v3 = !!(cfg && cfg.cardPlan3);
    // v3: 함정 칸은 함정 주인의 상대가 쓸 수 없는 칸으로 계산 (두면 돌이 사라짐)
    const withTraps = (blk) => { if (v3) for (const tr of trapList || []) if (board[tr.r][tr.c] === EMPTY) blk[other(tr.owner)][tr.r * SIZE + tr.c] = 1; return blk; };
    const bestValue = (p, blk, ms) => { if (!v2) return uBestValue(p, blk, ms); e2Init(withTraps(blk)); return e2BestValue(p, ms); };
    // v4: 상대가 쥔 맞교환·연속 착수 한 장에 바로 지는 모양이면 그 결과는 사실상 패
    const v4 = !!(cfg && cfg.cardPlan4);
    const oc4 = v4 ? readOppCards(bot) : {};
    const riskNow = () => {
      if (!v4 || !(oc4.trade || oc4.chain)) return 0;
      e2Init(withTraps(makeBlocked()));
      return ((oc4.trade && e2TradeRisk(bot)) || (oc4.chain && e2ChainRisk(bot))) ? WIN_SCORE / 2 : 0;
    };
    // v4: 필승 수순(VCT) 유무 — 식스센스가 상대 수순을 끊는지/내 수순을 끊는지
    const vctNow = (p) => { e2Init(withTraps(makeBlocked())); return !!e2Vct(p, 6, Date.now() + 120, null); };
    const six5 = v4 && winLength === 5 && (hand[bot] || []).some(c => c.type === 'six_sense') ? { opp: vctNow(opp), me: vctNow(bot) } : null;
    const options = [];
    (hand[bot] || []).forEach((card, idx) => {
      if (card.type === 'remove_enemy') {
        // v3: 돌을 없앤 뒤 막힌 칸(풍차 효과)까지 다시 계산해서 순위, 상대 풍차 돌은 항상 후보
        const isMill = (s) => windmillList.some(w => w.r === s.r && w.c === s.c);
        let ranked = listStones(opp).filter(s => !isProtected(s.r, s.c)).map(s => {
          board[s.r][s.c] = EMPTY; const g = evalBoard(bot, v3 ? makeBlocked() : blocked0); board[s.r][s.c] = opp; return { s, g };
        }).sort((a, b) => b.g - a.g).slice(0, v2 ? 6 : 4);
        if (v3) for (const s of listStones(opp)) if (isMill(s) && !isProtected(s.r, s.c) && !ranked.some(x => x.s.r === s.r && x.s.c === s.c)) ranked.push({ s });
        for (const { s } of ranked) options.push({ idx, cardId: card.id, targets: [s], endsTurn: false,
          apply: () => { board[s.r][s.c] = EMPTY; windmillList = windmillList.filter(w => !(w.r === s.r && w.c === s.c)); craterList.push({ r: s.r, c: s.c, turns: 2, fresh: true }); } });
      } else if (card.type === 'windmill') {
        const ranked = listStones(bot).filter(s => !windmillList.some(w => w.r === s.r && w.c === s.c)).map(s => {
          let g = 0;
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            const r = s.r + dr, c = s.c + dc;
            if ((!dr && !dc) || !inBoard(r, c) || board[r][c] !== EMPTY || blocked0[opp][r * SIZE + c]) continue;
            g += Math.min(attackValue(r, c, opp, blocked0[opp]).score, P_OPEN4);
            // v3: 공격용 — 내 공격 자리 둘레에 풍차를 세우면 상대가 그 자리를 막지 못함
            if (v3) g += Math.min(attackValue(r, c, bot, blocked0[bot]).score, P_OPEN4);
          }
          return { s, g };
        }).filter(x => x.g > 0).sort((a, b) => b.g - a.g).slice(0, v3 ? 6 : 3);
        for (const { s } of ranked) options.push({ idx, cardId: card.id, targets: [s], endsTurn: false, apply: () => { windmillList.push({ r: s.r, c: s.c }); } });
      } else if (card.type === 'six_sense' && winLength === 5) {
        options.push({ idx, cardId: card.id, targets: [], endsTurn: false, apply: () => { winLength = 6; } });
      } else if (card.type === 'trade') {
        const pairs = [];
        for (const a of listStones(opp)) for (const b of listStones(bot)) {
          if (!isOrthoAdjacent(a, b) || isProtected(a.r, a.c) || swapMakesLine(a.r, a.c, b.r, b.c)) continue;
          board[a.r][a.c] = bot; board[b.r][b.c] = opp;
          const g = evalBoard(bot, blocked0);
          board[a.r][a.c] = opp; board[b.r][b.c] = bot;
          pairs.push({ a, b, g });
        }
        pairs.sort((x, y) => y.g - x.g);
        for (const { a, b } of pairs.slice(0, v2 ? 6 : 4)) options.push({ idx, cardId: card.id, targets: [a, b], endsTurn: true,
          apply: () => { board[a.r][a.c] = bot; board[b.r][b.c] = opp; } });
      } else if (v2 && card.type === 'infection') {
        // 감염: 맞닿은 상대 돌 중 무작위 2개 → 가능한 쌍 몇 가지의 평균 가치 (5목이 되는 전향은 규칙상 제외)
        const ts = getOrthogonalEnemyNeighbors(bot).filter(t => { board[t.r][t.c] = bot; const w = checkWin(t.r, t.c, bot); board[t.r][t.c] = opp; return !w; });
        if (ts.length) {
          const all = [];
          if (ts.length === 1) all.push([ts[0]]);
          else for (let a = 0; a < ts.length; a++) for (let b = a + 1; b < ts.length; b++) all.push([ts[a], ts[b]]);
          const step = Math.max(1, all.length / 6), combos = [];
          for (let k = 0; k < all.length && combos.length < 6; k += step) combos.push(all[Math.floor(k)]); // 고르게 표본
          options.push({ idx, cardId: card.id, targets: [], endsTurn: true, combos });
        }
      } else if (v3 && card.type === 'trap') {
        // 함정: 내가 다음 수로 4를 만들 때 상대가 막아야 하는 자리에 미리 깔면 그 4는 막을 수 없음 (+ 상대 급소 몇 곳)
        e2Init(withTraps(makeBlocked()));
        const spots = new Set();
        for (const q of collectCandidates(bot, 2, blocked0, false)) {
          const i = q.r * SIZE + q.c;
          if (e2Attack(i, bot).fours < 1) continue;
          e2Place(i, bot); for (const x of e2WinCells(bot)) spots.add(x); e2Remove(i, bot);
        }
        collectCandidates(opp, 2, blocked0, false).map(q => ({ i: q.r * SIZE + q.c, s: e2Attack(q.r * SIZE + q.c, opp).score }))
          .sort((a, b) => b.s - a.s).slice(0, 3).forEach(x => spots.add(x.i));
        for (const i of Array.from(spots).slice(0, 8)) {
          const p = { r: (i / SIZE) | 0, c: i % SIZE };
          if (board[p.r][p.c] !== EMPTY || (trapList || []).some(t => t.r === p.r && t.c === p.c)) continue;
          options.push({ idx, cardId: card.id, targets: [p], endsTurn: false, apply: () => { trapList.push({ r: p.r, c: p.c, owner: bot }); } });
        }
      } else if (v4 && card.type === 'teleport') {
        // 순간이동: 상대 카드 한 장에 지는 쌍에 걸린 내 돌을 빼냄 (도착 칸은 무작위라 무시) + 가장 쓸모없는 돌
        e2Init(withTraps(makeBlocked()));
        const r0 = e2TradeRisk(bot) + e2ChainRisk(bot);
        const scored = listStones(bot).filter(st => !windmillList.some(w => w.r === st.r && w.c === st.c)).map(st => {
          const i = st.r * SIZE + st.c; e2Remove(i, bot);

          e2Place(i, bot);
          return { st, fix: r0 - risk, val };
        });
        const picks = scored.filter(x => x.fix > 0).slice(0, 4).concat(scored.sort((a, b) => b.val - a.val).slice(0, 1));
        for (const { st } of picks) options.push({ idx, cardId: card.id, targets: [st], endsTurn: false, apply: () => { board[st.r][st.c] = EMPTY; } });
      } else if (v4 && card.type === 'earthquake') {
        options.push({ idx, cardId: card.id, targets: [], endsTurn: false, quake: 4 });
      } else if (v2 && card.type === 'chain_move') {
        // 연속 착수는 기존처럼 바로 쓰되(측정 결과 아껴 두면 오히려 약함), 이번 턴에 끝내는 수순이 있으면 계획에 '승리'로 표시
        options.push({ idx, cardId: card.id, targets: [], endsTurn: false, chain: true });

        for (let k = 0; k < o.quake; k++) {

          const f = scanFiveWinner();

          sum += x; if (x < WIN_SCORE / 2) allWin = false;

        const blk = makeBlocked(); e2Init(blk);

      } else {
        o.apply();
        const f = scanFiveWinner();
        if (f === bot) v = WIN_SCORE;
        else if (f === opp) v = -WIN_SCORE;
        else {

  }

  // 지진 결과 한 가지를 판에 그대로 적용 (runEarthquake와 같은 규칙, 기록·연출 없음) — 카드 계획의 표본용
  function simQuake() {
    const stones = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (isStone(board[r][c])) stones.push({ r, c, color: board[r][c], mill: windmillList.some(w => w.r === r && w.c === c) });
    const occ = new Set(stones.map(s => s.r * SIZE + s.c)), claimed = new Set();
    const walls = [];
    for (let i = 0; i < SIZE * SIZE; i++) if (board[(i / SIZE) | 0][i % SIZE] === WALL) { walls.push(i); occ.add(i); }
    const order = stones.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }
    const pos = new Array(stones.length);
    for (const i of order) {
      const s = stones[i], nb = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const r = s.r + dr, c = s.c + dc, k = r * SIZE + c;
        if (!inBoard(r, c) || occ.has(k) || claimed.has(k) || isCrater(r, c)) continue;
        nb.push(k);
      }
      const k = nb.length ? nb[Math.floor(Math.random() * nb.length)] : s.r * SIZE + s.c;
      claimed.add(k); pos[i] = k;
    }
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
    walls.forEach(i => { board[(i / SIZE) | 0][i % SIZE] = WALL; });
    windmillList = [];
    stones.forEach((s, i) => { const r = (pos[i] / SIZE) | 0, c = pos[i] % SIZE; board[r][c] = s.color; if (s.mill) windmillList.push({ r, c }); });
  }

  // A. 백그라운드 계산(Web Worker): 탐색 함수들을 그대로 옮겨 실행해 화면이 멈추지 않게 함

        `const P_FIVE = ${P_FIVE}, P_OPEN4 = ${P_OPEN4}, P_FOUR = ${P_FOUR}, P_OPEN3 = ${P_OPEN3}, P_THREE = ${P_THREE}, P_OPEN2 = ${P_OPEN2}, P_TWO = ${P_TWO};`,
        `const WIN_SCORE = ${WIN_SCORE}, U_WIDTHS = ${JSON.stringify(U_WIDTHS)};`,
        `const ZOB = ${JSON.stringify(ZOB)};`,

  // task: 'move' | 'plan'. 워커를 못 쓰면 같은 계산을 짧은 시간으로 바로 실행

  const ENGINE_PLANNED_TYPES = ['remove_enemy', 'windmill', 'six_sense', 'trade', 'reversal'];

  // ================= 짱짱맨 엔진 v2 =================
  // 1) 돌 하나를 놓을 때 그 돌이 지나는 줄(창)만 다시 계산하는 증분 평가
  // 2) 킬러 수·히스토리 정렬, 좁은 창 탐색(PVS), 가망 없는 수 얕게 읽기(LMR)

  const E2P = { tr: 60, cr: 40, ta: 50, g1: 800, g2: 70, g3: 8, g4: 1, bA: 1.2, bB: 1.0, wA: 1.0, wB: 1.25 };
  let e2L = 0, e2NW = 0, e2WCells = null, e2CellW = null, e2CellWAll = null;
  let e2CntB = null, e2CntW = null, e2BlkB = null, e2BlkW = null, e2SB = 0, e2SW = 0, e2Nb = null, e2WG = null, e2Grid = null;

  function e2BuildTables(L) {
    if (e2L === L && e2WCells) return;

    const cells = [], cellW = [];
    for (let i = 0; i < SIZE * SIZE; i++) cellW.push([[], [], [], []]);

  function e2NbAdd(i, delta) {

  // i 칸에 p를 두면 생기는 모양 (attackValue와 같은 판정, 창 개수를 이용해 빠르게)
  function e2Attack(i, p) {

    return { score, five: false, fours };
  }

  // 후보 정렬 + 위협 가지치기 (uOrdered와 같은 규칙)
  function e2Ordered(p, width, rootList) {
    const o = other(p), gP = e2Grid[p], gO = e2Grid[o];
    const all = [], blocks = [], critical = [];
    const consider = (i) => {
      const a = e2Attack(i, p);
      if (a.five) return { i, r: (i / SIZE) | 0, c: i % SIZE, score: P_FIVE };
      const d = gO[i] ? { score: 0, five: false } : e2Attack(i, o);
      const m = { i, r: (i / SIZE) | 0, c: i % SIZE, score: a.score + d.score * uDefense, four: a.fours >= 1 };
      all.push(m);
      if (d.five) blocks.push(m);
      else if (d.score >= P_OPEN4 || a.fours >= 1) critical.push(m);
      return null;
    };
    if (rootList) {
      for (const q of rootList) { const win = consider(q.r * SIZE + q.c); if (win) return { win, list: [win] }; }
    } else {
      let any = false;
      for (let i = 0; i < SIZE * SIZE; i++) {
        if (e2Nb[i] <= 0 || gP[i] || e2At(i) !== EMPTY) continue;
        any = true;
        const win = consider(i); if (win) return { win, list: [win] };
      }
      if (!any && e2At(112) === EMPTY) consider(112);
    }
    let list = all, forced = false;
    if (blocks.length) { list = blocks; forced = true; }
    else if (critical.length && critical.some(m => m.score >= P_OPEN4 * 0.9)) list = critical;
    list.sort((a, b) => b.score - a.score);
    return { win: null, list: width ? list.slice(0, width) : list, forced };
  }

  function e2Search(p, depth, alpha, beta, h, ply) {
    if ((++e2Nodes & 255) === 0 && Date.now() > searchDeadline) uAborted = true;
    if (uAborted) return 0;
    if (ply > e2MaxDepth) e2MaxDepth = ply;
    const key = uKey(h, p);
    const e = uTT.get(key);
    const alpha0 = alpha;
    if (e && e.depth >= depth) {
      if (e.flag === 0) return e.value;
      if (e.flag === 1 && e.value > alpha) alpha = e.value;
      else if (e.flag === 2 && e.value < beta) beta = e.value;
      if (alpha >= beta) return e.value;
    }
    const moves = e2Ordered(p, uWidths[Math.min(ply, uWidths.length - 1)], null);
    if (moves.win) return WIN_SCORE - ply;
    if (!moves.list.length) return 0;
    if (depth <= 0) return e2Eval(p);
    // 정렬: 치환표의 최선 수 → 킬러 수 → 히스토리 가산
    const kill = e2Killers[ply] || [];
    const hist = e2Hist[p];
    for (const m of moves.list) m.ord = m.score + hist[m.i] * 4 + (kill[0] === m.i || kill[1] === m.i ? P_OPEN3 : 0) + (e && e.best === m.i ? 1e9 : 0);
    moves.list.sort((a, b) => b.ord - a.ord);
    const o = other(p);
    let best = -Infinity, bestIdx = -1;
    for (let k = 0; k < moves.list.length; k++) {
      const m = moves.list[k];
      e2Place(m.i, p);
      const h2 = uPlace(h, m.r, m.c, p);
      let v;
      if (k === 0) v = -e2Search(o, depth - 1, -beta, -alpha, h2, ply + 1);
      else {
        const reduce = (k >= 3 && depth >= 3 && !moves.forced && !m.four && m.score < P_OPEN3) ? 1 : 0;
        v = -e2Search(o, depth - 1 - reduce, -alpha - 1, -alpha, h2, ply + 1);
        if (!uAborted && v > alpha && (reduce || v < beta)) v = -e2Search(o, depth - 1, -beta, -alpha, h2, ply + 1);
      }
      e2Remove(m.i, p);
      if (uAborted) return 0;
      if (v > best) { best = v; bestIdx = m.i; }
      if (best > alpha) alpha = best;
      if (alpha >= beta) {
        if (kill[0] !== m.i) { e2Killers[ply] = [m.i, kill[0]]; }
        hist[m.i] += depth * depth;
        break;
      }
    }
    uTT.set(key, { depth, value: best, flag: best <= alpha0 ? 2 : best >= beta ? 1 : 0, best: bestIdx });
    return best;
  }

  // ---- 3) 연속 위협(VCT): 막는 수를 빠짐없이 따지는 탐색 ----
  function e2WinCells(p) {
    const L = e2L, cP = p === BLACK ? e2CntB : e2CntW, cO = p === BLACK ? e2CntW : e2CntB, blk = p === BLACK ? e2BlkB : e2BlkW;
    const out = [];
    for (let w = 0; w < e2NW; w++) {
      if (cP[w] !== L - 1 || cO[w] || blk[w]) continue;
      for (let t = 0; t < L; t++) { const x = e2WCells[w * L + t]; if (e2At(x) === EMPTY) { if (!out.includes(x)) out.push(x); break; } }
    }
    return out;
  }
  // p가 한 수로 막을 수 없는 위협(열린 4·4-4 등)을 만들 수 있는지
  function e2HasDoubleMove(p) {
    const L = e2L, cP = p === BLACK ? e2CntB : e2CntW, cO = p === BLACK ? e2CntW : e2CntB, blk = p === BLACK ? e2BlkB : e2BlkW;
    const seen = new Uint8Array(SIZE * SIZE), g = e2Grid[p];
    for (let w = 0; w < e2NW; w++) {
      if (cP[w] !== L - 2 || cO[w] || blk[w]) continue;
      for (let t = 0; t < L; t++) {
        const x = e2WCells[w * L + t];
        if (seen[x] || e2At(x) !== EMPTY || g[x]) continue;
        seen[x] = 1;
        const a = e2Attack(x, p);
        if (a.five || a.fours >= 2) return true;
      }
    }
    return false;
  }
  // p가 4를 만들 수 있는 칸이 하나라도 있는지 (반격 가능성)
  function e2HasFourMove(p) {
    const L = e2L, cP = p === BLACK ? e2CntB : e2CntW, cO = p === BLACK ? e2CntW : e2CntB, blk = p === BLACK ? e2BlkB : e2BlkW;
    for (let w = 0; w < e2NW; w++) if (cP[w] >= L - 2 && !cO[w] && !blk[w]) return true;
    return false;
  }
  // att가 연속 위협으로 이기는 첫 수 (없으면 null). legalRoot: 첫 수로 둘 수 있는 칸 집합
  function e2Vct(att, depth, deadline, legalRoot) {
    if (depth <= 0 || Date.now() > deadline) return null;
    const def = other(att), L = e2L;
    const mine = e2WinCells(att);
    for (const x of mine) if (!legalRoot || legalRoot.has(x)) return { r: (x / SIZE) | 0, c: x % SIZE };
    if (e2WinCells(def).length) return null;
    const cP = att === BLACK ? e2CntB : e2CntW, cO = att === BLACK ? e2CntW : e2CntB, blk = att === BLACK ? e2BlkB : e2BlkW;
    const seen = new Uint8Array(SIZE * SIZE), g = e2Grid[att], threats = [];
    for (let w = 0; w < e2NW; w++) {
      if (cP[w] < L - 3 || cO[w] || blk[w]) continue;
      for (let t = 0; t < L; t++) {
        const x = e2WCells[w * L + t];
        if (seen[x] || e2At(x) !== EMPTY || g[x] || (legalRoot && !legalRoot.has(x))) continue;
        seen[x] = 1;
        const a = e2Attack(x, att);
        if (a.five) return { r: (x / SIZE) | 0, c: x % SIZE };
        if (a.fours >= 1) { threats.push({ x, s: a.score + P_FIVE }); continue; }
        if (a.score < P_OPEN3) continue;
        e2Place(x, att);
        const dbl = e2HasDoubleMove(att);
        e2Remove(x, att);
        if (dbl) threats.push({ x, s: a.score });
      }
    }
    threats.sort((a, b) => b.s - a.s);
    for (const tm of threats.slice(0, 12)) {
      e2Place(tm.x, att);
      const ok = e2VctDefend(att, depth, deadline);
      e2Remove(tm.x, att);
      if (ok) return { r: (tm.x / SIZE) | 0, c: tm.x % SIZE };
      if (Date.now() > deadline) return null;
    }
    return null;
  }
  // att가 방금 위협을 만든 뒤, def의 모든 방어에 대해 att가 계속 이기는지 (반격 4가 있으면 보수적으로 실패)
  function e2VctDefend(att, depth, deadline) {
    const def = other(att), L = e2L;
    if (e2WinCells(def).length) return false;
    const wins = e2WinCells(att);
    if (wins.length >= 2) return true;
    let defs;
    if (wins.length === 1) {
      if (e2Grid[def][wins[0]]) return true;
      defs = [wins[0]];
    } else {
      if (e2HasFourMove(def)) return false;
      const cP = att === BLACK ? e2CntB : e2CntW, cO = att === BLACK ? e2CntW : e2CntB, blk = att === BLACK ? e2BlkB : e2BlkW;
      const seen = new Uint8Array(SIZE * SIZE), g = e2Grid[def];
      defs = [];
      for (let w = 0; w < e2NW; w++) {
        if (cP[w] < L - 2 || cO[w] || blk[w]) continue;
        for (let t = 0; t < L; t++) {
          const x = e2WCells[w * L + t];
          if (seen[x] || e2At(x) !== EMPTY || g[x]) continue;
          seen[x] = 1;
          e2Place(x, def);
          const still = e2WinCells(att).length > 0 || e2HasDoubleMove(att);
          e2Remove(x, def);
          if (!still) defs.push(x);
        }
      }
      if (!defs.length) return true;
    }
    for (const d of defs) {
      e2Place(d, def);
      const cont = e2Vct(att, depth - 1, deadline, null) !== null;
      e2Remove(d, def);
      if (!cont) return false;
    }
    return true;
  }

  // player 차례 국면의 가치 (v2 탐색, player 관점) — e2Init이 된 상태에서 호출
  function e2BestValue(player, budgetMs) {
    const dl = Date.now() + budgetMs;
    const saved = searchDeadline; searchDeadline = dl;
    uTT = new Map(); uAborted = false;
    const root = e2Ordered(player, 10, null);
    let best = e2Eval(player);
    if (root.win) { searchDeadline = saved; return WIN_SCORE; }
    if (!root.list.length) { searchDeadline = saved; return 0; }
    const o = other(player), h0 = uHashBoard();
    for (let depth = 2; depth <= 12; depth++) {
      let iv = -Infinity, alpha = -Infinity;
      for (const m of root.list) {
        e2Place(m.i, player);
        const v = -e2Search(o, depth - 1, -Infinity, -alpha, uPlace(h0, m.r, m.c, player), 1);
        e2Remove(m.i, player);
        if (uAborted) break;
        if (v > iv) iv = v;
        if (v > alpha) alpha = v;
      }
      if (uAborted) break;
      best = iv;
      if (Math.abs(iv) >= WIN_SCORE / 2 || Date.now() > dl - budgetMs * 0.45) break;
    }
    uAborted = false; searchDeadline = saved;
    return best;
  }

  // 맞교환 위험: 상대가 맞교환 한 장으로 곧바로 이기는(5목 또는 막을 수 없는 4) 흑·백 쌍의 수
  function e2TradeRisk(me) {
    const opp = other(me);
    let n = 0;
    for (let i = 0; i < SIZE * SIZE; i++) {
      const r = (i / SIZE) | 0, c = i % SIZE;
      if (board[r][c] !== me || isProtected(r, c)) continue; // 보호막 안의 돌은 상대가 바꿀 수 없음
      for (const [dr, dc] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (!inBoard(r2, c2) || board[r2][c2] !== opp) continue;
        const j = r2 * SIZE + c2;
        e2Remove(i, me); e2Place(i, opp); e2Remove(j, opp); e2Place(j, me);
        // 오목/육목이 완성되는 교환은 규칙상 불가 → 막을 수 없는 4가 생기는 경우만 위험
        const illegal = checkWin(r, c, opp) || checkWin(r2, c2, me);
        const lost = !illegal && !e2WinCells(me).length && e2WinCells(opp).length >= 2;
        e2Remove(j, me); e2Place(j, opp); e2Remove(i, opp); e2Place(i, me);
        if (lost) n++;
      }
    }
    return n;
  }

  // 연속 착수 위험: 상대가 연속 착수(최대 3수, 같은 턴 돌끼리 2칸 이내 금지) 한 턴으로 끝낼 수 있는지
  //   돌 2개를 떨어뜨려 놓아 5목을 만들거나, 4를 두 개 만들어 한 수로 못 막게 하는 경우 (한 수만으로 되는 열린 4는 일반 탐색이 이미 막음)
  function e2ChainRisk(me) {
    const opp = other(me), L = e2L, cO = opp === BLACK ? e2CntB : e2CntW, cM = opp === BLACK ? e2CntW : e2CntB, blk = opp === BLACK ? e2BlkB : e2BlkW;
    if (e2WinCells(opp).length) return 0; // 이미 바로 이기는 자리는 일반 탐색 몫
    const F = [], seen = new Uint8Array(SIZE * SIZE), g = e2Grid[opp];
    for (let w = 0; w < e2NW && F.length < 24; w++) {
      if (cO[w] !== L - 2 || cM[w] || blk[w]) continue;
      for (let t = 0; t < L; t++) { const x = e2WCells[w * L + t]; if (e2At(x) === EMPTY && !g[x] && !seen[x]) { seen[x] = 1; F.push(x); } }
    }
    const single = F.map(x => { e2Place(x, opp); const n = e2WinCells(opp).length; e2Remove(x, opp); return n; });
    for (let a = 0; a < F.length; a++) {
      if (single[a] >= 2) continue;
      for (let b = a + 1; b < F.length; b++) {
        if (single[b] >= 2) continue;
        const x = F[a], y = F[b];
        if (Math.max(Math.abs(((x / SIZE) | 0) - ((y / SIZE) | 0)), Math.abs((x % SIZE) - (y % SIZE))) <= 2) continue;
        e2Place(x, opp); e2Place(y, opp);
        const lost = checkWin((x / SIZE) | 0, x % SIZE, opp) || checkWin((y / SIZE) | 0, y % SIZE, opp) || e2WinCells(opp).length >= 2;
        e2Remove(y, opp); e2Remove(x, opp);
        if (lost) return 1;
      }
    }
    return 0;
  }

  // 연속 착수 계획: 이번 턴에 남은 left수를 한꺼번에 묶어 따져 첫 수를 고름 → { move, value }
  //   (같은 턴 돌끼리 2칸 이내 금지 규칙 반영, 끝난 뒤 상대 차례 가치로 비교)
  function e2ChainPlan(bot, blocked, budgetMs, left) {
    const opp = other(bot), t0 = Date.now(), dl = t0 + budgetMs;
    const placed0 = (turnPlacedPositions || []).map(p => p.r * SIZE + p.c);
    const far = (i, list) => list.every(j => Math.max(Math.abs(((i / SIZE) | 0) - ((j / SIZE) | 0)), Math.abs((i % SIZE) - (j % SIZE))) > 2);
    const widths = left >= 3 ? [10, 7, 5] : [12, 9];
    const cands = (taken, n) => {
      const out = [];
      for (let i = 0; i < SIZE * SIZE; i++) {
        if (e2Nb[i] <= 0 || blocked[bot][i] || e2At(i) !== EMPTY || !far(i, taken)) continue;
        const a = e2Attack(i, bot), d = e2Attack(i, opp);
        out.push({ i, s: a.five ? 1e9 : a.score + d.score * (d.five ? 50 : 1) });
      }
      return out.sort((x, y) => y.s - x.s).slice(0, n);
    };
    const leaves = [];
    const walk = (seq, taken, k) => {
      if (Date.now() > dl - budgetMs * 0.5) return;
      if (k === left) {
        // 내 턴 끝 → 상대 차례: 상대가 바로 이기면 패, 내가 막을 수 없는 4가 둘 이상이면 승에 가까움
        let v;
        if (e2WinCells(opp).length) v = -WIN_SCORE;
        else if (e2WinCells(bot).length >= 2) v = WIN_SCORE / 2;
        else v = e2Eval(bot);
        leaves.push({ seq: seq.slice(), v });
        return;
      }
      for (const c of cands(taken, widths[k])) {
        e2Place(c.i, bot);
        const r = (c.i / SIZE) | 0, cc = c.i % SIZE;
        if (checkWin(r, cc, bot)) { e2Remove(c.i, bot); leaves.push({ seq: seq.concat(c.i), v: WIN_SCORE }); continue; }
        seq.push(c.i); taken.push(c.i);
        walk(seq, taken, k + 1);
        seq.pop(); taken.pop();
        e2Remove(c.i, bot);
      }
    };
    walk([], placed0.slice(), 0);
    if (!leaves.length) return null;
    leaves.sort((a, b) => b.v - a.v);
    // 상위 몇 개 조합은 상대 응수까지 실제로 읽어 다시 비교
    const top = leaves.slice(0, 6).filter(l => Math.abs(l.v) < WIN_SCORE / 2);
    const won = leaves.find(l => l.v === WIN_SCORE); // 이번 턴 안에 5목
    if (won) { const i = won.seq[0]; return { move: { r: (i / SIZE) | 0, c: i % SIZE }, value: WIN_SCORE }; }
    let best = leaves[0];
    if (top.length) {
      const each = Math.max(60, Math.floor((dl - Date.now()) / top.length));
      for (const l of top) {
        l.seq.forEach(i => e2Place(i, bot));
        l.v = -e2BestValue(opp, each);
        for (let k = l.seq.length - 1; k >= 0; k--) e2Remove(l.seq[k], bot);
      }
      const pool = leaves.filter(l => Math.abs(l.v) >= WIN_SCORE / 2).concat(top).sort((a, b) => b.v - a.v);
      best = pool[0];
    }
    const i = best.seq[0];
    return { move: { r: (i / SIZE) | 0, c: i % SIZE }, value: best.v };

    if (cfg && cfg.readCards) for (const tr of trapList || []) if (tr.owner === opp && board[tr.r][tr.c] === EMPTY) blocked[botColor][tr.r * SIZE + tr.c] = 1;

    e2Init(blocked);

    const left = (turnPlacementsNeeded || 1) - turnPlacementsDone;
    if (cfg && cfg.chainPlan && left >= 2) {
      // 이번 턴 안에 확실히 끝나는 수순(5목, 또는 막을 수 없는 4 두 개)을 찾았을 때만 따르고, 아니면 한 수씩 안전하게 읽는 기존 방식

      e2Init(blocked);

  function botChooseMove(botColor) {

    const opp = other(botColor);

    if (!cfg.patterns) {
      const cands = collectCandidates(botColor, cfg.radius, blocked, true);
      if (!cands.length) return null;
      const defense = Math.random() < cfg.missChance ? 0.1 : cfg.defense;
      const scored = cands.map(p => ({ r: p.r, c: p.c, score: simpleCellScore(p.r, p.c, botColor, defense) }));
      scored.sort((a, b) => b.score - a.score);
      const pool = scored.slice(0, Math.min(cfg.topN, scored.length));
      return pool[Math.floor(Math.random() * pool.length)];
    }

    if (cfg.engine2) return e2ChooseMove(botColor, blocked, turnPlacementsDone > 0 ? 900 : Math.min(cfg.timeMs, 5000), cfg);
    if (cfg.ultimate) return ultimateChooseMove(botColor, blocked, turnPlacementsDone > 0 ? 900 : (cfg.worker ? Math.min(cfg.timeMs, 5000) : cfg.timeMs), cfg);

  function botPlaceStone(botColor) {

  }
  function placeBotPick(botColor, pick) {

  // ---- 고난이도: 상황을 보고 카드 사용 ----
  function listStones(color) {

    if (reads && cardLockNextTurn[botColor] && hand[botColor].length > 1) {

      let junk = -1, junkRank = Infinity;
      hand[botColor].forEach((c, i) => { const r = junkOrder.indexOf(c.id); if (r !== -1 && r < junkRank) { junkRank = r; junk = i; } });
