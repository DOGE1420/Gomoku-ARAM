          if (expected > 450 * scale) consider(idx, expected);
          break;
        }
        case 'skip_turn': {
          // 시간 정지 = 두 번 연달아 두기: 내 3이 있으면 4→5로 끝냄, 상대 위협이 둘 이상이면 둘 다 막음
          const L = winLength;
          let my3 = false;
          for (const p of collectCandidates(botColor, 2, blocked, false)) { if (attackValue(p.r, p.c, botColor, blocked[botColor]).fours >= 1) { my3 = true; break; } }
          if (my3) consider(idx, 50000);
          else if (oppWins.length >= 2 || hasOpenFourThreat(opp, blocked)) consider(idx, 45000);
          else if (overflowSoon && idx === 0) consider(idx, 500);
          break;
        }
        case 'wall': {
          // 장벽: 상대가 바로 이기는 자리를 내 돌 없이 막음 (둘이면 장벽 하나 + 착수 하나로 둘 다 막음), 아니면 상대 급소를 영구 봉쇄
          const cands = collectCandidates(opp, 2, blocked, false)
            .filter(p => !trapList.some(t => t.r === p.r && t.c === p.c))
            .map(p => ({ p, s: attackValue(p.r, p.c, opp, blocked[opp]).score }))
            .sort((a, b) => b.s - a.s);
          if (oppWins.length >= 2) consider(idx, 46000, [oppWins[0]]);
          else if (cands.length && cands[0].s >= P_OPEN3) consider(idx, 2500 + Math.min(cands[0].s, P_OPEN4) / 100, [cands[0].p]);
          else if (overflowSoon && idx === 0 && cands.length) consider(idx, 300, [cands[0].p]);
          break;
        }
        case 'rewind': {
          // 되감기: 상대 직전 돌이 위협의 핵심이면 되돌림
          const lm = lastOppStone(botColor);
          if (!lm || isProtected(lm.r, lm.c)) break;
          board[lm.r][lm.c] = EMPTY;
          const remain = findWinCells(opp, blocked[opp]).length, gain = evalBoard(botColor, blocked) - base;
          board[lm.r][lm.c] = opp;
          if (oppWins.length && remain < oppWins.length) consider(idx, 44000 + gain);
          else if (gain > 600 * scale) consider(idx, 1500 + gain);
          break;
        }
        case 'shield': {
          // 보호막: 상대가 쥔 맞교환·폭파·감염으로 무너질 돌을 지킴
          if (!reads || !(oppCards.trade || oppCards.bomb || oppCards.infection || oppCards.rewind || oppCards.magnet)) {
            if (overflowSoon && idx === 0 && hasStoneOf(botColor)) consider(idx, 200);
            break;
          }
          let bestT = null, bestV = 0;
          for (const s2 of listStones(botColor)) {
            // 주변 3×3에서 내 돌이 맞닿은 상대 돌 수 + 줄 가치로 대략 평가
            let v = 0;
            for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
              const r = s2.r + dr, c = s2.c + dc;
              if (!inBoard(r, c) || board[r][c] !== botColor) continue;
              board[r][c] = EMPTY; v += Math.max(0, base - evalBoard(botColor, blocked)); board[r][c] = botColor;
            }
            if (v > bestV) { bestV = v; bestT = s2; }
          }
          if (bestT && bestV > 300) consider(idx, 3000 + Math.min(bestV, 30000), [bestT]);
          break;
        }
        case 'steal':
          // 강탈: 상대 패가 있으면 사용 (위험한 카드를 쥐고 있으면 더 급함)
          if (hand[opp].length) consider(idx, reads && (oppCards.chain || oppCards.trade || oppCards.reversal || oppCards.timestop || oppCards.bomb) ? 5000 : 1300);
          break;
        case 'reroll':
          // 리롤: 남은 패가 약한 카드뿐이면 새로 뽑음
          if (hand[botColor].length >= 2 && hand[botColor].every((c, i) => i === idx || ['teleport', 'earthquake', 'alkkagi', 'reroll'].includes(c.id))) consider(idx, 900);
          else if (overflowSoon && idx === 0) consider(idx, 150);
          break;
        case 'magnet': {
          // 자석: 내 돌을 끌어와 줄을 만드는 칸을 찾음 (돌 모양을 실제로 바꿔 보고 평가)
          let bestT = null, bestGain = 0;
          const snapB = board.map(row => row.slice()), snapW = windmillList.map(w => Object.assign({}, w)), snapH = moveHistory.map(m => Object.assign({}, m)), snapT = trapList.slice();
          for (const p of collectCandidates(botColor, 2, blocked, false)) {
            applyMagnet(p.r, p.c, botColor);
            const f = scanFiveWinner();
            const g = f === botColor ? 1e6 : f === opp ? -1e6 : evalBoard(botColor, makeBlocked()) - base;
            board = snapB.map(row => row.slice()); windmillList = snapW.map(w => Object.assign({}, w)); moveHistory = snapH.map(m => Object.assign({}, m)); trapList = snapT.slice();
            if (g > bestGain) { bestGain = g; bestT = p; }
          }
          if (bestT && bestGain > 800 * scale) consider(idx, 1000 + Math.min(bestGain, 1e6), [bestT]);
          break;
        }
        case 'earthquake':
        case 'alkkagi':
          // 무작위성이 큰 카드는 불리할 때 판을 흔드는 용도, 곧 버려질 카드면 크게 이기고 있지 않을 때 사용
          if (oppWins.length >= 2 || base < -1500) consider(idx, 800);
          else if (overflowSoon && idx === 0 && base < 1500) consider(idx, 150);
          break;
        case 'teleport': {
          // 곧 버려질 카드면, 판에 가장 도움이 덜 되는 내 돌을 옮김
          if (!(overflowSoon || (handLen >= 3 && idx === 0))) break;
          let bestT = null, leastLoss = Infinity;
          for (const st of listStones(botColor)) {
            board[st.r][st.c] = EMPTY;
            const loss = base - evalBoard(botColor, blocked);
            board[st.r][st.c] = botColor;
            if (loss < leastLoss) { leastLoss = loss; bestT = st; }
          }
          if (bestT && leastLoss < 60) consider(idx, 120, [bestT]);
          break;
        }
      }
    });

    if (!best) return false;
    const choice = best;
    return activateCard(botColor, choice.idx, () => {
      applyBotTargets(botColor, choice.targets);
      if (after) after();
    });
  }

  // 카드 발동 후 대상 선택이 필요하면 정해 둔 대상(없으면 기본 규칙)으로 처리
  function applyBotTargets(botColor, targets) {
    const t = pendingTarget;
    if (!t || t.forPlayer !== botColor) return;
    if (targets && targets.length) {
      for (const pos of targets) {
        if (!pendingTarget) break;
        handleTargetClick(pos);
      }
      if (pendingTarget) cancelTarget();
    } else {
      resolveBotPendingTarget();
    }
  }

  // 봇의 카드 드래프트: 고난이도는 강한 카드를 우선
  const BOT_CARD_PRIORITY = ['timestop', 'chain', 'windmill', 'wall', 'bomb', 'shield', 'trap', 'sixsense', 'trade', 'steal', 'rewind', 'blockade', 'infection', 'reversal', 'magnet', 'teleport', 'reroll', 'earthquake', 'alkkagi'];
  function botPickDraft(picks, player) {
    if (!botCfg().smartCards) return picks[Math.floor(Math.random() * picks.length)];
    const me = player || other(myColor), opp = other(me);
    let base = 0, oppThreat = false;
    try { const blk = makeBlocked(); base = evalBoard(me, blk); oppThreat = hasOpenFourThreat(opp, blk); } catch (e) {}
    // 짱짱맨: 지금 판에서 그 카드가 실제로 무엇을 할 수 있는지 계산해서 가점
    const sit = {};
    if (botCfg().draft2) {
      try {
        e2Init(makeBlocked());
        const oc = readOppCards(me);
        sit.myTradeWin = e2TradeRisk(opp) > 0;    // 맞교환 한 번으로 내가 이기는 쌍이 있음
        sit.oppTradeWin = e2TradeRisk(me) > 0;    // 상대가 맞교환을 뽑으면 지는 쌍이 있음
        sit.myChainWin = e2ChainRisk(opp) > 0;    // 연속 착수 한 턴으로 내가 끝낼 수 있음
        sit.oppChainWin = e2ChainRisk(me) > 0;
        sit.oppDanger = (oc.trade && sit.oppTradeWin) || (oc.chain && sit.oppChainWin) || oc.reversal;
      } catch (e) {}
    }
    const score = (c) => {
      let v = BOT_CARD_PRIORITY.length - BOT_CARD_PRIORITY.indexOf(c.id);
      v -= 4 * hand[me].filter(h => h.id === c.id).length;      // 같은 카드는 겹쳐 쥐지 않음
      if (base < -1500 && (c.id === 'reversal' || c.id === 'earthquake' || c.id === 'alkkagi')) v += 6; // 불리하면 판을 뒤집는 카드
      if (oppThreat && (c.id === 'bomb' || c.id === 'sixsense' || c.id === 'windmill')) v += 4;       // 상대 공격을 끊는 카드
      if (sit.myTradeWin && c.id === 'trade') v += 10;
      if (sit.myChainWin && c.id === 'chain') v += 8;
      if (sit.oppDanger && c.id === 'blockade') v += 9;                                              // 상대가 쥔 결정타를 무효화
      if ((sit.oppTradeWin || sit.oppChainWin) && (c.id === 'bomb' || c.id === 'windmill')) v += 3;  // 약한 모양을 미리 끊을 수단
      return v;
    };
    return picks.slice().sort((a, b) => score(b) - score(a))[0];
  }

  // ---- 봇의 알까기 발사 판단 ----
  function checkBotAlkTurn() {
    if (mode !== 'bot' || !alk || !alk.awaitingLaunch || alk.simulating) return;
    const botColor = other(myColor);
    const flicker = alk.turnOrder[alk.turnIndex];
    if (flicker !== botColor) return;
    setTimeout(botDoAlkFlick, 700);
  }

  function botDoAlkFlick() {
    if (mode !== 'bot' || !alk || !alk.awaitingLaunch || alk.simulating) return;
    const botColor = other(myColor);
    if (alk.turnOrder[alk.turnIndex] !== botColor) return;
    const ns = alk.physStones[alk.newIndex];
    const oppColor = other(botColor);

    if (botCfg().cardPlan4) {
      // 짱짱맨: 방향·세기 후보를 같은 물리 계산으로 끝까지 굴려 보고, 칸에 고정된 결과 판을 평가해서 가장 좋은 발사
      const best = botBestAlkFlick(botColor, ns);
      if (best) {
        ns.vx = best.vx; ns.vy = best.vy;
        alk.awaitingLaunch = false; alk.simulating = true; alk.frameCount = 0;
        updateStatus();
        requestAnimationFrame(simulateAlkTick);
        return;
      }
    }
    // 상대 돌들의 무게중심을 대충 겨냥 (없으면 보드 중앙), 약간의 무작위 편차 추가
    let sx = 0, sy = 0, n = 0;
    alk.physStones.forEach(s => {
      if (s !== ns && s.color === oppColor) { sx += s.x; sy += s.y; n++; }
    });
    let targetX = n > 0 ? sx / n : GRID_OFFSET_X + GRID_SPAN / 2;
    let targetY = n > 0 ? sy / n : PAD + GRID_SPAN / 2;
    targetX += (Math.random() - 0.5) * CELL * 4;
    targetY += (Math.random() - 0.5) * CELL * 4;

    let dx = targetX - ns.x, dy = targetY - ns.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = CELL * (0.6 + Math.random() * 0.8);
    ns.vx = (dx / dist) * speed;
    ns.vy = (dy / dist) * speed;

    alk.awaitingLaunch = false;
    alk.simulating = true;
    alk.frameCount = 0;
    updateStatus();
    requestAnimationFrame(simulateAlkTick);
  }

  function botBestAlkFlick(botColor, ns) {
    const opp = other(botColor), idx = alk.physStones.indexOf(ns);
    const saved = { board, windmillList };
    let best = null;
    const t0 = Date.now();
    for (let a = 0; a < 36; a++) {
      const ang = -Math.PI * (0.06 + 0.88 * a / 35); // 위쪽 반원
      for (const sp of [0.5, 0.75, 1.0, 1.3]) {
        if (Date.now() - t0 > 1500) break;
        const stones = alk.physStones.map(s => Object.assign({}, s));
        stones[idx].vx = Math.cos(ang) * CELL * sp; stones[idx].vy = Math.sin(ang) * CELL * sp;
        for (let f = 0; f <= ALK_MAX_FRAMES; f++) { alkPhysStep(stones); if (alkMaxSpeed(stones) < ALK_MIN_SPEED) break; }
        const assign = snapPhysStonesToGrid(stones);
        board = saved.board.map(row => row.map(v => v === WALL ? WALL : EMPTY)); windmillList = [];
        stones.forEach((s, i) => { const p = assign[i]; if (!p) return; board[p.r][p.c] = s.color; if (s.isWindmill) windmillList.push({ r: p.r, c: p.c }); });
        const f = scanFiveWinner();
        const v = f === botColor ? WIN_SCORE : f === opp ? -WIN_SCORE : evalBoard(botColor, makeBlocked());
        if (!best || v > best.v) best = { v, vx: Math.cos(ang) * CELL * sp, vy: Math.sin(ang) * CELL * sp };
      }
    }
    board = saved.board; windmillList = saved.windmillList;
    return best;
  }

  // ================= 메뉴 / 로비 UI =================
  let menuNoteMsg = null, lobbyMsg = null;
  function setMenuNote(msg) { menuNoteMsg = msg; menuNote.textContent = msg ? fmt(msg) : ''; }
  function setLobbyStatus(msg) { lobbyMsg = msg; lobbyStatus.textContent = msg ? fmt(msg) : ''; }
  const roomCodeBox = document.getElementById('room-code-box'), roomCodeValue = document.getElementById('room-code-value');
  function showRoomCode(code) { roomCodeValue.textContent = code || ''; roomCodeBox.hidden = !code; }
  // 방 코드 입력: 무조건 대문자, 영문·숫자만
  joinCodeInput.addEventListener('input', () => {
    const v = joinCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    if (v !== joinCodeInput.value) joinCodeInput.value = v;
  });

  // ---- 언어 전환 ----
  function applyStaticI18n() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  }
  function rerenderAll() {
    if (tut && tut.k && !tutBox.hidden) tutShow(tut.k, tut.b);
    applyStaticI18n();
    renderBotLevel();
    if (menuNoteMsg) setMenuNote(menuNoteMsg);
    if (lobbyMsg) setLobbyStatus(lobbyMsg);
    if (board) {
      updateStatus();
      if (pendingTarget && targetPrompt) enterTargetMode(targetPrompt);
      updateHandUI(); updateLog(); draw();
    }
    if (confirmBar.classList.contains('show') && confirmMsg) confirmText.textContent = fmt(confirmMsg);
    if (banner.classList.contains('show') && lastBannerMsg) renderBannerOnly(lastBannerMsg);
    if (draftOverlay.classList.contains('show') && lastDraft) renderDraftCards(lastDraft.player, lastDraft.picks);
    if (!chatPanel.hidden) renderChat(lastChatMessages);
  }
  // ---- 설정: 움직임 줄이기 ----
  const settingsBtn = document.getElementById('settings-btn');
  const settingsPanel = document.getElementById('settings-panel');
  const reduceMotionInput = document.getElementById('reduce-motion');
  reduceMotionInput.checked = reduceMotion;
  function setSettingsOpen(open) {
    settingsPanel.hidden = !open;
    settingsBtn.setAttribute('aria-expanded', String(open));
  }
  settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); setSettingsOpen(settingsPanel.hidden); });
  settingsPanel.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => { if (!settingsPanel.hidden) setSettingsOpen(false); });
  reduceMotionInput.addEventListener('change', () => {
    reduceMotion = reduceMotionInput.checked;
    try { localStorage.setItem('omok_reduce_motion', reduceMotion ? '1' : '0'); } catch (e) {}
  });

  document.getElementById('lang-toggle').addEventListener('click', () => {
    lang = lang === 'ko' ? 'en' : 'ko';
    try { localStorage.setItem('omok_lang', lang); } catch (e) {}
    rerenderAll();
  });
  modeLocalBtn.addEventListener('click', () => { endTutorial(); mode = 'local'; myColor = BLACK; awaitingSide = false; init(); showScreen('game'); });
  tutBtn.addEventListener('click', () => { endTutorial(); startBotGameWithSidePick(); });
  document.getElementById('mode-tut-btn').addEventListener('click', startTutorial);
  function startBotGameWithSidePick() {
    mode = 'bot'; myColor = BLACK; awaitingSide = true;
    init(); showScreen('game');
  }
  modeBotBtn.addEventListener('click', startBotGameWithSidePick);
  document.getElementById('side-options').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-side]');
    if (!b || !awaitingSide) return;
    const side = b.dataset.side === 'random' ? (Math.random() < 0.5 ? 'first' : 'second') : b.dataset.side;
    myColor = side === 'first' ? BLACK : WHITE;
    awaitingSide = false;
    init();
    addLog(L('bot.log', { n: botLevelName(botLevel) }));
    addLog(L(myColor === BLACK ? 'log.sideFirst' : 'log.sideSecond'));
  });

  const botLevelOptions = document.getElementById('bot-level-options');
  const botLevelHint = document.getElementById('bot-level-hint');
  const botModeDesc = document.getElementById('bot-mode-desc');
  function renderBotLevel() {
    botLevelOptions.innerHTML = '';
    for (const lv of BOT_LEVEL_LIST) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(lv === botLevel));
      b.textContent = botLevelName(lv);
      if (lv === 20 || lv === 50) b.classList.add('ultimate');
      if (lv === 50) b.classList.add('super');
      b.addEventListener('click', () => {
        botLevel = lv;
        try { localStorage.setItem('omok_bot_level', String(lv)); } catch (e) {}
        renderBotLevel();
      });
      botLevelOptions.appendChild(b);
    }
    botLevelHint.textContent = t('bot.hint.' + botLevel);
    botModeDesc.textContent = t('mode.bot.desc', { n: botLevelName(botLevel) });
  }
  renderBotLevel();
  modeMpBtn.addEventListener('click', () => {
    setLobbyStatus(null);
    showRoomCode(null);
    joinCodeInput.value = '';
    showScreen('lobby');
  });
  lobbyBackBtn.addEventListener('click', () => {
    showRoomCode(null);
    if (unsubPublic) { unsubPublic(); unsubPublic = null; }
    unsubscribeChat();
    showScreen('menu');
  });
  gameBackBtn.addEventListener('click', () => {
    endTutorial();
    engineToken++; engineBusy = false;
    awaitingSide = false;
    sideOverlay.classList.remove('show');
    if (mode === 'multiplayer' && roomCode && dbApi && !gameOver) {
      gameOver = true;
      showBanner(L('banner.left', { color: myColor }));
    }
    if (unsubPublic) { unsubPublic(); unsubPublic = null; }
    unsubscribeChat();
    mode = 'local';
    showScreen('menu');
  });
  createRoomBtn.addEventListener('click', createRoom);
  joinRoomBtn.addEventListener('click', () => joinRoom(joinCodeInput.value));

  canvas.addEventListener('click', function (e) {
    if (!alk) handleCanvasClick(e);
  });

  canvas.addEventListener('mousedown', function (e) { if (alk) tryStartDrag(rawPosFromEvent(e)); });
  canvas.addEventListener('mousemove', function (e) { if (alk && alk.dragging) updateDrag(rawPosFromEvent(e)); });
  window.addEventListener('mouseup', function (e) { if (alk && alk.dragging) releaseDrag(rawPosFromEvent(e)); });

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (alk) tryStartDrag(rawPosFromEvent(e));
    else handleCanvasClick(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (alk && alk.dragging) updateDrag(rawPosFromEvent(e));
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (alk && alk.dragging) releaseDrag(rawPosFromEvent(e));
  }, { passive: false });

  undoBtn.addEventListener('click', () => { if (mode !== 'multiplayer' && !cardAnimBusy) undo(); });
  resetBtn.addEventListener('click', () => {
    if (mode === 'multiplayer') {
      if (gameOver) startRematch(Math.random() < 0.5 ? BLACK : WHITE, true); // 무승부 등 진 쪽이 없으면 선후공 랜덤
    } else if (mode === 'bot') {
      startBotGameWithSidePick();
    } else {
      init();
    }
  });
  cancelBtn.addEventListener('click', cancelTarget);
  rematchOptions.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-rematch]');
    if (!b || !loserPicksSide() || bannerWinner(lastBannerMsg) === myColor) return;
    const viaRandom = b.dataset.rematch === 'random';
    const newColor = viaRandom ? (Math.random() < 0.5 ? BLACK : WHITE) : b.dataset.rematch === 'first' ? BLACK : WHITE;
    if (mode === 'multiplayer') {
      startRematch(newColor, viaRandom);
    } else if (mode === 'bot') {
      myColor = newColor;
      init();
      addLog(L(viaRandom ? 'notice.rematchRandom' : newColor === BLACK ? 'notice.rematchFirst' : 'notice.rematchSecond'));
      addLog(L('bot.log', { n: botLevelName(botLevel) }));
      addLog(L(newColor === BLACK ? 'log.sideFirst' : 'log.sideSecond'));
    }
  });

  confirmYesBtn.addEventListener('click', () => {
    if (pendingPlacement) {
      const pos = pendingPlacement;
      pendingPlacement = null;
      hideConfirmBar();
      handlePlace(pos);
      if (mode === 'multiplayer') { syncPublicState(); savePrivateState(); }
    } else if (pendingCardUse) {
      const { player, idx } = pendingCardUse;
      pendingCardUse = null;
      hideConfirmBar();
      activateCard(player, idx);
    } else if (pendingTargetCell) {
      const pos = pendingTargetCell;
      pendingTargetCell = null;
      hideConfirmBar();
      handleTargetClick(pos);
      if (mode === 'multiplayer') { syncPublicState(); savePrivateState(); }
    }
  });

  confirmNoBtn.addEventListener('click', () => {
    clearAllPending();
    draw();
  });

  showScreen('menu');
  if (lang !== 'ko') rerenderAll(); // 저장된 언어가 영어면 처음부터 영어로 표시
})();
</script>
