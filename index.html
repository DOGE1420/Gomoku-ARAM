<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>증강 오목</title>
<style>
  :root {
    --wood-light: #d9b98a;
    --wood-dark: #b8925c;
    --line: #5c3a21;
    --ink: #2b2118;
    --paper: #f2e9d8;
    --accent: #a13c3c;
    --gold: #c9a227;
    --purple: #6b4fa0;
    --teal: #2f8f7a;
    --stone-black-1: #4a4a4a;
    --stone-black-2: #0a0a0a;
    --stone-white-1: #ffffff;
    --stone-white-2: #d8d2c4;
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #1c1712; --ink: #ece3d4; }
  }
  :root[data-theme="dark"] { --paper: #1c1712; --ink: #ece3d4; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: var(--font-main);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    gap: 12px;
  }
  h1 { font-size: clamp(26px, 5.5vw, 32px); font-weight: 700; letter-spacing: 0.01em; margin: 2px 0 0 0; }
  .sub { font-family: var(--font-main); font-size: 14px; opacity: 0.65; margin: 0; text-align: center; max-width: 460px; line-height: 1.5; }
  .status-row { display: flex; align-items: center; gap: 10px; font-family: var(--font-main); font-size: 17px; min-height: 22px; flex-wrap: wrap; justify-content: center; }
  .turn-dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(255,255,255,0.15); }
  .turn-dot.black { background: radial-gradient(circle at 35% 30%, var(--stone-black-1), var(--stone-black-2)); }
  .turn-dot.white { background: radial-gradient(circle at 35% 30%, var(--stone-white-1), var(--stone-white-2)); border: 1px solid rgba(0,0,0,0.2); }
  #status-text.targeting { color: var(--purple); font-weight: 600; }
  #status-text.alkkagi { color: var(--teal); font-weight: 600; }
  #win-length-badge { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--teal); color: var(--teal); display: none; }
  #win-length-badge.show { display: inline-block; }
  .cancel-btn { display: none; border: 1px solid var(--purple); color: var(--purple); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 13.5px; font-family: var(--font-main); cursor: pointer; }
  .cancel-btn.show { display: inline-block; }
  .progress-wrap { display: flex; align-items: center; gap: 6px; font-family: var(--font-main); font-size: 13.5px; opacity: 0.7; }
  .pip-row { display: flex; gap: 3px; }
  .pip { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.25; }
  .pip.filled { opacity: 0.9; background: var(--gold); }
  .confirm-bar {
    display: none;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(169, 128, 68, 0.18);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: var(--font-main);
    font-size: 14.5px;
  }
  .confirm-bar.show { display: flex; }
  .confirm-bar button { padding: 5px 14px; font-size: 13.5px; white-space: nowrap; flex-shrink: 0; }
  .confirm-bar .confirm-yes { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .confirm-bar .confirm-no { opacity: 0.7; }
  .board-wrap { position: relative; max-width: 100%; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); overflow: hidden; }
  @keyframes board-shake {
    0% { transform: translate(0,0) rotate(0deg); }
    10% { transform: translate(-7px, 5px) rotate(-1.1deg); }
    20% { transform: translate(6px, -6px) rotate(1deg); }
    30% { transform: translate(-6px, 7px) rotate(-1deg); }
    40% { transform: translate(7px, -4px) rotate(1.1deg); }
    50% { transform: translate(-6px, 5px) rotate(-0.7deg); }
    60% { transform: translate(5px, -5px) rotate(0.7deg); }
    70% { transform: translate(-4px, 4px) rotate(-0.5deg); }
    80% { transform: translate(3px, -3px) rotate(0.4deg); }
    90% { transform: translate(-2px, 2px) rotate(-0.2deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  .board-wrap.shake { animation: board-shake 0.55s ease-in-out; }
  canvas { display: block; touch-action: none; max-width: 100%; height: auto; cursor: pointer; }
  .controls { display: flex; gap: 10px; font-family: var(--font-main); flex-wrap: wrap; justify-content: center; }
  button.plain { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 9px 18px; border-radius: 999px; font-size: 15.5px; font-family: inherit; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
  button.plain:hover { background: var(--line); color: var(--paper); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,14,8,0.6); color: #f6ecd9; font-size: clamp(20px, 5.5vw, 28px); font-weight: 700; text-align: center; padding: 20px; }
  #banner.show { display: flex; }
  #draft-overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(15,10,20,0.85); backdrop-filter: blur(2px); padding: 16px; }
  #draft-overlay.show { display: flex; }
  .draft-title { color: #f2e9d8; font-family: var(--font-main); font-weight: 700; font-size: clamp(18px, 4.5vw, 22px); text-align: center; }
  .draft-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  .aug-card { width: 130px; background: linear-gradient(160deg, #2a2333, #1a1520); border: 1px solid rgba(201,162,39,0.5); border-radius: 10px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; font-family: var(--font-main); }
  .aug-card:hover { transform: translateY(-4px); border-color: var(--gold); }
  .aug-icon { font-size: 30px; }
  .aug-name { color: #f2e9d8; font-size: 15.5px; font-weight: 700; }
  .aug-desc { color: #cfc5b8; font-size: 12.5px; line-height: 1.4; text-align: center; }
  .hands { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; font-family: var(--font-main); }
  .hand-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; padding: 10px; border-radius: 12px; }
  .hand-row.active-turn { background: rgba(169, 128, 68, 0.15); }
  .hand-label { font-size: 13.5px; font-weight: 700; opacity: 0.75; min-width: 34px; padding-top: 30px; }
  .hand-cards-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .hand-card {
    width: 100%;
    min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    border: 1px solid rgba(201,162,39,0.5);
    border-radius: 10px;
    padding: 10px 4px;
    background: linear-gradient(160deg, #2a2333, #1a1520);
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }
  .hand-card:hover:not(.disabled) { transform: translateY(-4px); border-color: var(--gold); }
  .hand-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .hand-card .hc-icon { font-size: 26px; }
  .hand-card .hc-name { color: #f2e9d8; font-size: 13.5px; font-weight: 700; text-align: center; overflow-wrap: break-word; }
  .hand-card .hc-desc { color: #cfc5b8; font-size: 11px; line-height: 1.35; text-align: center; overflow-wrap: break-word; }
  .hand-card.disabled { opacity: 0.4; cursor: not-allowed; }
  .hand-card.disabled:hover { transform: none; border-color: rgba(201,162,39,0.5); }
  .hand-empty { font-size: 13.5px; opacity: 0.45; font-style: italic; padding-top: 30px; }
  /* 게임 화면 레이아웃: 좁은 화면에서는 보드 → 카드 → 기록 순으로 세로 배치 */
  .game-layout { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .game-main { width: 100%; max-width: 576px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .side-panel { width: 100%; max-width: 576px; }
  .side-title { font-family: var(--font-main); font-size: 14px; font-weight: 700; opacity: 0.75; margin: 0 0 8px 2px; }
  .log-side { border: 1px solid rgba(169, 128, 68, 0.35); border-radius: 12px; padding: 10px 12px; }
  .log-list { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow-y: auto; font-family: var(--font-main); font-size: 13px; line-height: 1.45; }
  .log-list li { padding: 5px 0; border-bottom: 1px solid rgba(169, 128, 68, 0.2); overflow-wrap: break-word; }
  .log-list li:last-child { border-bottom: none; }
  .log-list li:first-child { font-weight: 700; }
  .log-list li:not(:first-child) { opacity: 0.7; }
  .log-empty { opacity: 0.45; font-style: italic; }
  .side-right { display: flex; flex-direction: column; gap: 12px; }
  .chat-side { border: 1px solid rgba(169, 128, 68, 0.35); border-radius: 12px; padding: 10px 12px; font-family: var(--font-main); }
  .chat-side[hidden] { display: none; }
  .chat-list { list-style: none; margin: 0 0 8px 0; padding: 0; height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.4; }
  .chat-msg { align-self: flex-start; max-width: 85%; padding: 6px 10px; border-radius: 12px; background: rgba(169, 128, 68, 0.15); overflow-wrap: anywhere; }
  .chat-msg.mine { align-self: flex-end; background: rgba(201, 162, 39, 0.3); }
  .chat-who { font-size: 11.5px; font-weight: 700; opacity: 0.7; margin-bottom: 2px; }
  .chat-empty { opacity: 0.45; font-style: italic; align-self: center; margin: auto 0; }
  .chat-form { display: flex; gap: 6px; }
  .chat-input { flex: 1; min-width: 0; font-family: inherit; font-size: 16px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .chat-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chat-send { padding: 7px 14px; font-size: 14px; }

  /* 넓은 화면: 왼쪽 카드 · 가운데 보드 · 오른쪽 기록 */
  @media (min-width: 1080px) {
    #game-screen { max-width: 1180px; }
    .game-layout { display: grid; grid-template-columns: 240px minmax(0, 576px) 240px; justify-content: center; align-items: start; gap: 20px; }
    .side-left { grid-column: 1; grid-row: 1; }
    .game-main { grid-column: 2; grid-row: 1; }
    .side-right { grid-column: 3; grid-row: 1; }
    .side-panel { position: sticky; top: 16px; }
    .side-left .hands { max-width: none; }
    .side-left .hand-row { flex-direction: column; align-items: stretch; gap: 6px; }
    .side-left .hand-label { padding-top: 0; }
    .side-left .hand-cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .side-left .hand-empty { padding-top: 0; }
    .log-list { max-height: 560px; }
    .side-right:has(.chat-side:not([hidden])) .log-list { max-height: 240px; }
  }

  @media (max-width: 430px) {
    body { padding: 14px 10px calc(14px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
    .hand-row { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 6px; }
    .hand-label { padding-top: 0; min-width: 0; }
    .hand-cards-grid { gap: 6px; }
    .hand-card { padding: 7px 3px; gap: 3px; }
    .hand-card .hc-icon { font-size: 21px; }
    .hand-card .hc-name { font-size: 11.5px; }
    .hand-card .hc-desc { display: none; }
    #draft-overlay { padding: 10px 8px; gap: 8px; justify-content: safe center; overflow-y: auto; }
    .draft-cards { flex-wrap: nowrap; gap: 6px; width: 100%; }
    .aug-card { width: auto; flex: 1 1 0; min-width: 0; padding: 8px 5px; gap: 5px; }
    .aug-icon { font-size: 24px; }
    .aug-name { font-size: 13.5px; }
    .aug-desc { font-size: 11px; line-height: 1.35; }
    .code-input { font-size: 17px; letter-spacing: 2px; }
    .mode-btn { padding: 14px; }
    .confirm-bar { gap: 8px; padding: 5px 8px 5px 14px; font-size: 13.5px; max-width: 100%; }
    .confirm-bar button { padding: 5px 11px; }
    #confirm-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  }

  .menu-screen, .lobby-screen, .game-screen { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .mode-btn {
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 18px; border-radius: 14px; border: 1px solid var(--line);
    background: linear-gradient(160deg, var(--wood-light), var(--wood-dark));
    cursor: pointer; font-family: var(--font-main); color: var(--ink);
    transition: transform 0.15s ease;
  }
  .mode-btn:hover { transform: translateY(-3px); }
  .mode-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .mode-icon { font-size: 32px; }
  .mode-name { font-size: 18.5px; font-weight: 700; }
  .mode-desc { font-family: var(--font-main); font-size: 13.5px; opacity: 0.7; }
  .bot-level { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: -4px; font-family: var(--font-main); }
  .bot-level-label { font-size: 13px; opacity: 0.7; }
  .bot-level-options { display: flex; gap: 6px; }
  .bot-level-options button { appearance: none; min-width: 48px; padding: 7px 0; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: inherit; font-size: 15px; cursor: pointer; }
  .bot-level-options button[aria-checked="true"] { background: var(--line); color: var(--paper); font-weight: 700; }
  .bot-level-hint { font-size: 12.5px; opacity: 0.65; text-align: center; min-height: 16px; }
  .menu-note { font-family: var(--font-main); font-size: 13.5px; opacity: 0.6; text-align: center; min-height: 16px; }

  .lobby-body { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .lobby-or { font-family: var(--font-main); font-size: 13.5px; opacity: 0.6; }
  .code-input {
    width: 100%; text-align: center; letter-spacing: 4px; text-transform: uppercase;
    padding: 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 19px;
    font-family: var(--font-main); background: var(--paper); color: var(--ink);
  }
  .lobby-status { font-family: var(--font-main); font-size: 14.5px; text-align: center; min-height: 20px; opacity: 0.85; }
  #game-back-btn, #lobby-back-btn { align-self: flex-start; font-size: 13.5px; padding: 5px 12px; }
</style>
</head>
<body>
  <h1>증강 오목</h1>
  <p class="sub" id="sub-text">3수마다 패에 카드가 쌓입니다. 내 턴에 패의 카드를 눌러 능력을 발동하세요 — 수를 두는 것과는 별개의 행동이며, 턴당 1회만 사용할 수 있습니다.</p>

  <div id="menu-screen" class="menu-screen">
    <button class="mode-btn" id="mode-local-btn">
      <div class="mode-icon">👥</div>
      <div class="mode-name">로컬 모드</div>
      <div class="mode-desc">한 기기에서 흑백 번갈아 대전</div>
    </button>
    <button class="mode-btn" id="mode-bot-btn">
      <div class="mode-icon">🤖</div>
      <div class="mode-name">봇전</div>
      <div class="mode-desc" id="bot-mode-desc">AI를 상대로 대전 (난이도 5)</div>
    </button>
    <div class="bot-level" role="radiogroup" aria-label="봇 난이도">
      <span class="bot-level-label">봇 난이도</span>
      <div class="bot-level-options" id="bot-level-options"></div>
      <div class="bot-level-hint" id="bot-level-hint"></div>
    </div>
    <button class="mode-btn" id="mode-mp-btn">
      <div class="mode-icon">🌐</div>
      <div class="mode-name">멀티플레이</div>
      <div class="mode-desc">온라인으로 대전, 서로의 패는 비공개</div>
    </button>
    <p class="menu-note" id="menu-note"></p>
  </div>

  <div id="lobby-screen" class="lobby-screen" style="display:none;">
    <button class="plain" id="lobby-back-btn">← 메뉴로</button>
    <div class="lobby-body" id="lobby-body">
      <button class="plain" id="create-room-btn">새 방 만들기</button>
      <div class="lobby-or">또는</div>
      <input class="code-input" id="join-code-input" placeholder="방 코드 입력" maxlength="5">
      <button class="plain" id="join-room-btn">코드로 참가하기</button>
    </div>
    <div class="lobby-status" id="lobby-status"></div>
  </div>

  <div id="game-screen" class="game-screen" style="display:none;">
    <button class="plain" id="game-back-btn">← 메뉴로</button>
    <div class="game-layout">
    <div class="game-main">
    <div class="status-row">
      <span class="turn-dot black" id="turn-dot"></span>
      <span id="status-text">흑 차례</span>
      <span id="win-length-badge">6목 규칙</span>
      <button class="cancel-btn" id="cancel-btn">취소</button>
    </div>
    <div class="progress-wrap">
      <span>다음 카드까지</span>
      <span class="pip-row" id="pip-row"></span>
    </div>

    <div class="confirm-bar" id="confirm-bar">
      <span id="confirm-text"></span>
      <button class="plain confirm-yes" id="confirm-yes-btn">확인</button>
      <button class="plain confirm-no" id="confirm-no-btn">취소</button>
    </div>

    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="banner"></div>
      <div id="draft-overlay">
        <div class="draft-title" id="draft-title">카드 획득</div>
        <div class="draft-cards" id="draft-cards"></div>
      </div>
    </div>

    <div class="controls">
      <button class="plain" id="undo-btn">한 수 무르기</button>
      <button class="plain" id="reset-btn">새 게임</button>
    </div>
    </div>

    <aside class="side-panel side-left">
    <div class="hands">
      <div class="hand-row" id="hand-row-1">
        <span class="hand-label">흑 패</span>
        <div class="hand-cards-grid" id="hand-cards-1"></div>
      </div>
      <div class="hand-row" id="hand-row-2">
        <span class="hand-label">백 패</span>
        <div class="hand-cards-grid" id="hand-cards-2"></div>
      </div>
    </div>
    </aside>

    <aside class="side-panel side-right">
      <section class="log-side">
        <div class="side-title">기록</div>
        <ol class="log-list" id="log-panel"></ol>
      </section>
      <section class="chat-side" id="chat-panel" hidden>
        <div class="side-title">채팅</div>
        <ol class="chat-list" id="chat-list"></ol>
        <form class="chat-form" id="chat-form" autocomplete="off">
          <input class="chat-input" id="chat-input" maxlength="200" placeholder="메시지 입력" aria-label="채팅 메시지">
          <button class="plain chat-send" type="submit">전송</button>
        </form>
      </section>
    </aside>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue, push, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB-eP5kD_xudBE6-MXt1KLkKxZEKmD6-Sg",
    authDomain: "gomoku-3f050.firebaseapp.com",
    databaseURL: "https://gomoku-3f050-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "gomoku-3f050",
    storageBucket: "gomoku-3f050.firebasestorage.app",
    messagingSenderId: "591915118208",
    appId: "1:591915118208:web:d53298e42473674dc30065",
  };

  try {
    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    window.__fb = {
      ready: true,
      setPath: (path, data) => set(ref(rtdb, path), data),
      getPath: async (path) => {
        const snap = await get(ref(rtdb, path));
        const ex = snap.exists();
        return { exists: ex, data: () => (ex ? snap.val() : undefined) };
      },
      updatePath: (path, data) => update(ref(rtdb, path), data),
      onPath: (path, cb, errCb) => onValue(ref(rtdb, path), (snap) => {
        const ex = snap.exists();
        cb({ exists: ex, data: () => (ex ? snap.val() : undefined) });
      }, errCb),
      pushPath: (path, data) => push(ref(rtdb, path), data),

  let pendingTargetCell = null; // { r, c } — 확인 대기 중인 카드 대상 선택
  let trapList; // { r, c, owner }[]
  let cardLockNextTurn; // { [BLACK]: bool, [WHITE]: bool } — 다음 턴 카드 사용 봉쇄
  let skipNextTurn; // { [BLACK]: bool, [WHITE]: bool } — 폭파/전세역전 대가로 다음 내 턴을 건너뜀
  let startupQueue; // 게임 시작 시 초기 카드 뽑기 순서 (흑→백)

  // ---- 모드 / 멀티플레이 상태 ----
  let mode = 'local'; // 'local' | 'bot' | 'multiplayer'
  let myColor = BLACK; // bot·멀티플레이에서 내가 조작하는 색
  let dbApi = null, myUserId = null;
  let roomCode = null;
  let unsubPublic = null;
  let mpPlayers = { [BLACK]: null, [WHITE]: null };
  let mpNotice = null, mpNoticeSeq = 0, lastSeenNoticeSeq = 0, mpBannerText = null;
  let mpShakeSeq = 0, lastSeenShakeSeq = 0;
  let mpRestartSeq = 0, lastSeenRestartSeq = 0;

  function getCardPool() {
    return CARD_POOL; // 모든 모드에서 알까기 포함
  }

  function waitForFb(timeoutMs) {
    return new Promise((resolve) => {
      if (window.__fb) { resolve(window.__fb); return; }
      const onReady = () => { window.removeEventListener('fb-ready', onReady); resolve(window.__fb); };
      window.addEventListener('fb-ready', onReady);
      setTimeout(() => resolve(window.__fb || { ready: false }), timeoutMs || 6000);
    });
  }

  function getOrCreateClientId() {
    let id = null;
    try { id = localStorage.getItem('omok_client_id'); } catch (e) {}
    if (!id) {
      id = 'p_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem('omok_client_id', id); } catch (e) {}
    }
    return id;
  }

  async function initCapabilities() {
    const fb = await waitForFb();
    dbApi = fb && fb.ready ? fb : null;
    myUserId = dbApi ? getOrCreateClientId() : null;
    if (!dbApi) {
      modeMpBtn.disabled = true;
      menuNote.textContent = '멀티플레이 서버 연결에 실패했습니다. 잠시 후 다시 열어주세요.';
    }
  }
  initCapabilities();

  let currentScreen = 'menu';
  function showScreen(name) {
    currentScreen = name;
    menuScreen.style.display = name === 'menu' ? 'flex' : 'none';
    lobbyScreen.style.display = name === 'lobby' ? 'flex' : 'none';
    gameScreen.style.display = name === 'game' ? 'flex' : 'none';
    subText.style.display = name === 'game' ? 'block' : 'none';
  }

  function other(p) { return p === BLACK ? WHITE : BLACK; }
  function isStone(v) { return v === BLACK || v === WHITE; }

  function init() {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
    current = BLACK;
    moveHistory = [];
    gameOver = false;
    winLine = null;
    winLength = 5;
    lastMovePos = null;
    windmillList = [];
    placedCount = { [BLACK]: 0, [WHITE]: 0 };
    hand = { [BLACK]: [], [WHITE]: [] };
    usedCardThisTurn = { [BLACK]: false, [WHITE]: false };
    turnPlacementsDone = 0;
    turnPlacementsNeeded = 1;
    turnPlacedPositions = [];
    pendingTarget = null;
    draftOpen = false;
    draftPlayer = null;
    logLines = [];
    alk = null;
    alkHandoff = null;
    pendingPlacement = null;
    pendingCardUse = null;
    pendingTargetCell = null;
    trapList = [];
    cardLockNextTurn = { [BLACK]: false, [WHITE]: false };
    skipNextTurn = { [BLACK]: false, [WHITE]: false };
    mpNotice = null; mpNoticeSeq = 0; lastSeenNoticeSeq = 0; mpBannerText = null;
    mpShakeSeq = 0; lastSeenShakeSeq = 0;
    mpRestartSeq = 0; lastSeenRestartSeq = 0;
    banner.classList.remove('show');
    draftOverlay.classList.remove('show');
    winLenBadge.classList.remove('show');
    updateLog();
    draw();
    startupQueue = mode === 'multiplayer' ? [myColor] : [BLACK, WHITE];
    runStartupDraft();
  }

  function updateStatus() {
    if (mode === 'bot') scheduleMaybeBotTurn();
    undoBtn.style.display = mode === 'multiplayer' ? 'none' : 'inline-block';
    resetBtn.style.display = (mode === 'multiplayer' && !gameOver) ? 'none' : 'inline-block';
    if (gameOver) return;
    if (alk) { updateAlkStatus(); return; }
    if (alkHandoff) {
      const flicker = alkHandoff.turnOrder[alkHandoff.turnIndex];
      turnDot.className = 'turn-dot ' + (flicker === BLACK ? 'black' : 'white');
      statusText.classList.remove('targeting');
      statusText.classList.add('alkkagi');
      statusText.textContent = (flicker === BLACK ? '흑' : '백') + '이(가) 알까기 중입니다...';
      cancelBtn.classList.remove('show');
      return;
    }
    statusText.classList.remove('targeting', 'alkkagi');
    turnDot.className = 'turn-dot ' + (current === BLACK ? 'black' : 'white');
    statusText.textContent = (current === BLACK ? '흑' : '백') + ' 차례';
    cancelBtn.classList.remove('show');
    winLenBadge.textContent = winLength + '목 규칙';
    winLenBadge.classList.toggle('show', winLength !== 5);
  }

  function updateAlkStatus() {
    const flicker = alk.turnOrder[alk.turnIndex];
    turnDot.className = 'turn-dot ' + (flicker === BLACK ? 'black' : 'white');
    statusText.classList.remove('targeting');
    statusText.classList.add('alkkagi');
    statusText.textContent = alk.simulating
      ? '알까기 진행 중...'
      : (flicker === BLACK ? '흑' : '백') + ' 알까기 · 아래 돌을 당겨 발사';
    cancelBtn.classList.remove('show');
  }

  function updatePips() {
    if (gameOver || alk || alkHandoff) return;
    const filled = placedCount[current] % INTERVAL;
    pipRow.innerHTML = '';
    for (let i = 0; i < INTERVAL; i++) {
      const span = document.createElement('span');
      span.className = 'pip' + (i < filled ? ' filled' : '');
      pipRow.appendChild(span);
    }
  }

  function addLog(text) {
    logLines.unshift(text);
    logLines = logLines.slice(0, 100);
    updateLog();
  }
  function updateLog() {
    logPanel.innerHTML = '';
    if (logLines.length === 0) {
      const li = document.createElement('li');
      li.className = 'log-empty';
      li.textContent = '아직 기록이 없습니다';
      logPanel.appendChild(li);
      return;
    }
    for (const line of logLines) {
      const li = document.createElement('li');
      li.textContent = line;
      logPanel.appendChild(li);
    }
  }

  function updateHandUI() {
    handRow1.classList.toggle('active-turn', current === BLACK && !gameOver && !alk);
    handRow2.classList.toggle('active-turn', current === WHITE && !gameOver && !alk);
    renderHand(BLACK, handCards1);
    renderHand(WHITE, handCards2);
  }

  function renderHand(player, container) {
    container.innerHTML = '';
    const hideContents = mode === 'multiplayer' && player !== myColor;
    if (hand[player].length === 0) {
      const span = document.createElement('span');
      span.className = 'hand-empty';
      span.textContent = '없음';
      container.appendChild(span);
      return;
    }
    hand[player].forEach((card, idx) => {
      const btn = document.createElement('button');
      if (hideContents) {
        btn.className = 'hand-card disabled';
        btn.innerHTML = `<div class="hc-icon">🂠</div><div class="hc-name">비공개</div>`;
        container.appendChild(btn);
        return;
      }
      const canUse = player === current && !gameOver && !draftOpen && !pendingTarget && !usedCardThisTurn[player] && !alkPhaseActive() && (mode === 'local' || player === myColor);
      btn.className = 'hand-card' + (canUse ? '' : ' disabled');
      btn.title = card.desc;
      btn.innerHTML = `<div class="hc-icon">${card.icon}</div><div class="hc-name">${card.name}</div><div class="hc-desc">${CARD_SHORT_DESC[card.id] || card.desc}</div>`;
      if (canUse) btn.addEventListener('click', () => {
        pendingPlacement = null;
        pendingTargetCell = null;
        pendingCardUse = { player, idx };
        showConfirmBar(`${card.name} 사용할까요?`);
      });
      container.appendChild(btn);
    });
  }

  function cellCenter(r, c) { return { x: GRID_OFFSET_X + c * CELL, y: PAD + r * CELL }; }
  function getVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function drawBoardBase() {
    ctx.clearRect(0, 0, DIM_W, DIM_H);
    const grad = ctx.createLinearGradient(0, 0, DIM_W, DIM_H);
    grad.addColorStop(0, getVar('--wood-light'));
    grad.addColorStop(1, getVar('--wood-dark'));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, DIM_W, DIM_H);

    ctx.strokeStyle = getVar('--line');
    ctx.lineWidth = 1;
    for (let i = 0; i < SIZE; i++) {
      const x = GRID_OFFSET_X + i * CELL;
      ctx.beginPath(); ctx.moveTo(x, PAD); ctx.lineTo(x, PAD + GRID_SPAN); ctx.stroke();
      const y = PAD + i * CELL;
      ctx.beginPath(); ctx.moveTo(GRID_OFFSET_X, y); ctx.lineTo(GRID_OFFSET_X + GRID_SPAN, y); ctx.stroke();
    }
    const stars = [3, 7, 11];
    ctx.fillStyle = getVar('--line');
    stars.forEach(r => stars.forEach(c => {
      const p = cellCenter(r, c);
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }));
  }

  function drawStoneAt(x, y, player) {
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(x - R * 0.35, y - R * 0.35, R * 0.1, x, y, R);
    if (player === BLACK) { g.addColorStop(0, getVar('--stone-black-1')); g.addColorStop(1, getVar('--stone-black-2')); }
    else { g.addColorStop(0, getVar('--stone-white-1')); g.addColorStop(1, getVar('--stone-white-2')); }
    ctx.fillStyle = g; ctx.fill();
    if (player === WHITE) { ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1; ctx.stroke(); }
  }

  function draw() {
    drawBoardBase();

    if (alk) {
      alk.physStones.forEach(s => drawStoneAt(s.x, s.y, s.color));
      if (alk.dragging && alk.dragCurrent) {
        const ns = alk.physStones[alk.newIndex];
        ctx.strokeStyle = getVar('--gold'); ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
        ctx.beginPath(); ctx.moveTo(ns.x, ns.y); ctx.lineTo(alk.dragCurrent.x, alk.dragCurrent.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = getVar('--gold');
        ctx.beginPath(); ctx.arc(alk.dragCurrent.x, alk.dragCurrent.y, 6, 0, Math.PI * 2); ctx.fill();
      }
      return;
    }

    windmillList.forEach(w => {
      if (!isStone(board[w.r][w.c])) return;
      const p = cellCenter(w.r, w.c);
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = getVar('--teal');
      ctx.lineWidth = 1.2;
      ctx.strokeRect(p.x - CELL * 0.9, p.y - CELL * 0.9, CELL * 1.8, CELL * 1.8);
      ctx.setLineDash([]);
    });

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (isStone(board[r][c])) { const p = cellCenter(r, c); drawStoneAt(p.x, p.y, board[r][c]); }
      }
    }

    windmillList.forEach(w => {
      if (!isStone(board[w.r][w.c])) return;
      const p = cellCenter(w.r, w.c);
      ctx.font = (CELL * 0.5) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🎡', p.x, p.y);
    });

    if (lastMovePos) {
      const p = cellCenter(lastMovePos.r, lastMovePos.c);
      ctx.strokeStyle = getVar('--accent'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.stroke();
    }

    if (winLine) {
      const a = cellCenter(winLine[0].r, winLine[0].c);
      const b = cellCenter(winLine[1].r, winLine[1].c);
      ctx.strokeStyle = getVar('--accent'); ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    if (pendingTarget) {
      ctx.strokeStyle = getVar('--purple');
      ctx.lineWidth = 3;
      ctx.strokeRect(2, 2, DIM_W - 4, DIM_H - 4);
    }
    if (pendingTarget && pendingTarget.type === 'trade' && pendingTarget.firstPos) {
      const p = cellCenter(pendingTarget.firstPos.r, pendingTarget.firstPos.c);
      ctx.strokeStyle = getVar('--purple'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, CELL * 0.5, 0, Math.PI * 2); ctx.stroke();
    }

    if (pendingPlacement) {
      const p = cellCenter(pendingPlacement.r, pendingPlacement.c);
      ctx.save();
      ctx.globalAlpha = 0.45;
      drawStoneAt(p.x, p.y, current);
      ctx.restore();
      ctx.strokeStyle = getVar('--gold'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, R + 3, 0, Math.PI * 2); ctx.stroke();
    }
    if (pendingTargetCell) {
      const p = cellCenter(pendingTargetCell.r, pendingTargetCell.c);
      ctx.strokeStyle = getVar('--gold'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, CELL * 0.5, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function rawPosFromEvent(evt) {
    let clientX, clientY;
    if (evt.touches && evt.touches.length) { clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY; }
    else if (evt.changedTouches && evt.changedTouches.length) { clientX = evt.changedTouches[0].clientX; clientY = evt.changedTouches[0].clientY; }
    else { clientX = evt.clientX; clientY = evt.clientY; }
    const rect = canvas.getBoundingClientRect();
    const scaleX = DIM_W / rect.width, scaleY = DIM_H / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function posFromEvent(evt) {
    const raw = rawPosFromEvent(evt);
    const c = Math.round((raw.x - GRID_OFFSET_X) / CELL), r = Math.round((raw.y - PAD) / CELL);
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return null;
    const p = cellCenter(r, c);
    if (Math.hypot(p.x - raw.x, p.y - raw.y) > CELL * 0.48) return null;
    return { r, c };
  }

  function handleCanvasClick(evt) {
    if (alkPhaseActive() || gameOver || draftOpen) return;
    if (mode !== 'local' && current !== myColor) return;
    const pos = posFromEvent(evt);
    if (!pos) return;

    if (pendingTarget) {
      pendingPlacement = null;
      pendingTargetCell = pos;
      showConfirmBar('이 대상을 선택할까요?');
      draw();
      return;
    }

    const { r, c } = pos;
    if (board[r][c] !== EMPTY) return;
    if (isBlockedForPlayer(r, c, current)) {
      addLog('🎡 풍차 주변이라 둘 수 없는 칸입니다');
      return;
    }
    pendingCardUse = null;
    pendingPlacement = { r, c };
    showConfirmBar('이 위치에 착수할까요?');
    draw();
  }

  function isBlockedForPlayer(r, c, player) {
    for (const w of windmillList) {
      if (!isStone(board[w.r][w.c])) continue;
      if (board[w.r][w.c] === player) continue;
      const dr = Math.abs(w.r - r), dc = Math.abs(w.c - c);
      if (dr <= 1 && dc <= 1 && !(dr === 0 && dc === 0)) return true;
    }
    return false;
  }

  function handlePlace(pos) {
    const { r, c } = pos;
    if (board[r][c] !== EMPTY) return;
    if (isBlockedForPlayer(r, c, current)) {
      addLog('🎡 풍차 주변이라 둘 수 없는 칸입니다');
      return;
    }
    if (turnPlacementsDone > 0 && turnPlacedPositions.length > 0) {
      const tooClose = turnPlacedPositions.some(p => Math.max(Math.abs(r - p.r), Math.abs(c - p.c)) <= 2);
      if (tooClose) {
        addLog('⚡ 연속 착수 — 이번 턴에 이미 둔 자리(포함) 2칸 이내에는 놓을 수 없습니다');
        return;
      }
    }
    // 카드 획득 카운트는 턴당 1회만: 연속 착수로 추가로 둔 돌은 세지 않음
    const countsForDraft = turnPlacementsDone === 0;
    board[r][c] = current;
    playPlaceSound();
    moveHistory.push({ r, c, player: current, counted: countsForDraft });
    lastMovePos = { r, c };
    turnPlacedPositions.push({ r, c });

    const trapHit = trapList.find(tr => tr.r === r && tr.c === c && tr.owner !== current);
    if (trapHit) {
      board[r][c] = EMPTY;
      moveHistory.pop();
      trapList = trapList.filter(tr => tr !== trapHit);
      addLog(`🪤 함정 발동! ${(current === BLACK ? '흑' : '백')}의 돌이 사라졌습니다`);
      grantRandomCard(trapHit.owner);
      turnPlacementsDone++;
      draw();
      if (turnPlacementsDone >= turnPlacementsNeeded) {
        passTurn();
      } else {
        updateStatus(); updatePips(); updateHandUI(); draw();
      }
      return;
    }
    // 자기 자신의 함정 위에 두면 그 함정은 조용히 소멸
    trapList = trapList.filter(tr => !(tr.r === r && tr.c === c));

    const win = checkWin(r, c, current);
    if (win) {
      gameOver = true; winLine = [win.start, win.end];
      draw(); showBanner((current === BLACK ? '흑' : '백') + ' 승리', true);
      return;
    }
    if (moveHistory.length === SIZE * SIZE) {
      gameOver = true; draw(); showBanner('무승부', true); return;
    }

    if (countsForDraft) placedCount[current]++;
    turnPlacementsDone++;

    const milestone = countsForDraft && placedCount[current] % INTERVAL === 0;
    draw();

    if (milestone) {
      openDraft(current);
    } else if (turnPlacementsDone >= turnPlacementsNeeded) {
      passTurn();
    } else {
      updateStatus(); updatePips(); updateHandUI(); draw();
    }
  }

  function passTurn() {
    current = other(current);
    turnPlacementsDone = 0;
    turnPlacementsNeeded = 1;
    turnPlacedPositions = [];
    usedCardThisTurn[current] = false;
    if (skipNextTurn[current]) {
      skipNextTurn[current] = false;
      addLog((current === BLACK ? '흑' : '백') + ': ⏭️ 직전에 사용한 카드의 대가로 이번 턴을 건너뜁니다');
      passTurn();
      return;
    }
    updateStatus(); updatePips(); updateHandUI(); draw();
  }

  function checkWin(r, c, player) {
    const dirs = [{ dr: 0, dc: 1 }, { dr: 1, dc: 0 }, { dr: 1, dc: 1 }, { dr: 1, dc: -1 }];
    for (const { dr, dc } of dirs) {
      let count = 1, start = { r, c }, end = { r, c };
      let rr = r + dr, cc = c + dc;
      while (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && board[rr][cc] === player) { end = { r: rr, c: cc }; count++; rr += dr; cc += dc; }
      rr = r - dr; cc = c - dc;
      while (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && board[rr][cc] === player) { start = { r: rr, c: cc }; count++; rr -= dr; cc -= dc; }
      if (count >= winLength) return { start, end };
    }
    return null;
  }

  function scanBoardForWin() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (isStone(board[r][c])) { const win = checkWin(r, c, board[r][c]); if (win) return { player: board[r][c], win }; }
    }
    return null;
  }

  function endIfBoardWin(skipSync) {
    const found = scanBoardForWin();
    if (found) {
      gameOver = true;
      winLine = [found.win.start, found.win.end];
      draw();
      showBanner((found.player === BLACK ? '흑' : '백') + ' 승리', skipSync);
      return true;
    }
    return false;
  }

  function renderBannerOnly(text) {
    banner.textContent = text + ' — 새 게임을 눌러 다시 시작하세요';
    banner.classList.add('show');
  }
  function showBanner(text, skipSync) {
    mpBannerText = text;
    renderBannerOnly(text);
    if (mode === 'multiplayer' && !skipSync) syncPublicState();
  }

  // ---- 카드 획득 (드래프트) ----
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // 가중치 기반 비복원 추출 (Efraimidis-Spirakis): weight가 낮을수록 뽑힐 확률이 낮음
  function weightedSample(pool, k) {
    const keyed = pool.map(card => ({ card, key: Math.pow(Math.random(), 1 / (card.weight || 10)) }));
    keyed.sort((a, b) => b.key - a.key);
    return keyed.slice(0, k).map(x => x.card);
  }

  function grantRandomCard(player) {
    const pname = player === BLACK ? '흑' : '백';
    const card = weightedSample(getCardPool(), 1)[0];
    hand[player].push(card);
    if (hand[player].length > HAND_LIMIT) {
      const dropped = hand[player].shift();
      addLog(`${pname}: 패 한도 초과로 ${dropped.name} 소멸`);
    }
    addLog(`${pname}: ${card.icon} ${card.name} 획득`);
  }

  function openDraft(player) {
    const picks = weightedSample(getCardPool(), 3);
    if (mode === 'bot' && player !== myColor) {
      // 봇은 UI 없이 선택 (저난이도는 무작위, 고난이도는 강한 카드 우선)
      draftPlayer = player;
      draftOpen = false;
      pickCardIntoHand(botPickDraft(picks));
      return;
    }
    draftOpen = true;
    draftPlayer = player;
    draftTitle.textContent = (player === BLACK ? '흑' : '백') + ' — 카드 획득';
    draftCardsEl.innerHTML = '';
    picks.forEach(card => {
      const btn = document.createElement('button');
      btn.className = 'aug-card';
      btn.innerHTML = `<div class="aug-icon">${card.icon}</div><div class="aug-name">${card.name}</div><div class="aug-desc">${card.desc}</div>`;
      btn.addEventListener('click', () => pickCardIntoHand(card));
      draftCardsEl.appendChild(btn);
    });
    draftOverlay.classList.add('show');
    updateHandUI();
  }

  function runStartupDraft() {
    if (!startupQueue || startupQueue.length === 0) {
      startupQueue = null;
      updateStatus(); updatePips(); updateHandUI(); draw();
      return;
    }
    openDraft(startupQueue[0]);
  }

  function pickCardIntoHand(card) {
    const p = draftPlayer;
    const pname = p === BLACK ? '흑' : '백';
    hand[p].push(card);
    if (hand[p].length > HAND_LIMIT) {
      const dropped = hand[p].shift();
      addLog(`${pname}: 패 한도 초과로 ${dropped.name} 소멸`);
    }
    addLog(`${pname}: ${card.icon} ${card.name} 획득 (패에 저장)`);
    draftOverlay.classList.remove('show');
    draftOpen = false;
    if (mode === 'multiplayer') savePrivateState();

    if (startupQueue) {
      startupQueue.shift();
      runStartupDraft();
      return;
    }

    if (turnPlacementsDone >= turnPlacementsNeeded) {
      passTurn();
    } else {
      updateStatus(); updatePips(); updateHandUI(); draw();
    }
    if (mode === 'multiplayer') syncPublicState();
  }

  // ---- 카드 사용 ----
  function hasStoneOf(player) {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === player) return true;
    return false;
  }
  function hasWindmillableTarget(player) {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === player && !windmillList.some(w => w.r === r && w.c === c)) return true;
    }
    return false;
  }

  function hasEmptyCell() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === EMPTY) return true;
    return false;
  }

  function pruneInvalidTraps() {
    trapList = trapList.filter(t => board[t.r][t.c] === EMPTY);
  }

  // 순간이동 목적지: 가능하면 그 플레이어에게 풍차로 막히지 않은 빈 칸 중에서, 없으면 아무 빈 칸에서 무작위 선택
  function pickRandomEmptyCell(forPlayer) {
    const preferred = [];
    const anyEmpty = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === EMPTY) {
        anyEmpty.push({ r, c });
        if (!isBlockedForPlayer(r, c, forPlayer)) preferred.push({ r, c });
      }
    }
    const pool = preferred.length > 0 ? preferred : anyEmpty;
    if (pool.length === 0) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // 감염 대상: 내 돌과 상하좌우(대각선 제외)로 맞닿은 상대 돌 목록 (중복 없이)
  function getOrthogonalEnemyNeighbors(player) {
    const opp = other(player);
    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    const seen = new Set();
    const result = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== player) continue;
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
        if (board[nr][nc] !== opp) continue;
        const key = nr + ',' + nc;
        if (!seen.has(key)) { seen.add(key); result.push({ r: nr, c: nc }); }
      }
    }
    return result;
  }

  // 지진: 모든 돌을 각자 주변 무작위 빈 칸(원래 보드 기준)으로 흔들되, 겹치지 않도록 처리
  function runEarthquake() {
    const stones = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (isStone(board[r][c])) stones.push({ r, c, color: board[r][c], isWindmill: windmillList.some(w => w.r === r && w.c === c) });
    }
    const occSet = new Set(stones.map(s => s.r + ',' + s.c));
    const claimed = new Set();
    const order = shuffle(stones.map((_, i) => i));
    const newPos = new Array(stones.length);

    for (const i of order) {
      const s = stones[i];
      const neighbors = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = s.r + dr, nc = s.c + dc;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
        const key = nr + ',' + nc;
        if (occSet.has(key)) continue;      // 원래 다른 돌이 있던 칸은 제외
        if (claimed.has(key)) continue;      // 이번 지진에서 이미 배정된 칸은 제외
        neighbors.push({ r: nr, c: nc, key });
      }
      if (neighbors.length > 0) {
        const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
        claimed.add(pick.key);
        newPos[i] = { r: pick.r, c: pick.c };
      } else {
        newPos[i] = { r: s.r, c: s.c };
      }
    }

    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
    windmillList = [];
    moveHistory = [];
    stones.forEach((s, i) => {
      const p = newPos[i];
      board[p.r][p.c] = s.color;
      moveHistory.push({ r: p.r, c: p.c, player: s.color });
      if (s.isWindmill) windmillList.push({ r: p.r, c: p.c });
    });
    lastMovePos = null;
    pruneInvalidTraps();
  }

  function useCard(player, idx) {
    if (player !== current || gameOver || draftOpen || pendingTarget || usedCardThisTurn[player] || alkPhaseActive()) return;
    if (mode === 'multiplayer' && player !== myColor) return;
    const card = hand[player][idx];
    if (!card) return;
    const opp = other(player);
    const pname = player === BLACK ? '흑' : '백';

    if (cardLockNextTurn[player]) {
      cardLockNextTurn[player] = false;
      removeFromHand(player, idx);
      markUsed(player);
      addLog(`${pname}: 🚫 봉쇄 — ${card.icon} ${card.name} 카드가 무효화되었습니다`);
      if (mode === 'multiplayer') setNotice(`🚫 봉쇄로 ${pname}의 카드 1장이 무효화되었습니다`);
      updateHandUI(); draw();
      return;
    }

    switch (card.type) {
      case 'chain_move':
        removeFromHand(player, idx);
        markUsed(player);
        turnPlacementsNeeded = Math.max(turnPlacementsNeeded, turnPlacementsDone + 3, 3);
        addLog(`${pname}: ${card.icon} 연속 착수 발동 — 이번 턴 총 3착`);
        updateStatus(); updatePips(); updateHandUI(); draw();
        return;

      case 'six_sense':
        if (winLength === 6) { addLog(`${pname}: 이미 6목 규칙이 적용 중입니다`); return; }
        winLength = 6;
        removeFromHand(player, idx);
        markUsed(player);
        addLog(`${pname}: ${card.icon} 식스센스 발동 — 이제부터 6목`);
        updateStatus(); updateHandUI(); draw();
        return;

      case 'reversal':
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === BLACK) board[r][c] = WHITE;
          else if (board[r][c] === WHITE) board[r][c] = BLACK;
        }
        removeFromHand(player, idx);
        markUsed(player);
        addLog(`${pname}: ${card.icon} 전세 역전 발동 — 모든 돌 색 반전 (턴 종료)`);
        updateHandUI(); draw();
        if (endIfBoardWin(true)) return;
        passTurn();
        return;

      case 'windmill':
        if (!hasWindmillableTarget(player)) { addLog(`${pname}: 풍차로 만들 수 있는 내 돌 없음`); return; }
        pendingTarget = { type: 'windmill', forPlayer: player, handIndex: idx };
        enterTargetMode('풍차로 만들 내 돌을 클릭하세요');
        return;

      case 'self_remove':
        if (!hasStoneOf(player)) { addLog(`${pname}: 제거할 내 돌 없음`); return; }
        pendingTarget = { type: 'self_remove', forPlayer: player, handIndex: idx };
        enterTargetMode('제거할 내 돌을 클릭하세요');
        return;

      case 'remove_enemy':
        if (!hasStoneOf(opp)) { addLog(`${pname}: 제거할 대상 없음`); return; }
        pendingTarget = { type: 'remove', opponent: opp, forPlayer: player, handIndex: idx };
        enterTargetMode('제거할 상대 돌을 클릭하세요');
        return;

      case 'trade':
        if (!hasStoneOf(BLACK) || !hasStoneOf(WHITE)) { addLog(`${pname}: 교환할 돌이 부족함`); return; }
        pendingTarget = { type: 'trade', forPlayer: player, handIndex: idx, stage: 'first', firstPos: null };
        enterTargetMode('교환할 돌 하나를 클릭하세요');
        return;

      case 'alkkagi':
        removeFromHand(player, idx);
        markUsed(player);
        addLog(`${pname}: ${card.icon} 알까기 모드 발동`);
        startAlkkagi(player);
        return;

      case 'teleport':
        if (!hasStoneOf(player)) { addLog(`${pname}: 이동시킬 내 돌 없음`); return; }
        if (!hasEmptyCell()) { addLog(`${pname}: 이동할 빈 칸 없음`); return; }
        pendingTarget = { type: 'teleport', forPlayer: player, handIndex: idx };
        enterTargetMode('이동시킬 내 돌을 클릭하세요');
        return;

      case 'earthquake':
        runEarthquake();
        removeFromHand(player, idx);
        markUsed(player);
        addLog(`${pname}: ${card.icon} 지진 발동 — 모든 돌이 흔들려 재배치됨`);
        mpShakeSeq++;
        lastSeenShakeSeq = mpShakeSeq;
        triggerBoardShake();
        updateHandUI(); draw();
        if (moveHistory.length === SIZE * SIZE) { gameOver = true; showBanner('무승부', true); return; }
        endIfBoardWin(true);
        return;

      case 'blockade':
        cardLockNextTurn[opp] = true;
        removeFromHand(player, idx);
        markUsed(player);
        addLog(`${pname}: ${card.icon} 봉쇄 발동 — 상대가 다음에 쓰는 카드는 무효가 됩니다`);
        if (mode === 'multiplayer') setNotice(`🚫 ${pname}이(가) 봉쇄를 사용했습니다 — 상대의 다음 카드가 무효화됩니다`);
        updateHandUI(); draw();
        return;

      case 'trap':
        if (!hasEmptyCell()) { addLog(`${pname}: 함정을 설치할 빈 칸 없음`); return; }
        pendingTarget = { type: 'trap', forPlayer: player, handIndex: idx };
        enterTargetMode('함정을 설치할 빈 칸을 클릭하세요');
        return;

      case 'infection': {
        const targets = getOrthogonalEnemyNeighbors(player);
        if (targets.length === 0) { addLog(`${pname}: 감염시킬 인접 상대 돌 없음`); return; }
        const converted = [];
        for (const t of shuffle(targets)) {
          if (converted.length >= 2) break;
          board[t.r][t.c] = player;
          if (checkWin(t.r, t.c, player)) {
            board[t.r][t.c] = opp; // 오목/육목이 완성되는 감염은 불가 — 되돌리고 다른 대상 검토
            continue;
          }
          converted.push(t);
        }
        if (converted.length === 0) { addLog(`${pname}: 감염할 수 있는 안전한 대상 없음 (오목/육목 완성 방지)`); return; }
        removeFromHand(player, idx);
        markUsed(player);
        addLog(`${pname}: ${card.icon} 감염 발동 — 상대 돌 ${converted.length}개 전향 (턴 종료)`);
        updateHandUI(); draw();
        passTurn();
        return;
      }
    }
  }

  function showConfirmBar(text) {
    confirmText.textContent = text;
    confirmBar.classList.add('show');
  }
  function hideConfirmBar() {
    confirmBar.classList.remove('show');
  }
  function clearAllPending() {
    pendingPlacement = null;
    pendingCardUse = null;
    pendingTargetCell = null;
    hideConfirmBar();
  }

  function enterTargetMode(msg) {
    statusText.classList.remove('alkkagi');
    statusText.textContent = msg;
    statusText.classList.add('targeting');
    cancelBtn.classList.add('show');
    updateHandUI();
    draw();
  }

  function resetStatusAfterTarget() {
    cancelBtn.classList.remove('show');
    statusText.classList.remove('targeting');
    statusText.textContent = (current === BLACK ? '흑' : '백') + ' 차례';
  }

  function handleTargetClick(pos) {
    const { r, c } = pos;
    const t = pendingTarget;
    const pname = t.forPlayer === BLACK ? '흑' : '백';
    let resolved = false;

    if (t.type === 'remove' && board[r][c] === t.opponent) {
      board[r][c] = EMPTY;
      moveHistory = moveHistory.filter(m => !(m.r === r && m.c === c));
      skipNextTurn[t.forPlayer] = true;
      addLog(`${pname}: 💥 상대 돌 제거 (대가: 다음 턴 건너뜀)`);
      resolved = true;

    } else if (t.type === 'self_remove' && board[r][c] === t.forPlayer) {
      board[r][c] = EMPTY;
      moveHistory = moveHistory.filter(m => !(m.r === r && m.c === c));
      addLog(`${pname}: 🫳 내 돌 회수`);
      resolved = true;

    } else if (t.type === 'teleport' && board[r][c] === t.forPlayer) {
      const dest = pickRandomEmptyCell(t.forPlayer);
      if (!dest) { addLog('이동할 빈 칸이 없습니다'); return; }
      board[r][c] = EMPTY;
      board[dest.r][dest.c] = t.forPlayer;
      moveHistory = moveHistory.filter(m => !(m.r === r && m.c === c));
      moveHistory.push({ r: dest.r, c: dest.c, player: t.forPlayer });
      const wIdx = windmillList.findIndex(w => w.r === r && w.c === c);
      if (wIdx !== -1) windmillList[wIdx] = { r: dest.r, c: dest.c };
      lastMovePos = dest;
      pruneInvalidTraps();
      addLog(`${pname}: ✨ 순간이동 발동`);
      resolved = true;

    } else if (t.type === 'trap' && board[r][c] === EMPTY) {
      if (trapList.some(tr => tr.r === r && tr.c === c)) {
        addLog('이미 함정이 있는 칸입니다. 다른 칸을 클릭하세요');
        return;
      }
      trapList.push({ r, c, owner: t.forPlayer });
      addLog(`⚠️ ${pname}이(가) 함정을 설치했습니다! 상대는 조심하세요`);
      if (mode === 'multiplayer') setNotice(`⚠️ 상대가 함정을 설치했습니다! 조심하세요`);
      resolved = true;

    } else if (t.type === 'windmill' && board[r][c] === t.forPlayer) {
      if (windmillList.some(w => w.r === r && w.c === c)) {
        addLog('이미 풍차인 돌입니다. 다른 돌을 클릭하세요');
        return;
      }
      windmillList.push({ r, c });
      addLog(`${pname}: 🎡 풍차 설치`);
      resolved = true;

    } else if (t.type === 'trade') {
      if (t.stage === 'first') {
        if (isStone(board[r][c])) {
          t.firstPos = { r, c, color: board[r][c] };
          t.stage = 'second';
          statusText.textContent = '이제 반대 색 돌을 클릭하세요';
          draw();
        }
        return;
      } else {
        if (isStone(board[r][c]) && board[r][c] !== t.firstPos.color && !(r === t.firstPos.r && c === t.firstPos.c)) {
          const a = t.firstPos, bColor = board[r][c];
          board[a.r][a.c] = bColor;
          board[r][c] = a.color;
          addLog(`${pname}: 🔄 맞교환 발동`);
          resolved = true;
        } else {
          return;
        }
      }
    }

    if (resolved) {
      removeFromHand(t.forPlayer, t.handIndex);
      markUsed(t.forPlayer);
      pendingTarget = null;
      resetStatusAfterTarget();
      updateHandUI();
      draw();
      if (t.type === 'trade' || t.type === 'teleport') endIfBoardWin(true);
    }
  }

  function cancelTarget() {
    if (!pendingTarget) return;
    pendingTarget = null;
    pendingTargetCell = null;
    hideConfirmBar();
    resetStatusAfterTarget();
    updateHandUI();
    draw();
  }

  function removeFromHand(player, idx) { hand[player].splice(idx, 1); }
  function markUsed(player) { usedCardThisTurn[player] = true; }

  function undo() {
    if (gameOver || draftOpen || pendingTarget || alk || moveHistory.length === 0) return;
    const last = moveHistory.pop();
    board[last.r][last.c] = EMPTY;
    if (last.counted !== false) placedCount[last.player] = Math.max(0, placedCount[last.player] - 1);
    current = last.player;
    turnPlacementsDone = 0;
    turnPlacementsNeeded = 1;
    turnPlacedPositions = [];
    lastMovePos = moveHistory.length > 0 ? { r: moveHistory[moveHistory.length - 1].r, c: moveHistory[moveHistory.length - 1].c } : null;
    updateStatus(); updatePips(); updateHandUI(); draw();
  }

  // ================= 알까기 =================
  function buildPhysFromBoard() {
    const list = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (isStone(board[r][c])) {
        const p = cellCenter(r, c);
        list.push({ x: p.x, y: p.y, vx: 0, vy: 0, color: board[r][c], isNew: false, isWindmill: windmillList.some(w => w.r === r && w.c === c) });
      }
    }
    return list;
  }

  function addNewFlickStone(player) {
    const ns = { x: GRID_OFFSET_X + GRID_SPAN / 2, y: PAD + GRID_SPAN + EXTRA_BOTTOM / 2, vx: 0, vy: 0, color: player, isNew: true, isWindmill: false };
    alk.physStones.push(ns);
    alk.newIndex = alk.physStones.length - 1;
    alk.awaitingLaunch = true;
    alk.dragging = false;
    alk.dragCurrent = null;
  }

  function startAlkkagi(player) {
    const opp = other(player);
    alkHandoff = null;
    alk = {
      turnOrder: [player, opp],
      turnIndex: 0,
      physStones: buildPhysFromBoard(),
      simulating: false,
      awaitingLaunch: true,
      dragging: false,
      dragCurrent: null,
      frameCount: 0,
    };
    addNewFlickStone(player);
    updateStatus(); updateHandUI(); draw();
    checkBotAlkTurn();
  }

  function beginMyAlkTurn(turnOrder, turnIndex) {
    alkHandoff = null;
    alk = {
      turnOrder: turnOrder,
      turnIndex: turnIndex,
      physStones: buildPhysFromBoard(),
      simulating: false,
      awaitingLaunch: true,
      dragging: false,
      dragCurrent: null,
      frameCount: 0,
    };
    addNewFlickStone(myColor);
    updateStatus(); updateHandUI(); draw();
  }

  function tryStartDrag(pos) {
    if (!alk || !alk.awaitingLaunch || alk.simulating) return;
    const ns = alk.physStones[alk.newIndex];
    if (Math.hypot(pos.x - ns.x, pos.y - ns.y) <= CELL * 0.9) {
      alk.dragging = true;
      alk.dragCurrent = pos;
      draw();
    }
  }
  function updateDrag(pos) {
    if (!alk || !alk.dragging) return;
    alk.dragCurrent = pos;
    draw();
  }
  function releaseDrag(pos) {
    if (!alk || !alk.dragging) return;
    alk.dragging = false;
    const ns = alk.physStones[alk.newIndex];
    let pullX = pos.x - ns.x, pullY = pos.y - ns.y;
    let pullDist = Math.hypot(pullX, pullY);
    const MAXPULL = CELL * 4;
    if (pullDist > MAXPULL) { pullX *= MAXPULL / pullDist; pullY *= MAXPULL / pullDist; pullDist = MAXPULL; }
    if (pullDist < 6) { alk.dragCurrent = null; draw(); return; } // 너무 약하면 다시 시도
    const POWER = 0.32;
    ns.vx = -pullX * POWER; ns.vy = -pullY * POWER;
    alk.awaitingLaunch = false;
    alk.simulating = true;
    alk.frameCount = 0;
    alk.dragCurrent = null;
    updateStatus();
    requestAnimationFrame(simulateAlkTick);
  }

  function simulateAlkTick() {
    if (!alk || !alk.simulating) return;
    const stones = alk.physStones;
    const FRICTION = 0.965, MIN_SPEED = 0.05;

    for (const s of stones) { s.x += s.vx; s.y += s.vy; s.vx *= FRICTION; s.vy *= FRICTION; }

    for (const s of stones) {
      if (s.x < R) { s.x = R; s.vx = Math.abs(s.vx) * 0.6; }
      if (s.x > DIM_W - R) { s.x = DIM_W - R; s.vx = -Math.abs(s.vx) * 0.6; }
      if (s.y < R) { s.y = R; s.vy = Math.abs(s.vy) * 0.6; }
      if (s.y > DIM_H - R) { s.y = DIM_H - R; s.vy = -Math.abs(s.vy) * 0.6; }
    }

    for (let i = 0; i < stones.length; i++) {
      for (let j = i + 1; j < stones.length; j++) {
        const a = stones[i], b = stones[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.0001;
        const minDist = R * 2;
        if (dist < minDist) {
          const nx = dx / dist, ny = dy / dist;
          const overlap = (minDist - dist) / 2;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          const avn = a.vx * nx + a.vy * ny, bvn = b.vx * nx + b.vy * ny;
          const avtx = a.vx - avn * nx, avty = a.vy - avn * ny;
          const bvtx = b.vx - bvn * nx, bvty = b.vy - bvn * ny;
          a.vx = avtx + bvn * nx; a.vy = avty + bvn * ny;
          b.vx = bvtx + avn * nx; b.vy = bvty + avn * ny;
        }
      }
    }

    draw();
    alk.frameCount++;
    const maxSpeed = stones.reduce((m, s) => Math.max(m, Math.hypot(s.vx, s.vy)), 0);
    if (maxSpeed < MIN_SPEED || alk.frameCount > 480) {
      alk.simulating = false;
      finishAlkFlick();
    } else {
      requestAnimationFrame(simulateAlkTick);
    }
  }

  function snapPhysStonesToGrid(physStones) {
    const candidates = [];
    for (let si = 0; si < physStones.length; si++) {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
        const p = cellCenter(r, c);
        const dist = Math.hypot(physStones[si].x - p.x, physStones[si].y - p.y);
        candidates.push({ si, r, c, dist });
      }
    }
    candidates.sort((a, b) => a.dist - b.dist);
    const assignedStone = new Array(physStones.length).fill(false);
    const takenCell = new Set();
    const result = new Array(physStones.length);
    let remaining = physStones.length;
    for (const cand of candidates) {
      if (remaining === 0) break;
      if (assignedStone[cand.si]) continue;
      const key = cand.r + ',' + cand.c;
      if (takenCell.has(key)) continue;
      assignedStone[cand.si] = true;
      takenCell.add(key);
      result[cand.si] = { r: cand.r, c: cand.c };
      remaining--;
    }
    return result;
  }

  function finishAlkFlick() {
    const assign = snapPhysStonesToGrid(alk.physStones);
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
    windmillList = [];
    moveHistory = [];
    let newStonePos = null;
    alk.physStones.forEach((s, i) => {
      const pos = assign[i];
      if (!pos) return; // 보드가 가득 찬 극단적 상황 안전장치
      board[pos.r][pos.c] = s.color;
      moveHistory.push({ r: pos.r, c: pos.c, player: s.color });
      if (s.isWindmill) windmillList.push({ r: pos.r, c: pos.c });
      if (s.isNew) newStonePos = pos;
    });
    if (newStonePos) lastMovePos = newStonePos;
    pruneInvalidTraps();
    draw();

    const turnOrder = alk.turnOrder;
    const nextIndex = alk.turnIndex + 1;
    const phaseDone = nextIndex >= turnOrder.length;

    if (mode === 'multiplayer') {
      if (phaseDone) {
        alk = null; alkHandoff = null;
        addLog('🪀 알까기 종료 — 오목판으로 복귀');
      } else {
        alk = null;
        alkHandoff = { turnOrder: turnOrder, turnIndex: nextIndex };
        addLog((turnOrder[nextIndex] === BLACK ? '흑' : '백') + ': 알까기 차례');
      }
      syncPublicState();
      savePrivateState();
      if (phaseDone) {
        if (moveHistory.length === SIZE * SIZE) { gameOver = true; showBanner('무승부'); draw(); return; }
        if (endIfBoardWin()) return;
      }
      updateStatus(); updatePips(); updateHandUI(); draw();
      return;
    }

    // ---- 로컬 / 봇 모드: 한 화면에서 이어서 진행 ----
    if (!phaseDone) {
      const nextPlayer = turnOrder[nextIndex];
      alk.turnIndex = nextIndex;
      alk.physStones = buildPhysFromBoard();
      addNewFlickStone(nextPlayer);
      addLog((nextPlayer === BLACK ? '흑' : '백') + ': 알까기 차례');
      updateStatus(); draw();
      checkBotAlkTurn();
    } else {
      alk = null;
      addLog('🪀 알까기 종료 — 오목판으로 복귀');
      if (moveHistory.length === SIZE * SIZE) {
        gameOver = true; showBanner('무승부'); draw(); return;
      }
      if (endIfBoardWin()) return;
      updateStatus(); updatePips(); updateHandUI(); draw();
    }
  }

  // ================= 멀티플레이 동기화 =================
  function flattenBoard() { const a = []; for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) a.push(board[r][c]); return a; }
  function unflattenBoard(flat) { const b = []; for (let r = 0; r < SIZE; r++) b.push(flat.slice(r * SIZE, (r + 1) * SIZE)); return b; }

  function buildPublicState() {
    const alkOrderNow = alk ? alk.turnOrder : (alkHandoff ? alkHandoff.turnOrder : null);
    const alkIndexNow = alk ? alk.turnIndex : (alkHandoff ? alkHandoff.turnIndex : null);
    return {
      board: flattenBoard(), current, winLength, windmillList,
      turnPlacementsDone, turnPlacementsNeeded,
      usedCardThisTurn, cardLockNextTurn, skipNextTurn, placedCount,
      gameOver, winLine, lastMovePos,
      players: mpPlayers,
      notice: mpNotice, noticeSeq: mpNoticeSeq,
      bannerText: mpBannerText,
      shakeSeq: mpShakeSeq,
      restartSeq: mpRestartSeq,
      alkActive: !!(alk || alkHandoff),
      alkTurnOrder: alkOrderNow,
      alkTurnIndex: alkIndexNow,
    };
  }

  let publicSyncBusy = false, publicSyncQueued = false;
  async function syncPublicState() {
    if (mode !== 'multiplayer' || !dbApi || !roomCode) return;
    if (publicSyncBusy) { publicSyncQueued = true; return; }
    publicSyncBusy = true;
    try { await dbApi.setPath('games/' + roomCode, buildPublicState()); } catch (e) {}
    publicSyncBusy = false;
    if (publicSyncQueued) { publicSyncQueued = false; syncPublicState(); }
  }

  let privateSyncBusy = false, privateSyncQueued = false;
  async function savePrivateState() {
    if (mode !== 'multiplayer' || !dbApi || !roomCode) return;
    if (privateSyncBusy) { privateSyncQueued = true; return; }
    privateSyncBusy = true;
    try { await dbApi.setPath('private/' + myUserId + '/games_' + roomCode, { hand: hand[myColor], traps: trapList }); } catch (e) {}
    privateSyncBusy = false;

  async function loadPrivateState() {
    if (mode !== 'multiplayer' || !dbApi || !roomCode) return;
    try {
      const snap = await dbApi.getPath('private/' + myUserId + '/games_' + roomCode);

  function setNotice(text) { mpNotice = text; mpNoticeSeq++; lastSeenNoticeSeq = mpNoticeSeq; }

  function triggerBoardShake() {
    if (!boardWrapEl) return;
    boardWrapEl.classList.remove('shake');
    void boardWrapEl.offsetWidth; // 강제 리플로우로 애니메이션 재시작 가능하게
    boardWrapEl.classList.add('shake');
  }

  function checkMyTrapsAgainstBoard() {
    if (mode !== 'multiplayer' || !trapList || trapList.length === 0) return;
    const opp = other(myColor);
    const remaining = [];
    let triggered = false;
    for (const tr of trapList) {
      if (board[tr.r][tr.c] === opp) {
        board[tr.r][tr.c] = EMPTY;
        addLog('🪤 함정 발동! 상대 돌이 사라졌습니다');
        grantRandomCard(myColor);
        triggered = true;
      } else if (board[tr.r][tr.c] === EMPTY) {
        remaining.push(tr);
      }
      // 내 돌이 그 칸을 덮은 경우는 자연 소멸 (remaining에서 제외)
    }
    trapList = remaining;
    if (triggered) {
      // 함정이 걸린 돌이 오목/육목을 완성해서 상대 쪽이 이미 승리를 선언했더라도, 그 돌이 사라졌으면 승리 판정을 취소하고 게임을 이어감
      if (gameOver && winLine && !scanBoardForWin()) {
        gameOver = false; winLine = null; mpBannerText = null;
        banner.classList.remove('show');
        addLog('🪤 함정이 승리를 막았습니다 — 게임을 계속합니다');
        if (current === opp) passTurn();
      }
      setNotice('🪤 함정이 발동되어 상대 돌이 제거됐습니다');
      syncPublicState();
      savePrivateState();
    }
  }

  function applyPublicSnapshot(data) {
    if (!data) return;
    if (data.board) board = unflattenBoard(data.board);
    if (data.current) current = data.current;
    if (data.winLength) winLength = data.winLength;
    windmillList = data.windmillList || [];
    turnPlacementsDone = data.turnPlacementsDone || 0;
    turnPlacementsNeeded = data.turnPlacementsNeeded || 1;
    usedCardThisTurn = data.usedCardThisTurn || { [BLACK]: false, [WHITE]: false };
    cardLockNextTurn = data.cardLockNextTurn || { [BLACK]: false, [WHITE]: false };
    skipNextTurn = data.skipNextTurn || { [BLACK]: false, [WHITE]: false };
    placedCount = data.placedCount || { [BLACK]: 0, [WHITE]: 0 };
    gameOver = !!data.gameOver;
    if (gameOver) clearAllPending();
    mpBannerText = data.bannerText || null;
    winLine = data.winLine || null;
    lastMovePos = data.lastMovePos || null;
    mpPlayers = data.players || mpPlayers;

    if (data.noticeSeq && data.noticeSeq > lastSeenNoticeSeq) {
      lastSeenNoticeSeq = data.noticeSeq;
      if (data.notice) addLog(data.notice);
    }
    if (typeof data.shakeSeq === 'number' && data.shakeSeq > lastSeenShakeSeq) {
      lastSeenShakeSeq = data.shakeSeq;
      triggerBoardShake();
    }
    if (typeof data.restartSeq === 'number' && data.restartSeq > lastSeenRestartSeq) {
      lastSeenRestartSeq = data.restartSeq;
      hand[myColor] = [];
      trapList = [];
      pendingTarget = null; draftOpen = false; draftPlayer = null;
      pendingPlacement = null; pendingCardUse = null; pendingTargetCell = null;
      startupQueue = [myColor];
      runStartupDraft();
    }

    syncAlkFromPublic(data);
    checkMyTrapsAgainstBoard();

    if (gameOver && data.bannerText) {
      if (!banner.classList.contains('show')) renderBannerOnly(data.bannerText);
    } else {
      banner.classList.remove('show');
    }

    updateStatus(); updatePips(); updateHandUI(); draw();
  }

  function syncAlkFromPublic(data) {
    if (!data.alkActive) {
      if (alk || alkHandoff) { alk = null; alkHandoff = null; }
      return;
    }
    const turnOrder = data.alkTurnOrder;
    const turnIndex = data.alkTurnIndex;
    if (!turnOrder || typeof turnIndex !== 'number') return;
    const flicker = turnOrder[turnIndex];
    if (flicker === myColor) {
      if (!alk || alk.turnIndex !== turnIndex) {
        beginMyAlkTurn(turnOrder, turnIndex);
      }
    } else {
      alk = null;
      alkHandoff = { turnOrder: turnOrder, turnIndex: turnIndex };
    }
  }

  // ---- 채팅 (멀티플레이 전용) ----
  const CHAT_MAX_LEN = 200;
  const CHAT_HISTORY = 50;
  let unsubChat = null;

  function subscribeChat() {
    unsubscribeChat();
    chatPanel.hidden = false;
    renderChat([]);
    unsubChat = dbApi.onPathLast('chats/' + roomCode, CHAT_HISTORY, renderChat, function () {
      renderChat([], '채팅 서버에 연결할 수 없습니다');

  function unsubscribeChat() {
    if (unsubChat) { unsubChat(); unsubChat = null; }
    chatPanel.hidden = true;
    chatInput.value = '';
  }

  function renderChat(messages, emptyText) {
    chatList.innerHTML = '';
    if (!messages.length) {
      const li = document.createElement('li');
      li.className = 'chat-empty';
      li.textContent = emptyText || '아직 메시지가 없습니다';
      chatList.appendChild(li);
      return;
    }
    for (const m of messages) {
      if (!m || typeof m.text !== 'string') continue;
      const li = document.createElement('li');
      li.className = 'chat-msg' + (m.uid === myUserId ? ' mine' : '');
      const who = document.createElement('div');
      who.className = 'chat-who';
      who.textContent = m.uid === myUserId ? '나' : (m.color === BLACK ? '흑' : m.color === WHITE ? '백' : '상대');
      const text = document.createElement('div');
      text.textContent = m.text.slice(0, CHAT_MAX_LEN);
      li.appendChild(who); li.appendChild(text);
      chatList.appendChild(li);
    }
    chatList.scrollTop = chatList.scrollHeight;
  }

  async function sendChat() {
    const text = chatInput.value.trim().slice(0, CHAT_MAX_LEN);
    if (!text || mode !== 'multiplayer' || !dbApi || !roomCode) return;
    chatInput.value = '';
    try {
      await dbApi.pushPath('chats/' + roomCode, { uid: myUserId, color: myColor, text, ts: Date.now() });
    } catch (e) {
      chatInput.value = text;
      addLog('💬 메시지를 보내지 못했습니다');

  chatForm.addEventListener('submit', function (e) { e.preventDefault(); sendChat(); });

  function subscribePublic() {
    subscribeChat();
    if (unsubPublic) { unsubPublic(); unsubPublic = null; }
    unsubPublic = dbApi.onPath('games/' + roomCode, function (snap) {
      if (!snap.exists) return;
      const data = snap.data();

      if (currentScreen !== 'game' && data.players && data.players[BLACK] && data.players[WHITE]) {
        showScreen('game');

    }, function () {
      lobbyStatus.textContent = '연결 오류가 발생했습니다. 새로고침 후 다시 시도해주세요.';
    });

  function randomRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];

  }

  function startRematch() {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
    current = BLACK;
    moveHistory = [];
    gameOver = false;

    winLength = 5;

    turnPlacedPositions = [];
    usedCardThisTurn = { [BLACK]: false, [WHITE]: false };
    cardLockNextTurn = { [BLACK]: false, [WHITE]: false };

    pendingPlacement = null; pendingCardUse = null; pendingTargetCell = null;
    alk = null; alkHandoff = null;

    logLines = [];

    mpRestartSeq++; lastSeenRestartSeq = mpRestartSeq; // 내 화면은 스스로 에코 처리하지 않도록
    banner.classList.remove('show'); draftOverlay.classList.remove('show'); updateLog();

  async function joinRoom(codeRaw) {
    if (!dbApi || !myUserId) { lobbyStatus.textContent = '서버에 연결하는 중입니다. 잠시 후 다시 눌러주세요.'; return; }
    const code = (codeRaw || '').trim().toUpperCase();

      const data = snap.data() || {};

      if (players[BLACK] === myUserId) { assignedColor = BLACK; isReconnect = true; }
      else if (players[WHITE] === myUserId) { assignedColor = WHITE; isReconnect = true; }
      else if (!players[WHITE]) { assignedColor = WHITE; }

      mpPlayers[assignedColor] = myUserId;
      hand = { [BLACK]: [], [WHITE]: [] };
      trapList = []; pendingTarget = null; draftOpen = false; draftPlayer = null; alk = null; alkHandoff = null;
      pendingPlacement = null; pendingCardUse = null; pendingTargetCell = null;
      moveHistory = [];
      logLines = []; mpNotice = null; mpNoticeSeq = 0; lastSeenNoticeSeq = 0; mpBannerText = null;
      mpShakeSeq = 0; lastSeenShakeSeq = 0;
      mpRestartSeq = data.restartSeq || 0; lastSeenRestartSeq = mpRestartSeq;
      board = unflattenBoard(data.board || flattenBoard());
      current = data.current || BLACK;
      winLength = data.winLength || 5;
      windmillList = data.windmillList || [];
      turnPlacementsDone = data.turnPlacementsDone || 0;
      turnPlacementsNeeded = data.turnPlacementsNeeded || 1;
      turnPlacedPositions = [];
      usedCardThisTurn = data.usedCardThisTurn || { [BLACK]: false, [WHITE]: false };
      cardLockNextTurn = data.cardLockNextTurn || { [BLACK]: false, [WHITE]: false };
      skipNextTurn = data.skipNextTurn || { [BLACK]: false, [WHITE]: false };
      placedCount = data.placedCount || { [BLACK]: 0, [WHITE]: 0 };
